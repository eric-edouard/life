# The gate on every push and pull request, on macOS and Windows: the same `bun run check` as the pre-push hook. Windows
# has no Life of its own yet (docs/plans/2026-10-22-platforms.md); this job is how its build and tests are checked.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}
          path: derived/check
