<!doctype html>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<meta content="noindex" name="robots">
<title>Decisions · Life</title>
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
>
<style>
/*TOKENS*/
body {
  margin: 0;
  font: 16px / 1.5 var(--serif);
  color: var(--ink);
  background: var(--white);
}
header {
  position: sticky;
  top: 0;
  padding: 12px 16px 0;
  background: var(--white);
  border-bottom: 1px solid var(--rule);
}
h1 {
  margin: 0 0 8px;
  font-size: 28px;
}
nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
}
nav button {
  all: unset;
  padding: 8px 10px 10px;
  font: 500 13px / 1 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
nav button[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
nav .n {
  margin-left: 6px;
  color: var(--ink);
}
main {
  display: grid;
  gap: 14px;
  max-width: 640px;
  padding: 16px;
  margin: 0 auto;
}
article {
  display: grid;
  gap: 12px;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--panel-radius);
}
h2 {
  margin: 0;
  font-size: 19px;
  line-height: 1.3;
}
.draft {
  padding: 6px 10px;
  font-size: 15px;
  white-space: pre-wrap;
  border-left: 3px solid var(--rule);
}
.opts {
  display: grid;
  gap: 8px;
}
.opt {
  all: unset;
  box-sizing: border-box;
  display: grid;
  gap: 2px;
  padding: 12px 14px;
  cursor: pointer;
  border: 1.5px solid var(--rule);
  border-radius: var(--control-radius);
}
.opt[aria-checked="true"] {
  color: var(--white);
  background: var(--ink);
  border-color: var(--ink);
}
.opt .c {
  font-size: 13.5px;
  opacity: 0.75;
}
.opt .d {
  padding-top: 6px;
  font-size: 14px;
  white-space: pre-wrap;
}
.opt .pick::after {
  content: " ●";
}
textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 8px 10px;
  font: 15px / 1.4 var(--serif);
  color: inherit;
  resize: vertical;
  background: transparent;
  border: 1px dashed var(--rule);
  border-radius: var(--control-radius);
}
.more {
  all: unset;
  font: 500 12px / 1.4 var(--mono);
  color: var(--muted);
  text-decoration: underline;
  cursor: pointer;
}
.ctx,
.res {
  font-size: 14px;
  color: var(--muted);
}
.past {
  padding-top: 10px;
  font-size: 14px;
  color: var(--muted);
  border-top: 1px solid var(--rule);
}
.quiet {
  color: var(--muted);
}
#flash {
  position: fixed;
  bottom: 16px;
  left: 50%;
  padding: 8px 14px;
  font: 500 13px var(--mono);
  color: var(--white);
  background: var(--ink);
  border-radius: var(--control-radius);
  transform: translateX(-50%);
}
</style>
<header>
  <h1>Decisions</h1>
  <nav id="tabs"></nav>
</header>
<main id="main"><p class="quiet">Loading…</p></main>
<div hidden id="flash"></div>
<script defer src="decisions.js"></script>
