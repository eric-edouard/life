<!doctype html>
<meta charset="utf-8">
<meta
  content="width=device-width, initial-scale=1, viewport-fit=cover"
  name="viewport"
>
<meta content="noindex" name="robots">
<title>Decisions · Life</title>
<style>
/*TOKENS*/
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  display: flex;
  font: 17px / 1.55 var(--sans);
  color: var(--ink);
  background: var(--white);
}
button {
  font: inherit;
  color: inherit;
}
:root :focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 3px;
}
/* Read aloud, not shown. */
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
/* The overview: a sidebar from 900 px, a sheet from the top below that. */
#list {
  flex: 0 0 360px;
  height: 100%;
  padding: 32px 20px;
  overflow-y: auto;
  background: var(--surface);
}
#list header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 12px 16px;
}
#list h1 {
  margin: 0;
  font: 600 22px / 1.2 var(--serif);
}
.count {
  font-size: 15px;
  color: var(--muted);
}
.group {
  padding-bottom: 16px;
}
.group h2 {
  padding: 4px 12px 6px;
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
}
.row {
  all: unset;
  box-sizing: border-box;
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 13px 12px;
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  border-radius: 10px;
}
.row[aria-current="true"] {
  font-weight: 700;
  color: var(--ink);
  background: var(--white);
}
.row.done {
  color: var(--muted);
}
.mark {
  flex: 0 0 18px;
  height: 18px;
  border: 2px solid var(--muted);
  border-radius: 9px;
}
.row[aria-current="true"] .mark {
  border-color: var(--ink);
}
.row.done .mark {
  position: relative;
  background: var(--synced);
  border: 0;
}
.row.done .mark::after {
  position: absolute;
  top: 4px;
  left: 6px;
  width: 4px;
  height: 8px;
  content: "";
  border: solid var(--white);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.side {
  padding: 4px 12px;
  font-size: 14px;
  color: var(--muted);
}
.link {
  all: unset;
  font-size: 15px;
  color: var(--text);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
/* Desktop scrolls freely, the sidebar picks; only the phone snaps to a decision. */
#main {
  flex: 1;
  height: 100%;
  overflow-y: auto;
}
#bar {
  position: sticky;
  top: 0;
  z-index: 2;
  display: none;
  width: 100%;
  padding: max(14px, env(safe-area-inset-top)) 24px 10px;
  cursor: pointer;
  background: var(--white);
  border: 0;
}
#bar .seg {
  display: flex;
  gap: 4px;
}
#bar .seg span {
  flex: 1;
  height: 4px;
  background: var(--rule);
  border-radius: 2px;
}
#bar .seg .on {
  background: var(--synced);
}
#bar .seg .here {
  background: var(--ink);
}
#bar .hint {
  display: block;
  margin-top: 8px;
  font-size: 14px;
  color: var(--muted);
  text-align: center;
}
section {
  display: flex;
  flex-direction: column;
  gap: 32px;
  justify-content: center;
  max-width: 784px;
  min-height: 100%;
  padding: 56px 72px;
  margin: 0 auto;
}
.where {
  font-size: 15px;
  color: var(--muted);
}
.q {
  margin: 0;
  font: 600 44px / 1.15 var(--serif);
  letter-spacing: -0.01em;
}
.draft {
  padding: 22px 26px;
  font-size: 18px;
  white-space: pre-wrap;
  background: var(--surface);
  border-radius: 14px;
}
.to,
.res,
.ctx {
  margin: 0;
  font-size: 15px;
  color: var(--text);
}
.opts {
  display: grid;
  gap: 10px;
}
.opt {
  all: unset;
  display: grid;
  gap: 4px;
  padding: 19px 24px;
  font-size: 19px;
  cursor: pointer;
  border: 1px solid var(--rule);
  border-radius: var(--control-radius);
}
.opt.pick {
  font-weight: 700;
  color: var(--white);
  background: var(--ink);
  border-color: var(--ink);
}
.opt[aria-checked="true"] {
  font-weight: 700;
  color: var(--white);
  background: var(--synced);
  border-color: var(--synced);
}
.opt[disabled] {
  cursor: default;
  opacity: 0.6;
}
.opt .c,
.opt .d {
  font-size: 15px;
  font-weight: 400;
  opacity: 0.85;
}
.opt .d {
  white-space: pre-wrap;
}
textarea {
  width: 100%;
  padding: 12px 14px;
  font: 17px / 1.45 var(--sans);
  color: inherit;
  resize: vertical;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: var(--control-radius);
}
label {
  display: grid;
  gap: 6px;
  font-size: 15px;
  color: var(--text);
}
.links {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
.theme {
  display: flex;
  gap: 14px;
  align-items: baseline;
  padding: 24px 12px 0;
  font-size: 14px;
  color: var(--muted);
}
.theme [aria-pressed="true"] {
  font-weight: 700;
  color: var(--ink);
  text-decoration: none;
}
.quiet {
  color: var(--muted);
}
#flash {
  position: fixed;
  bottom: 24px;
  left: 50%;
  z-index: 5;
  padding: 10px 16px;
  font-size: 15px;
  color: var(--white);
  background: var(--ink);
  border-radius: var(--control-radius);
  transform: translateX(-50%);
}
@media (max-width: 899px) {
  #list {
    position: fixed;
    inset: 0 0 auto;
    z-index: 4;
    visibility: hidden;
    height: auto;
    max-height: 88%;
    padding-top: max(24px, env(safe-area-inset-top));
    background: var(--white);
    border-radius: 0 0 24px 24px;
    box-shadow: 0 1px 0 var(--rule);
    transform: translateY(-105%);
    transition:
      transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1),
      visibility 0s 280ms;
  }
  body.sheet #list {
    visibility: visible;
    transform: none;
    transition: transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #main {
    scroll-snap-type: y proximity;
  }
  #bar {
    display: block;
  }
  section {
    gap: 22px;
    justify-content: flex-end;
    min-height: calc(100% - 64px);
    padding: 24px;
    scroll-snap-align: start;
    /* Below the sticky bar, so a decision's first line is never under it. */
    scroll-margin-top: 64px;
  }
  .q {
    font-size: 32px;
  }
}
@media (prefers-reduced-motion: reduce) {
  #list {
    transition: none;
  }
}
</style>
<aside aria-label="All decisions" id="list"></aside>
<main id="main">
  <button
    aria-expanded="false"
    aria-label="Show all decisions"
    id="bar"
    type="button"
  ></button>
  <div id="cards">
    <section><p class="quiet">Loading…</p></section>
  </div>
</main>
<div hidden id="flash" role="status"></div>
<script src="decisions.js" type="module"></script>
