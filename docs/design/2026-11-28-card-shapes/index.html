<!doctype html>
<!-- Card shapes (exploration, 28 Nov 2026): what goes in a card, drawn three ways on App v4's card kinds (data.js).
     A: one shared shape, every middle a box of facts. B: a shape per kind, the middle drawn as the thing it is (App v4's
     bodies). C: spoken and cinematic, Life saying the card as a sentence with the thing itself under it.
     Every card sits folded in the turn by turn's sideways row (turn by turn v2's shell and edge) and unfolds on a tap.
     Kept on every card, as decided on 28 Nov: one main button and small pills (Later among them), what happens if he
     doesn't answer, Life's plan steps, the sources read, and his next asks once he answered. Pick a kind and a variation
     above the phone; nothing reloads. Made-up data only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card shapes: one shape, a shape per kind, spoken</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="../2026-11-27-turn-by-turn-v2/edge.css">
<link rel="stylesheet" href="../2026-11-27-turn-by-turn-v2/shell.css">
<style>
/* the page: pickers beside the phone, above it on a phone */
.cmp{display:flex;align-items:center;justify-content:center;gap:32px;min-height:100vh;padding:20px}
.pick{width:280px;flex:none;display:flex;flex-direction:column;gap:6px}
.pick b{font-size:var(--text-heading);font-weight:600;color:var(--muted);margin:8px 0 2px}
.bar{display:flex;flex-wrap:wrap;gap:6px}
.bar button{height:32px;padding:0 13px;border-radius:16px;background:#1d1e23;font-size:13.5px;font-weight:600;white-space:nowrap}
.bar button[aria-pressed="true"]{background:var(--fg);color:var(--on)}
.note{margin:6px 0 0;font-size:var(--text-line);line-height:1.4;color:var(--muted)}
@media (max-width:500px){
  .cmp{flex-direction:column;align-items:stretch;gap:0;padding:0}
  .pick{width:auto;padding:8px 12px 10px;gap:4px}.pick b{display:none}.note{display:none}
  .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
  .cmp .fit{width:100vw!important;height:calc(100dvh - var(--pickh,92px))!important}.cmp .ph{height:100%}}

/* the thread around the row: his ask, Life's one line */
.me{align-self:flex-end;margin-top:8px;padding:10px 14px;border-radius:20px;background:var(--tint);font-weight:600}
.lead{margin:16px 0 12px;font-size:var(--text-title);font-weight:600}
.s-row{align-items:flex-start;position:relative}

/* a card, any variation: folded it is its head; a tap unfolds the rest in one 0.4 s reveal; ⌃ folds it */
.cd{flex:0 0 calc(100% - 24px);min-width:0;scroll-snap-align:start;border-radius:22px;background:var(--card);padding:14px;text-align:left;transition:background .3s}
.cd.open{background:color-mix(in srgb,var(--fg) 6%,var(--card))}
.hd{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.hd:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:12px}
.chev{flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.cd:not(.open) .chev{transform:rotate(180deg)}
.u{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.cd.open .u{grid-template-rows:1fr}
.ui{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.ui>:first-child{margin-top:14px}
.disc{flex:none;width:40px;height:40px;border-radius:20px;background:color-mix(in srgb,var(--h,var(--fg)) 24%,var(--tile));display:flex;align-items:center;justify-content:center;font-weight:650;font-size:16px}
.disc.ic{background:var(--tile)}
.disc svg{width:20px;height:20px}
.disc.wa svg{width:40px;height:40px}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:var(--text-title);font-weight:650;line-height:1.3}
.tx small{display:block;font-size:var(--text-line);color:var(--muted);line-height:1.35}
.td{font-style:normal;color:var(--flag)}
.why{margin:0;font-size:14.5px;line-height:1.45;color:#b9b4aa}
.q{margin:0;font-size:var(--text-header);font-weight:650;line-height:1.3}
/* the parts every card keeps */
.src{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--wash);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip svg{width:13px;height:13px}
.sil{margin:0;display:flex;gap:8px;font-size:var(--text-line);line-height:1.4;color:var(--muted)}
.sil svg{flex:none;width:15px;height:15px;margin-top:2px}
.ans{display:flex;flex-direction:column;gap:8px}
.go{width:100%;height:46px;border-radius:23px;background:var(--fg);color:var(--on);font-size:var(--text-body);font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .3s,color .3s}
.go.busy{background:var(--tint);color:var(--fg)}
.go.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.go svg{width:17px;height:17px}
.pills{display:flex;justify-content:center;gap:6px}
.pl{height:30px;padding:0 13px;border-radius:15px;background:var(--tint);font-size:13px;font-weight:600}
.res{display:flex;align-items:center;gap:8px;min-height:30px;font-size:14px;font-weight:650;color:var(--muted)}
.res.ok{color:var(--ok)}
.res svg{width:17px;height:17px}
.fol{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.fol button{display:flex;align-items:center;gap:8px;min-height:34px;padding:6px 8px 6px 13px;border-radius:17px;background:var(--tint);font-size:13.5px;font-weight:600;text-align:left;animation:in .35s both}
.fol button i{flex:none;width:22px;height:22px;border-radius:11px;box-shadow:inset 0 0 0 1.4px var(--muted);display:flex;align-items:center;justify-content:center}
.fol button svg{width:12px;height:12px}
.cd.settled .ans .go,.cd.settled .ans .pills{display:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

/* A: one shape. Every middle is the same box of label and value rows */
.box{border-radius:var(--block-radius);background:var(--tile);padding:6px 14px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;font-size:14.5px;line-height:1.4}
.kv>span{color:var(--muted);font-size:var(--text-line)}
.kv .mono{font-family:var(--font-mono);font-size:13px}
.kv .dash{padding:6px 10px;border-radius:12px;outline:1.5px dashed rgba(37,211,102,.55);outline-offset:-1.5px}
.kv .ai,.ai{color:var(--ai)}
.kv .rad{display:inline-block;width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--muted);margin-right:6px;vertical-align:-1px}
.kv .rad.on{box-shadow:inset 0 0 0 4px var(--fg)}
.boxh{font-size:var(--text-heading);font-weight:600;color:var(--muted);margin:0 0 -8px}

/* B: a shape per kind (App v4's bodies). The fold shows the kind's own peek; open, the whole thing */
.peek{margin-top:10px}
.cd.open .peek{display:none}
.chat{display:flex;flex-direction:column;gap:6px}
.chead{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.appm{flex:none;width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.appm svg{width:26px;height:26px}
.chead b{font-size:var(--text-body);font-weight:650}
.openw{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;border-radius:14px;background:rgba(37,211,102,.12);color:#5fd88f;font-size:12.5px;font-weight:650}
.openw svg{width:13px;height:13px}
.cm{max-width:84%;padding:8px 12px 7px;border-radius:16px;font-size:var(--text-body);line-height:1.4}
.cm.in{align-self:flex-start;background:#17181c;border-top-left-radius:5px}
.cm .tm{margin-left:8px;font-size:11px;color:var(--muted)}
.cm.draft{align-self:flex-end;background:rgba(37,211,102,.08);outline:1.5px dashed rgba(37,211,102,.55);outline-offset:-1.5px;border-top-right-radius:5px;transition:outline-color .6s,background .6s}
.cd.sent .cm.draft{outline-color:transparent;background:rgba(37,211,102,.16)}
.peek .cm.draft{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unrel{align-self:center;font-size:12px;color:var(--muted)}
.edits{display:flex;justify-content:flex-end;gap:6px}
.edits button{height:30px;padding:0 12px;border-radius:15px;background:var(--tint);font-size:13px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;padding:12px 14px;border-radius:var(--block-radius);background:var(--tile);text-align:left;transition:background .25s}
.opt.sel{background:color-mix(in srgb,var(--fg) 9%,var(--tile))}
.opt .rad{flex:none;width:18px;height:18px;border-radius:9px;margin-top:2px;box-shadow:inset 0 0 0 1.6px var(--muted);transition:box-shadow .25s}
.opt.sel .rad{box-shadow:inset 0 0 0 5.5px var(--fg)}
.opt b{display:block;font-size:var(--text-body);font-weight:650}
.opt small{display:block;font-size:var(--text-line);color:var(--muted);margin-top:2px}
.opt .tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:650;color:var(--ai)}
.opt .gm{display:inline-flex;align-items:center;gap:4px;margin:8px 0 0;height:26px;padding:0 10px;border-radius:13px;background:var(--wash);font-size:12px;font-weight:650;color:var(--muted)}
.bankb{border-radius:var(--block-radius);background:var(--tile);padding:14px}
.amt{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.bankb .kv{grid-template-columns:76px 1fr;padding:6px 0}
.bankb .amt{margin-bottom:6px}
.link{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:650;color:var(--fg)}
.link svg{width:15px;height:15px}
.cpy{float:right;font-style:normal;color:var(--muted);font-size:12px;font-weight:650}
.qrb{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:var(--block-radius);background:var(--tile);padding:16px}
.qrb svg{width:150px;height:150px;border-radius:10px;background:var(--fg);padding:8px}
.qrb small{font-size:var(--text-line);color:var(--muted)}
.tel{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--tint);font-size:var(--text-title);font-weight:650;font-variant-numeric:tabular-nums}
.tel svg{width:18px;height:18px}
.say2{border-radius:var(--block-radius);background:var(--paper);padding:12px 14px;font-size:var(--text-body);line-height:1.45}
.say2 small{display:block;font-size:var(--text-heading);font-weight:600;color:var(--muted);margin-bottom:4px}
.dayv{border-radius:var(--block-radius);background:var(--tile);padding:12px 14px}
.dayv .dh{font-size:var(--text-heading);font-weight:600;color:var(--muted);margin-bottom:4px}
.dayv .r{display:flex;gap:14px;padding:7px 8px;margin:0 -8px;border-radius:12px;font-size:var(--text-body)}
.dayv .r span{width:46px;color:var(--muted);font-variant-numeric:tabular-nums}
.dayv .r.new{background:var(--wash);font-weight:650}
.rems{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rems span{height:28px;padding:0 11px;border-radius:14px;background:var(--tint);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center}
.gauge{height:6px;border-radius:3px;background:var(--tint);margin:10px 0 6px;overflow:hidden}
.gauge i{display:block;height:100%;width:40%;border-radius:3px;background:var(--fg)}
.lkp{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--block-radius);background:var(--tile)}
.lkp .lm{flex:none;width:36px;height:36px;border-radius:9px;background:#107ACA;color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.lkp span{flex:1;min-width:0}
.lkp small{display:block;font-size:12px;color:var(--muted)}
.lkp b{display:block;font-size:var(--text-title);font-weight:650}
.lkp em{display:block;font-style:normal;font-size:var(--text-line);color:var(--muted)}
.lkp .tag{font-size:12px;font-weight:650;color:var(--ai)}
.lkp>svg{flex:none;width:17px;height:17px;color:var(--muted)}
.plan{display:flex;flex-direction:column}
.ps{position:relative;display:flex;gap:12px;padding-bottom:14px}
.ps:last-child{padding-bottom:0}
.ps::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:2px;border-radius:1px;background:var(--tint)}
.ps:last-child::before{display:none}
.ps i{flex:none;width:12px;height:12px;border-radius:6px;margin-top:4px;background:var(--ai)}
.ps.you i{background:var(--fg)}
.ps b{display:block;font-size:var(--text-body);font-weight:600;line-height:1.35}
.ps small{display:block;font-size:var(--text-line);color:var(--muted)}
.ps.you b::after{content:" · you";font-weight:600;color:var(--muted)}
.vclip{display:flex;gap:12px;align-items:flex-start}
.vplay{flex:none;width:40px;height:40px;border-radius:20px;background:var(--fg);color:var(--on);display:flex;align-items:center;justify-content:center}
.vplay svg{width:16px;height:16px}
.vtx{flex:1;font-size:var(--text-body);line-height:1.5;color:var(--muted)}
.vtx small{display:block;font-size:12px;margin-top:4px}
.vtx.on .w{animation:lit .25s forwards;animation-delay:calc(var(--i) * 160ms)}
@keyframes lit{to{color:var(--fg)}}
.guess{display:flex;align-items:center;gap:12px}
.guess .disc{width:52px;height:52px;border-radius:26px;font-size:20px}
.guess b{display:block;font-size:var(--text-title);font-weight:650}
.guess small{display:block;font-size:12.5px;font-weight:650;color:var(--ai)}
.others{display:flex;gap:8px;align-items:center;font-size:var(--text-line);color:var(--muted)}
.others .disc{width:30px;height:30px;font-size:12.5px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;font-size:var(--text-body);line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:13px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650}
.docr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--block-radius);background:var(--tile)}
.docr>svg:first-child{flex:none;width:22px;height:22px;color:var(--muted)}
.docr span{flex:1}.docr b{display:block;font-size:var(--text-body);font-weight:650}.docr small{color:var(--muted);font-size:var(--text-line)}
.docr>svg:last-child{width:17px;height:17px;color:var(--muted)}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idc{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--block-radius);background:var(--tile);min-width:0}
.idc .disc{width:34px;height:34px;font-size:14px}
.idc b{font-size:13px;font-weight:650;font-family:var(--font-mono);overflow-wrap:anywhere}
.idc small{font-size:12.5px;color:var(--muted)}
.idc em{font-style:normal;font-size:12px;font-weight:650;color:var(--muted)}
.orgl{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0}
.orgl>span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--text-line);font-weight:600}
.orgl .disc{width:52px;height:52px;border-radius:26px;font-size:20px}
.orgl>svg{width:22px;height:22px;color:var(--muted);margin-bottom:22px}
.peekr{display:flex;align-items:center;gap:10px;font-size:var(--text-line);color:var(--muted);min-width:0}
.peekr b{color:var(--fg);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peekr .big{font-size:var(--text-header)}

/* C: spoken. The head is Life's sentence; open, it inks in again and the thing itself stands under it */
.v-c .hd{align-items:flex-start;gap:12px}
.v-c .hd .disc{width:32px;height:32px;font-size:13px;margin-top:2px}
.v-c .hd .disc svg{width:16px;height:16px}
.v-c .hd .disc.wa svg{width:32px;height:32px}
.say{flex:1;min-width:0;margin:0;font-size:var(--text-header);font-weight:600;line-height:1.32;letter-spacing:-.01em;color:var(--muted)}
.say b{font-weight:650;color:var(--fg)}
.cd.v-c:not(.open) .say{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.say .w{display:inline}
.cd.v-c.open .say .w{animation:ink .5s both;animation-delay:calc(var(--i) * 40ms)}
@keyframes ink{from{opacity:.15;filter:blur(6px)}}
.saidw{font-size:var(--text-meta);color:var(--faint);margin:4px 0 0}
.v-c .ui{gap:18px}
.v-c .hero{display:flex;flex-direction:column;gap:10px;animation:in .5s .35s both}
.bigfig{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.bigfig+small,.under{display:block;font-size:var(--text-body);color:var(--muted);margin-top:4px}
.v-c .vtx{font-size:var(--text-header);line-height:1.4}
.v-c .say2{font-size:var(--text-header);line-height:1.4;background:none;padding:0 0 0 14px;box-shadow:inset 2px 0 0 var(--tint);border-radius:0}
.other{align-self:flex-start;height:30px;padding:0 13px;border-radius:15px;background:var(--wash);font-size:13px;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.ph *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="cmp">
  <nav class="pick" aria-label="Pickers">
    <b>Variation</b><div class="bar" id="vars"></div>
    <b>Kind</b><div class="bar" id="kinds"></div>
    <p class="note" id="note"></p>
  </nav>
  <div class="fit"><div class="ph">
    <div class="sbar"><span>9:41</span><span>●●● ▮</span></div>
    <div class="s-top"><button type="button" class="s-count gl" id="count"></button><button type="button" class="s-pend gl" aria-label="Pendant, recording"><i></i></button></div>
    <div class="stage" id="stage"></div>
    <div class="field gl"><input type="text" id="ask" placeholder="Ask Life or hold to talk" aria-label="Ask Life" autocomplete="off">
      <button type="button" class="k mic" aria-label="Talk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button></div>
    <div class="home"></div>
  </div></div>
</main>
<script src="../2026-11-27-turn-by-turn-v2/edge.js"></script>
<script src="data.js"></script>
<script>
var S='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
function svg(d){return '<svg viewBox="0 0 24 24" '+S+' aria-hidden="true">'+d+'</svg>';}
var I={pin:svg('<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/>'),
  bank:svg('<path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>'),
  cal:svg('<rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>'),
  search:svg('<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>'),
  link:svg('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
  wave:svg('<path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>'),
  person:svg('<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>'),
  check:svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),open:svg('<path d="M8 16 16 8M9.5 8H16v6.5"/>'),up:svg('<path d="m6 14 6-6 6 6"/><path d="M12 8v10"/>'),
  phone:svg('<path d="M5 4h3.5l1.5 4-2.2 1.4a11 11 0 0 0 6.8 6.8L16 14l4 1.5V19a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/>'),
  doc:svg('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>'),chev:svg('<path d="m6 15 6-6 6 6"/>'),arrow:svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  read:svg('<path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/>'),

var QR=(function(){var n=25,s='',seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280;}

  for(var y=0;y<n;y++)for(var x=0;x<n;x++){if(f(x,y))continue;if(r()>.52)s+='M'+x+' '+y+'h1v1h-1z';}
  [[0,0],[n-7,0],[0,n-7]].forEach(function(p){s+='M'+p[0]+' '+p[1]+'h7v7h-7zM'+(p[0]+1)+' '+(p[1]+1)+'v5h5v-5zM'+(p[0]+2)+' '+(p[1]+2)+'h3v3h-3z';});

/* A: every middle as the same box of rows */
function kv(l,v,cls){return '<div class="kv"><span>'+l+'</span><span'+(cls?' class="'+cls+'"':'')+'>'+v+'</span></div>';}
function aBox(k){var r=[];
  if(k.chat){k.chat.msgs.forEach(function(m){r.push(m.u?kv('',m.u+' unrelated messages'):kv(k.chat.name+' · '+m.at,m.t));});r.push(kv('Your reply',k.chat.draft,'dash'));}
  if(k.picks)k.picks.forEach(function(p){r.push(kv(p.best?'<span class="ai">Life’s pick</span>':'Or','<span class="rad'+(p.best?' on':'')+'"></span><b>'+p.n+'</b><br>'+p.d));});
  (k.needs||[]).forEach(function(n){
    if(n.kind==='amount')r.push(kv('Amount','<b>'+n.v+'</b>'));
    if(n.kind==='account'){r.push(kv('To',n.holder));if(n.number)r.push(kv(n.scheme,n.number,'mono'));}
    if(n.kind==='text')r.push(kv(n.label,n.t));
    if(n.kind==='app')r.push(kv('Pay in','Your bank app ↗'));
    if(n.kind==='qr')r.push(kv('Code','From '+n.from+', saved to your photos'));
    if(n.kind==='event'){r.push(kv('What',n.title));r.push(kv('When',n.day+', '+n.time));r.push(kv('Where',n.place));r.push(kv('Reminders',n.reminders.join(' · ')));}
    if(n.kind==='apify'){r.push(kv('What',n.what));r.push(kv('About',n.est));r.push(kv('Stops at',n.cap));}
    if(n.kind==='link')r.push(kv(n.best?'<span class="ai">Life’s pick</span>':n.site,n.key+' · '+n.t+' ↗'));});
  if(k.call){r.push(kv('Number',k.call.num));r.push(kv('What to say',k.call.script));}
  if(k.quote)r.push(kv(k.quote.who+' · '+k.quote.at,'“'+k.quote.t+'”'));
  if(k.clip)r.push(kv('Heard '+(k.clip.at||''),'“'+k.clip.t+'”'));
  if(k.guess)r.push(kv('<span class="ai">Life’s guess</span>',k.guess.n));
  if(k.steps)k.steps.forEach(function(s,i){r.push(kv('Step '+(i+1),s));});
  if(k.doc)r.push(kv('File',k.doc.n+' · '+k.doc.size));
  if(k.people)k.people.forEach(function(p){r.push(kv(p.via,p.h+'<br>“'+p.last+'”'));});
  if(k.org){r.push(kv('Person',k.org.p));r.push(kv('At',k.org.o));r.push(kv('Role',k.org.role));}
  var plans=k.plan?'<p class="boxh">After your yes</p><div class="box">'+k.plan.map(function(p){return kv(p.by==='you'?'You':'Life',p.t+(p.when?' · '+p.when:''));}).join('')+'</div>':'';
  return (r.length?'<div class="box">'+r.join('')+'</div>':'')+plans;}

var HERO={payment:function(k){var c=need(k,'account'),r=need(k,'text');return '<div><div class="bigfig">'+need(k,'amount').v+'</div><span class="under">to '+c.holder+'</span></div>'+
    '<div class="bankb"><div class="kv"><span>'+c.scheme+'</span><b style="font-family:var(--font-mono);font-size:13px;font-weight:450">'+c.number+'</b></div><div class="kv"><span>'+r.label+'</span><span>'+r.t+'<em class="cpy">Copy</em></span></div></div><span class="link">Open your bank '+I.open+'</span>';},
  event:function(k){var e=need(k,'event');return '<div><div class="bigfig">Thu '+e.time+'</div><span class="under">'+e.place+'</span></div><div class="rems" style="margin:0">'+e.reminders.map(function(r){return '<span>'+r+'</span>';}).join('')+'</div>';},
  search:function(k){var a=need(k,'apify');return '<div><div class="bigfig">'+a.est+'</div><span class="under">'+a.what+', stopping at '+a.cap+'</span></div>';},
  pick:function(k){return picks(k,1)+'<button type="button" class="other" data-swap>or '+k.picks[1].n+'</button>';},

  message:function(k){var c=k.chat,last=c.msgs[c.msgs.length-1];return '<div class="chat"><div class="cm in">'+last.t+'<span class="tm">'+last.at+'</span></div><div class="cm draft">'+c.draft+'</div></div><div class="edits">'+c.edits.map(function(e){return '<button type="button">'+e+'</button>';}).join('')+'</div>';},
  ending:function(k){return '<div class="say2"><small>'+k.quote.who+' · '+k.quote.app+' · '+k.quote.at+'</small>“'+k.quote.t+'”</div>';},

function cardHtml(k){var head,body,o=opened.has(k.id),a=ans[k.id];
  var top=V==='c'?disc(k)+'<p class="say">'+words(k.say)+'</p>':disc(k)+'<span class="tx"><b>'+k.ask+'</b><small>'+line(k)+'</small></span>';
  head='<div class="hd" role="button" tabindex="0" aria-expanded="'+o+'">'+top+'<span class="chev">'+I.chev+'</span></div>';
  if(V==='a')body='<p class="why">'+k.why+'</p>'+(k.q?'<p class="q">'+k.q+'</p>':'')+aBox(k)+srcs(k)+sil(k)+answers(k);
  else if(V==='b')head+='<div class="peek">'+PEEK[k.id](k)+'</div>',body='<p class="why">'+k.why+'</p>'+BODY[k.id](k)+plan(k)+(k.q?'<p class="q">'+k.q+'</p>':'')+srcs(k)+sil(k)+answers(k);
  else body='<div class="hero">'+(HERO[k.id]||BODY[k.id])(k)+'</div>'+plan(k)+srcs(k)+sil(k)+answers(k);
  return '<article class="cd v-'+V+(o?' open':'')+(a?' settled':'')+(a&&a.ok&&k.chat?' sent':'')+'" data-id="'+k.id+'">'+head+'<div class="u"><div class="ui">'+body+'</div></div></article>';}

function showCount(){var n=CARDS.filter(function(k){return !ans[k.id];}).length;count.textContent=n;count.setAttribute('aria-label',n+' waiting on you');}
function press(bar,v){document.querySelectorAll('#'+bar+' button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});}
function render(){var keep=list?list.scrollLeft:0;
  stage.innerHTML='<div class="me">What’s waiting on me?</div><p class="lead">'+CARDS.length+' things wait on you, Jade first.</p>';
  row=document.createElement('div');row.className='s-cards many';list=document.createElement('div');list.className='s-row';row.appendChild(list);
  list.innerHTML=CARDS.map(cardHtml).join('');
  var dots=document.createElement('div');dots.className='s-dots';dots.setAttribute('aria-hidden','true');dots.innerHTML=CARDS.map(function(){return '<i></i>';}).join('');row.appendChild(dots);
  stage.appendChild(row);list.scrollLeft=keep;
  list.addEventListener('scroll',function(){var w=list.firstChild.offsetWidth+10,i=Math.round(list.scrollLeft/w);[].forEach.call(dots.children,function(d,j){d.classList.toggle('on',j===i);});
    if(i!==at&&CARDS[i]){at=i;press('kinds',CARDS[i].id);}},{passive:true});
  [].forEach.call(dots.children,function(d,j){d.classList.toggle('on',j===at);});
  drag();showCount();press('vars',V);document.getElementById('note').textContent=VARS[V][1];}
function go(i,smooth){at=i;var e=list.children[i];list.scrollTo({left:e.offsetLeft-20,behavior:smooth?'smooth':'auto'});press('kinds',CARDS[i].id);}

/* a mouse drag pages by one card (a mouse has no sideways scroll); a drag is never a tap */
var moved=false;
function drag(){var x0=null;list.addEventListener('pointerdown',function(e){moved=false;if(e.pointerType==='mouse')x0=e.clientX;});
  list.addEventListener('pointermove',function(e){if(x0!==null&&Math.abs(e.clientX-x0)>8)moved=true;});
  list.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>30)go(Math.max(0,Math.min(CARDS.length-1,at+(dx<0?1:-1))),true);});}

function toggle(card){var id=card.dataset.id,o=!card.classList.contains('open');card.classList.toggle('open',o);card.querySelector('.hd').setAttribute('aria-expanded',String(o));
  if(o)opened.add(id);else opened.delete(id);}
/* an answer: the button turns to doing, then its result for a second, then the card settles in its state and his next asks show */
function answer(card,b){var k=CARDS.find(function(x){return x.id===card.dataset.id;});if(ans[k.id]||b.disabled)return;
  var res=card.querySelector('.res'),fol=card.querySelector('.fol');
  function settle(t,ok){ans[k.id]={t:t,ok:ok};res.hidden=false;res.className='res'+(ok?' ok':'');res.innerHTML=(ok?I.check:'')+t;card.classList.add('settled');fol.hidden=false;showCount();}
  if(b.dataset.a!=='main'){settle(k.pills[+b.dataset.a][1],false);return;}
  b.disabled=true;b.classList.add('busy');b.textContent=k.main.doing;
  setTimeout(function(){b.classList.remove('busy');b.classList.add('ok');b.innerHTML=I.check+k.main.done;if(k.chat)card.classList.add('sent');Edge.set('landed');
    setTimeout(function(){settle(k.main.done,true);},1000);},900);}
stage.addEventListener('click',function(e){if(moved)return;var t=e.target,card=t.closest('.cd');if(!card)return;
  var b=t.closest('[data-a]');if(b)return answer(card,b);
  var f=t.closest('[data-f]');if(f){field.value=f.textContent;field.focus();return;}
  var p=t.closest('[data-play]');if(p){var v=p.nextElementSibling;v.classList.remove('on');void v.offsetWidth;v.classList.add('on');return;}
  var o=t.closest('[data-pick]');if(o){card.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('sel',x===o);});var k=CARDS.find(function(x){return x.id===card.dataset.id;});
    var g=card.querySelector('.go');if(g&&!g.disabled)g.textContent='Book '+k.picks[+o.dataset.pick].n.split(/[ ,]/)[0];return;}
  if(t.closest('[data-swap]')){var k2=CARDS.find(function(x){return x.id===card.dataset.id;});k2.picks.reverse();k2.picks.forEach(function(p,i){p.best=i===0?1:0;});
    card.querySelector('.hero').innerHTML=HERO.pick(k2);var g2=card.querySelector('.go');if(g2&&!g2.disabled)g2.textContent='Book '+k2.picks[0].n.split(/[ ,]/)[0];return;}
  if(t.closest('.hd'))toggle(card);});
stage.addEventListener('keydown',function(e){var h=e.target.closest('.hd');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle(h.closest('.cd'));}});

/* the pickers: a variation redraws the row where it was; a kind swipes to its card and unfolds it */
Object.keys(VARS).forEach(function(v){var b=document.createElement('button');b.type='button';b.dataset.v=v;b.textContent=VARS[v][0];
  b.onclick=function(){V=v;history.replaceState(null,'','#'+v);render();go(at);};document.getElementById('vars').appendChild(b);});
CARDS.forEach(function(k,i){var b=document.createElement('button');b.type='button';b.dataset.v=k.id;b.textContent=k.label;
  b.onclick=function(){go(i,true);var c=list.children[i];if(!c.classList.contains('open'))toggle(c);};document.getElementById('kinds').appendChild(b);});

/* the phone fills the height beside the pickers, or the screen under them on a phone */
function fit(){var ph=document.querySelector('.ph'),box=ph.parentNode;
  if(innerWidth<=500){document.documentElement.style.setProperty('--pickh',document.querySelector('.pick').offsetHeight+'px');ph.style.transform='';box.style.width=box.style.height='';return;}
  var k=Math.min(1,(innerHeight-40)/844);ph.style.transform='scale('+k+')';box.style.width=390*k+'px';box.style.height=844*k+'px';}
Edge.mount(document.querySelector('.ph'));addEventListener('resize',fit);
render();fit();go(0);
</script>
