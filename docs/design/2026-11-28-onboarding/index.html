<!doctype html>
<!-- Onboarding on the host, round 2 (28 Nov 2026): the setup window on a Mac (bundle M; "How far back" is bundle H), the
     same setup as a local page in the browser on Windows (bundle W), and the minimal menu bar and tray. Every screen
     reads one list, the integrations (integrations.js, packaging spec section 1), and a screen whose answer is already
     known is skipped (the side panel's "Reinstall" shows it), and every step can fail ("Things go wrong" shows how). Proposals: the whole setup is new; none of it is in App v4.
     Everything is made up. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboarding: the host</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="onboarding.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#121316;color:var(--fg);font-family:var(--sans);font-weight:450;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px}
.fit{flex:none;position:relative}
.stagebox{position:absolute;top:0;left:0;width:900px;height:720px;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.bundle{align-self:flex-start;margin-left:70px;font-size:var(--text-meta);font-weight:650;color:var(--muted)}
.bundle b{color:var(--fg);font-weight:650}
/* the side panel (the turn by turn pages' own) */
.side{width:280px;flex:none;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 40px);overflow-y:auto;scrollbar-width:thin}
.side h1{font-size:var(--text-header);font-weight:650;margin:0 0 2px}
.side p{font-size:var(--text-line);color:var(--muted);margin:0 0 8px;line-height:1.4}
.side h2{font-size:var(--text-heading);font-weight:600;color:var(--muted);margin:12px 0 2px}
.side button{text-align:left;min-height:38px;padding:8px 16px;border-radius:16px;background:#1d1e23;font-size:14px;font-weight:650}
.side button small{font-weight:450;color:var(--muted)}
.side button[aria-pressed="true"]{background:var(--fg);color:var(--on)}
.side button[aria-pressed="true"] small{color:var(--on);opacity:.7}
.side button.skipped{opacity:.45}
.side .two{display:flex;gap:6px}.side .two button{flex:1;text-align:center}
/* the Mac window: traffic lights, no title, the page inside */
.win{position:relative;width:780px;height:620px;border-radius:14px;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,248,234,.12);overflow:hidden;display:flex;flex-direction:column}
.tl{display:flex;gap:8px;padding:14px 16px;flex:none}
.tl i{width:12px;height:12px;border-radius:6px;background:#3a3b40}
/* the Windows browser: a tab, the address on loopback, the same page */
.browser{position:relative;width:860px;height:660px;border-radius:8px;background:#202124;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column}
.bt{display:flex;align-items:flex-end;height:38px;padding:0 8px;gap:8px;flex:none}
.bt .tab{height:32px;padding:0 14px;border-radius:8px 8px 0 0;background:#35363a;display:flex;align-items:center;gap:8px;font-size:12.5px;font-family:"Segoe UI",system-ui,sans-serif}
.bt .wc{margin-left:auto;display:flex;gap:26px;padding:0 10px 10px;font-size:12px;color:#9aa0a6;font-family:"Segoe UI",system-ui}
.ba{height:38px;background:#35363a;display:flex;align-items:center;padding:0 12px;gap:12px;flex:none;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;color:#9aa0a6}
.ba .url{flex:1;height:28px;border-radius:14px;background:#202124;display:flex;align-items:center;padding:0 14px;color:#e8eaed}
.ba .url span{color:#9aa0a6}
.browser .page{background:var(--bg)}
/* the page: one question, its body, Back and the one cream answer at the foot */
.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 56px 28px}
.body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.body::-webkit-scrollbar{display:none}
.body>*{animation:rise .35s ease-out both}
.still .body>*,.still .menu{animation:none}
.body>*:nth-child(2){animation-delay:.05s}.body>*:nth-child(3){animation-delay:.1s}.body>*:nth-child(4){animation-delay:.15s}
.mark{width:36px;height:36px;border-radius:9px;background:#0d0e11;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:22px}
h2.q{margin:6px 0 0;font-size:var(--text-profile);font-weight:650;letter-spacing:-.015em;line-height:1.2}
.lead{margin:-6px 0 0;font-size:var(--text-body);color:var(--muted);line-height:1.45;max-width:560px}
.foot{flex:none;display:flex;align-items:center;gap:12px;padding-top:12px}
.dots{display:flex;gap:6px;flex:1}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--tint);transition:background .3s,width .3s}
.dots i.on{background:var(--fg);width:18px}
.back{width:44px;height:44px;border-radius:22px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.back[hidden]{display:none}
.go{height:44px;min-width:150px;padding:0 24px;border-radius:22px;background:var(--fg);color:var(--on);font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s}
.go:disabled{background:var(--tint);color:var(--muted);cursor:default}
/* blocks */
.tile{background:var(--tile);border-radius:var(--block-radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:right}
.say{font-size:15px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:var(--text-heading);font-weight:600;color:var(--muted)}
.field input{height:46px;border-radius:var(--control-radius);background:var(--tile);border:0;outline:0;color:var(--fg);font:inherit;font-size:16px;padding:0 14px}
.field input:focus{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--glass)}
/* steps that tick themselves */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:center;font-size:15px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:12px;background:var(--glass);font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center}
.steps li.done{color:var(--muted)}.steps li.done::before{content:'✓';background:var(--ok);color:var(--on)}
.steps li.now::before{background:var(--fg);color:var(--on)}
.steps li small{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
/* value pills */
.vals{display:flex;gap:8px;flex-wrap:wrap}
.val{height:38px;padding:0 16px;border-radius:19px;background:var(--tint);font-size:14.5px;font-weight:600;transition:background .2s,color .2s}
.val[aria-pressed="true"]{background:var(--fg);color:var(--on)}
.val.other{color:var(--muted)}
/* an integration row: tick, its icon, its name, its value line (an ask and Life's answer), its privacy line, its state */
.rows{display:flex;flex-direction:column;gap:18px}
.irow{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.irow .tk{flex:none;width:20px;height:20px;border-radius:6px;background:var(--tint);margin-top:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650;color:var(--on);transition:background .2s}
.irow[aria-checked="true"] .tk{background:var(--fg)}.irow[aria-checked="true"] .tk::after{content:'✓'}
.irow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.irow b{font-size:var(--text-title);font-weight:650}.irow b small{font-weight:450;color:var(--muted);font-size:var(--text-line)}
.irow .vl{font-size:var(--text-line);line-height:1.4}
.irow .vl q{quotes:'“' '”'}.irow .vl span{color:var(--muted)}
.irow .st{flex:none;margin-top:6px;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:6px;min-height:22px}
.irow .st a{color:var(--fg);text-decoration:none;padding:6px 12px;border-radius:14px;background:var(--tint);font-size:13px}
/* the recovery key, shown once */
.key{font-family:var(--font-mono);font-size:19px;letter-spacing:.06em;text-align:center;padding:18px;border-radius:var(--block-radius);background:var(--paper)}
.chips{display:flex;gap:8px;justify-content:center}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--tint);font-size:13.5px;font-weight:600}
/* the phone step: the TestFlight invite as it arrives, then the QR */
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mail{background:#f3f4f5;color:#0d0e11;border-radius:var(--block-radius);padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.mail small{color:#57544f}.mail .tf{display:flex;align-items:center;gap:10px}.mail .tf i{width:34px;height:34px;border-radius:8px;background:#1f5f8b;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:650}
.mail .bt2{align-self:flex-start;padding:6px 14px;border-radius:14px;background:#1f5f8b;color:#fff;font-weight:650}
.qrw{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr{width:168px;height:168px;padding:10px;border-radius:var(--block-radius);background:var(--fg)}
.num{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.num i{font-style:normal;flex:none;width:22px;height:22px;border-radius:11px;background:var(--glass);color:var(--fg);font-size:12px;font-weight:650;display:flex;align-items:center;justify-content:center}
/* the desktop: the menu bar with Life's L and its menu; the Windows taskbar and its tray */
.desk{position:relative;width:860px;height:560px;border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 30% 10%,#2b3550,#141821 60%,#0c0d10)}
.mb{position:absolute;top:0;left:0;right:0;height:28px;background:rgba(20,21,24,.55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 14px;font-size:13px;font-weight:600}
.mb .l{position:relative;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:16px}
.mb .l.open{background:rgba(255,248,234,.18)}
.badge{position:absolute;top:1px;right:0;width:7px;height:7px;border-radius:4px;background:var(--flag);box-shadow:0 0 0 1.5px #1a1b1f}
.menu{position:absolute;width:300px;padding:6px;border-radius:12px;background:rgba(30,31,36,.82);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 .5px rgba(255,248,234,.14);font-size:13.5px;animation:rise .25s ease-out}
.menu .mi{display:flex;align-items:flex-start;gap:10px;padding:6px 10px;border-radius:7px}
.menu .mi:hover{background:rgba(255,248,234,.1)}
.menu .mi .d{flex:none;width:8px;height:8px;border-radius:4px;margin-top:6px;background:var(--faint)}
.menu .mi .d.connecting{background:var(--ai)}.menu .mi .d.broken,.menu .mi .d.waiting_on_user{background:var(--flag)}
.menu .mi span{flex:1}.menu .mi small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.menu .mi small.flag{color:var(--flag)}
.menu .sep{height:6px}
.menu .act{padding:6px 10px;border-radius:7px;font-weight:600}.menu .act:hover{background:rgba(255,248,234,.1)}
.tb{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(28,29,33,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 14px;font-family:"Segoe UI",system-ui,sans-serif;font-size:12px}
.tb .l{position:relative;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:18px}
.tb .l.open{background:rgba(255,248,234,.14)}
.tb .clock{text-align:right;line-height:1.3}
/* round 2: a failed step, groups, the System Settings pane as macOS draws it, a page opened inside Life's window */
.steps li{flex-wrap:wrap}.steps li.bad::before{content:'!';background:var(--flag);color:var(--on)}
.why{font-size:13.5px;color:var(--flag);display:flex;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.35}
.steps .why{flex-basis:100%;padding-left:36px}
.chip.sm{height:28px;padding:0 12px;font-size:12.5px;color:var(--fg)}
h3.grp{margin:8px 0 -4px;font-size:var(--text-heading);font-weight:650;color:var(--muted)}h3.grp small{font-weight:450;margin-left:6px}
.sys{border-radius:12px;background:#2a2b30;padding:10px 12px;font-family:-apple-system,system-ui,sans-serif;font-size:13px;display:flex;flex-direction:column;gap:4px}
.sys-h{color:var(--muted);font-size:12px;margin-bottom:2px}
.sys-r{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-radius:6px}.sys-r.me{background:rgba(255,248,234,.08);font-weight:600}
.sw{width:30px;height:18px;border-radius:9px;background:#4a4b50;position:relative;transition:background .3s}.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:left .3s}
.sw.on{background:#30d158}.sw.on::after{left:14px}
.alert{margin-top:6px;padding:10px 12px;border-radius:10px;background:#3a3b40;display:flex;flex-direction:column;gap:8px}.alert span{display:flex;gap:8px;justify-content:flex-end}
.alert i{font-style:normal;padding:4px 12px;border-radius:6px;background:#55565b}.alert i.d{background:#0a84ff;color:#fff}
.sheet{position:absolute;inset:0;z-index:2;background:rgba(10,11,13,.6);display:flex;align-items:center;justify-content:center;animation:rise .25s ease-out}
.sh{width:420px;border-radius:14px;background:#f3f4f5;color:#0d0e11;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sh-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#e4e5e7;font-size:12.5px;color:#57544f}.sh-bar .x{margin-left:auto;font-weight:600}
.sh-pg{padding:20px 22px;display:flex;flex-direction:column;gap:10px;font-size:14px}.sh-pg b{font-size:17px}
.sh-pg .ln{padding:10px 12px;border-radius:8px;background:#fff;border:1px solid #dadbdd}.sh-pg .btn{text-align:center;padding:10px;border-radius:8px;background:#0d0e11;color:#fff;font-weight:650}
.sh .priv{padding:0 22px 16px;color:#57544f}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell"><div class="fit"><div class="stagebox" id="box"></div></div>
<aside class="side" id="side"></aside></main>
<script src="integrations.js" charset="utf-8"></script>
<script>
/* --- state: one setup, its answers, and the integrations' live state (made up); fail: "Things go wrong" in the side panel --- */
var S={plat:'mac',diag:true,reinstall:false,intel:false,fail:false,shown:false,step:0,scene:'setup',ai:null,flows:{},sheet:null,fda:'',fdaTried:false,langs:{English:true},picked:{},far:'year',backup:0,phone:'waiting',broken:false};
var LANGS=['English','French','German','Spanish','Thai','Italian','Portuguese'];
var LOCAL=['English','French','German','Spanish','Italian','Portuguese'];// local speech's set (made up for the drawing)
var timers=[];function later(f,ms){timers.push(setTimeout(f,ms));}
function clear(){timers.forEach(clearTimeout);timers=[];}
var BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>';
function win(){return S.plat==='win';}
function here(){return win()?'PC':'Mac';}
function sources(){return INTEGRATIONS.filter(function(x){return x.group==='sources'&&(win()?!x.mac:!x.win);});}
function imports(){return INTEGRATIONS.filter(function(x){return x.group==='imports';});}
function on(id){return S.picked[id];}
function fdaSrc(x){return x.requirements[0]===FDA;}
/* the steps: each its question, bundle, body, answer; skip() names why a known answer skips it */
var STEPS=[
 {id:'computer',label:'Your computer',bundle:'M',draw:function(){var capable=!win()&&!S.intel;
   return '<div class="mark">L</div><h2 class="q">Welcome to Life</h2><p class="lead">Life keeps your memory on this '+here()+'. Nothing of yours goes anywhere you don’t choose.</p>'+
   '<div class="tile"><div class="kv"><span>This '+here()+'</span><b>'+(win()?'Lenovo ThinkPad · 16 GB · 410 GB free':S.intel?'MacBook Pro · Intel i7 · 16 GB · 180 GB free':'MacBook Air · M2 · 16 GB · 212 GB free')+'</b></div>'+
   '<div class="say">'+(capable?'It can hear your voice itself.':'Your voice will be heard by ElevenLabs: this '+here()+' can’t do it itself yet.')+'</div></div>'+
   /* anonymous diagnostics, ticked by default (his ask of 28 Nov; what may leave is scoped in issue #1599) */
   '<button type="button" class="irow" role="checkbox" data-diag aria-checked="'+S.diag+'"><span class="tk"></span><span class="tx"><b>Send anonymous reports to Life’s developer</b>'+
   '<span class="priv">When something breaks: which step, what kind of error, your app version. Never your words, names, messages or files. Turn it off any time.</span></span></button>';},
  go:'Start'},
 {id:'you',label:'You',bundle:'M',skip:function(){return S.reinstall&&'your name is known';},draw:function(){
   return '<h2 class="q">Is this you?</h2><p class="lead">Read from this '+here()+'. Life calls you by your first name.</p>'+
   '<div class="field"><label for="n">Name</label><input id="n" value="Sam Rivera"></div><div class="field"><label for="e">Email</label><input id="e" value="sam.rivera@example.com"></div>'+
   '<div class="priv">Your name stays on this '+here()+'. The email is where your phone’s invite goes.</div>';},go:'That’s me'},
 {id:'ai',label:'The AI',bundle:'M',skip:function(){return S.reinstall&&'the AI is already set';},draw:drawAI,go:function(){return done('ai')?'Continue':null;}},
 {id:'langs',label:'Your languages',bundle:'M',draw:drawLangs,go:function(){return needsEleven()&&!done('voice')?null:'Continue';}},
 {id:'sources',label:'What Life reads',bundle:'M',draw:drawSources,go:sourcesGo},
 {id:'far',label:'How far back',bundle:'H',draw:drawFar,go:function(){return {months:'Read 3 months',year:'Read the last year',all:'Read everything'}[S.far];}},
 {id:'backup',label:'Backups',bundle:'M',skip:function(){return S.reinstall&&'a backup is already set';},draw:drawBackup,go:function(){return S.shown?'I saved it':'Back up here';}},
 {id:'phone',label:'Your phone',bundle:'M',draw:drawPhone,go:function(){return null;}}];
function live(){return STEPS.filter(function(s){return !(s.skip&&s.skip());});}
/* --- a flow: steps that tick themselves. A step may open its page inside Life's window (the sheet: sign-in, payment),
   so he never hunts for a browser tab; with "Things go wrong" it fails once, says why in his words, and offers one fix. --- */
function done(id){return S.flows[id]&&S.flows[id].done;}
function startFlow(id,steps){clear();S.flows[id]={steps:steps,at:0,failed:false};S.sheet=null;stepFlow(id);}
function stepFlow(id){var f=S.flows[id],s=f.steps[f.at];
  if(!s){f.done=true;S.sheet=null;return render();}
  if(s.sheet&&!s.seen){s.seen=true;S.sheet=s.sheet;render();return later(function(){stepFlow(id);},2400);}
  S.sheet=null;
  if(S.fail&&s.fail&&!s.tried){s.tried=true;f.failed=true;return render();}
  render();later(function(){f.at++;stepFlow(id);},1200);}
function flowSteps(id){var f=S.flows[id];return '<ol class="steps">'+f.steps.map(function(s,i){var now=i===f.at&&!f.done;
  var cls=i<f.at||f.done?'done':now?(f.failed?'bad':'now'):'';
  var right=now&&!f.failed?'<small><span class="spin"></span>'+s.wait+'</small>':'';
  var why=now&&f.failed?'<span class="why">'+s.fail.why+'<button type="button" class="chip sm" data-retry="'+id+'">'+s.fail.fix+'</button></span>':'';
  return '<li class="'+cls+'">'+s.t+right+why+'</li>';}).join('')+'</ol>';}
function sheet(){var s=S.sheet;if(!s)return '';
  return '<div class="sheet"><div class="sh"><div class="sh-bar"><span class="spin"></span>'+s.url+'<span class="x">Cancel</span></div><div class="sh-pg"><b>'+s.title+'</b>'+
    s.lines.map(function(l){return '<span class="ln">'+l+'</span>';}).join('')+'<span class="btn">'+s.btn+'</span></div>'+
    '<div class="priv">'+(win()?'A window from this page':'Inside Life’s window')+'. “Continue with Google” opens your browser instead: Google refuses sign-ins inside apps.</div></div></div>';}
/* --- the AI: no pick; each option says where his words go. DeepSeek runs only on providers that keep nothing:
   every request asks OpenRouter for zero data retention (provider.zdr), the default route SECURITY.md names. --- */
function drawAI(){
  var o=[['claude','Claude','Your words go to Anthropic. Uses your Claude Pro or Max plan; usually the best answers.','<b>in your plan</b>'],
         ['openrouter','DeepSeek','Your words go to OpenRouter, then to DeepSeek V4.1 Flash, only at providers that keep nothing.','<b>$5–20</b><small>a month, by use</small>'],
         ['both','Both','Your memory on DeepSeek, Life’s agents on Claude. Your words go to both.','']];

function prefill(){var s=live()[S.step].id,order=STEPS.map(function(x){return x.id;}),at=order.indexOf(s);
  if(at>order.indexOf('ai')&&!done('ai')){S.ai=S.ai||(win()?'openrouter':'claude');S.flows.ai={steps:[],done:true};}
  if(at>order.indexOf('langs'))S.flows.voice={steps:[],done:true};
  if(at>order.indexOf('sources')&&!sources().some(function(x){return on(x.id);})){if(!win())S.fda='done';
    sources().forEach(function(x){if(x.holds){S.picked[x.id]=true;x.state='working';}});}}
function reset(){clear();INTEGRATIONS.forEach(function(x){x.state='off';x.tried=false;});
  S.step=0;S.scene='setup';S.ai=null;S.flows={};S.sheet=null;S.fda='';S.fdaTried=false;S.picked={};S.shown=false;S.far='year';S.backup=0;S.langs={English:true};S.phone='waiting';render();}
function fit(){var box=document.querySelector('.fit'),k=Math.min((innerHeight-40)/720,(innerWidth-360)/900,1.2);if(innerWidth<700)k=(innerWidth-20)/900;
  document.getElementById('box').style.transform='scale('+k+')';box.style.width=900*k+'px';box.style.height=720*k+'px';}
addEventListener('resize',fit);fit();render();
</script>
</body>
</html>
