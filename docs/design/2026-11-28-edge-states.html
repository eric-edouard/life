<!doctype html>
<!-- The designs app's Glow page frame: App v4's edge as turn by turn shares it (2026-11-28-turn-by-turn-v3/edge.js) round an empty phone, in the
     state the hash names: rest, listen (the voice level moving), work, landed (a breath every few seconds), still, or
     cycle (each in turn). -->
<html lang="en">
  <meta charset="utf-8">
  <title>The edge</title>
  <link href="../../assets/brand/tokens.css" rel="stylesheet">
  <link
    href="2026-11-28-turn-by-turn-v3/edge.css"
    rel="stylesheet"
  >
  <style>
  html,
  body {
    margin: 0;
    background: var(--bg);
  }
  #ph {
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: var(--bg);
    border-radius: 54px;
  }
  </style>
  <div id="ph"></div>
  <script
    defer
    src="2026-11-28-turn-by-turn-v3/edge.js"
  ></script>
  <script type="module">
  const { Edge } = window;
  Edge.mount(document.getElementById("ph"));
  const state = location.hash.slice(1) || "rest";
  const IN_TURN = ["rest", "listen", "work", "landed", "still"];
  const every = (ms, f) => {
    f();
    setInterval(f, ms);
  };
  if (state === "cycle") {
    let i = 0;
    every(3000, () => {
      Edge.set(IN_TURN[i % IN_TURN.length]);
      i += 1;
    });
  } else if (state === "landed") {
    every(3000, () => Edge.set("landed"));
  } else {
    Edge.set(state);
  }
  if (state === "listen" || state === "cycle") {
    setInterval(() => Edge.level(0.45 + 0.55 * Math.random()), 55);
  }
  </script>
</html>
