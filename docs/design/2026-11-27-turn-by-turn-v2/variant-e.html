<!doctype html>
<!-- Turn by turn v2, variant E, "Path of work", on the real flow (2026-11-28-real-flow.md): his words start a fine path.
     While Life searches, one quiet step line sits at the path's tip; each time it is replaced, the old line settles into
     a station above it, name only, never what was found. When the answer arrives (all at once, as it really does), the
     stations fold into one line he can open, and the answer blooms at the path's end: the path flows on into the day,
     into a face and a quote, into a draft card. Proposed blocks carry a quiet "new block" tag. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: E, path of work</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
.ph{--wa:#25d366;--in:cubic-bezier(.22,1.18,.36,1);--ease:cubic-bezier(.2,.8,.2,1);--x:7px;--path:color-mix(in srgb,var(--fg) 24%,transparent)}
/* his words write at the top of the path while he speaks: the field keeps only the live microphone */
.ph .field .heard{opacity:0}
.stage{padding-top:16px;padding-bottom:24px;font-variant-numeric:tabular-nums}
.turn{display:flex;flex-direction:column;flex:none}
.turn.next{min-height:100%;padding-top:28px}
.turn.past{opacity:.4;transition:opacity .3s}

/* a row on the path: its segment, its node, its body; --d staggers its entrance */
.row{position:relative;padding:0 0 18px 32px;--d:0s;--ny:10.5px;--ns:8px}
.seg{position:absolute;left:var(--x);top:0;bottom:0;width:1.5px;background:var(--path);transform-origin:top;animation:draw .5s var(--d) var(--ease) both}
.node{position:absolute;left:calc(var(--x) + .75px - var(--ns)/2);top:calc(var(--ny) - var(--ns)/2);width:var(--ns);height:var(--ns);border-radius:50%;background:var(--fg);animation:pop .45s calc(var(--d) + .14s) var(--in) both}
.body{animation:bloom .6s calc(var(--d) + .1s) var(--ease) both}
.row.end .seg{-webkit-mask:linear-gradient(#000 25%,transparent);mask:linear-gradient(#000 25%,transparent)}
@keyframes draw{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes bloom{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(2.4);opacity:0}}

/* his words: the path's start */
.me{--ny:16px;--ns:10px;padding-bottom:22px}
.me .seg{top:var(--ny);animation-delay:calc(var(--d) + .25s)}
.words{font-size:var(--text-profile);font-weight:650;line-height:1.22;letter-spacing:-.01em;text-wrap:balance;transition:font-size .45s var(--ease),color .45s}
.words span{transition:color .4s}
.words span.new{color:var(--muted)}
.me.speaking .node,.me.speaking .seg{animation:none;opacity:0}
.me.speaking .body{animation:none}
.me.planted .node{opacity:1;animation:pop .45s var(--in) both}
.me.planted .seg{opacity:1;animation:draw .45s .2s var(--ease) both}
.turn.answered .me .words{font-size:var(--text-header);color:var(--muted)}
.turn.answered .me{--ny:13px;padding-bottom:12px}
.meta{margin-top:4px;font-size:var(--text-line);color:var(--muted)}

/* the waiting: stations above, one live line at the tip */
.st{--ns:5px;padding-bottom:10px}
.st .node{background:var(--muted)}
.st .body{font-size:var(--text-line);color:var(--faint);animation:settle .5s var(--ease) both}
@keyframes settle{from{font-size:var(--text-body);color:var(--fg)}}
.tip{--ns:8px;padding-bottom:10px}
.tip .seg{-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
.tip .node{animation:none}
.tip .node::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fg);animation:breathe 2.6s ease-in-out infinite}
.tip .body{animation:none;font-size:var(--text-body);font-weight:600;min-height:22px}
.tip .body span{display:block;animation:bloom .5s var(--ease) both}
.tip .body span.thinking{color:var(--muted);font-weight:450}
/* a long turn: a still ring beside a second quiet line, never a spinner */
.still{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:var(--text-line);color:var(--muted);font-weight:450;animation:fade .8s both}
.still svg{flex:none}

/* the fold: the stations become one line, a tap opens them again */
.work{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s var(--ease),opacity .25s}
.work>div{min-height:0;overflow:hidden}
.work.folded{grid-template-rows:0fr;opacity:0}
.foldr{--ns:5px;padding-bottom:6px}
.foldr .node{background:var(--muted)}
.foldr .body{animation-duration:.4s}
.foldb{min-height:32px;display:flex;align-items:center;gap:6px;text-align:left;font-size:var(--text-line);color:var(--muted)}
.foldb svg{flex:none;transition:transform .3s var(--in)}
.foldb[aria-expanded="true"] svg{transform:rotate(180deg)}
.work .st .body{animation:none}

/* the answer */
.nb{display:inline-block;margin-left:8px;font-style:normal;font-size:var(--text-meta);font-weight:600;color:var(--ai);opacity:.75;vertical-align:1px;letter-spacing:.01em}
.lead{--ny:13px;--ns:12px;padding-bottom:22px}
.lead .node{box-shadow:0 0 0 4px var(--bg)}
.lead .body{font-size:var(--text-header);font-weight:650;line-height:1.32;text-wrap:pretty}
.ev{--ny:13px;--ns:8px}
.ev .h{display:flex;align-items:baseline;gap:12px}
.ev .tm{font-size:var(--text-header);font-weight:650;min-width:52px}
.ev .tt{font-size:var(--text-title);font-weight:650}
.ev .ln{margin:2px 0 0 64px;font-size:var(--text-line);color:var(--muted)}
.ev.now{--ns:6px}
.ev.now .node{background:var(--flag)}
.ev.now .tm,.ev.now .tt{font-size:var(--text-line);color:var(--flag);font-weight:600}
.place{display:flex;align-items:center;gap:12px;margin:10px 0 0 64px;padding:10px 14px;border-radius:var(--block-radius);background:var(--tile);text-align:left;width:calc(100% - 64px)}
.place b{display:block;font-weight:650}
.place small{display:block;font-size:var(--text-line);color:var(--muted)}
.place svg{flex:none;color:var(--muted)}
.ev.solo .place{margin-left:0;width:100%}
.who{--ny:16px;--ns:32px}
.who .node{background:none;overflow:hidden;box-shadow:0 0 0 4px var(--bg)}
.who .node img{width:100%;height:100%;display:block}
.who .nm{font-size:var(--text-title);font-weight:650;display:flex;align-items:center;gap:8px;min-height:32px}
.who .nm small{font-size:var(--text-line);font-weight:450;color:var(--muted)}
.msg{margin-top:8px;padding:10px 14px;border-radius:18px 18px 18px 6px;background:color-mix(in srgb,var(--wa) 14%,var(--bg))}
.msg small{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:var(--text-meta);color:var(--muted)}
.msg small .nb{margin-left:auto;white-space:nowrap}
.msg small i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--wa)}
.amt{display:flex;align-items:baseline;gap:12px}
.amt b{font-size:var(--text-header);font-weight:650;min-width:52px}
.amt span{font-size:var(--text-line);color:var(--muted)}

/* a draft card: an agent's or one prepared on his words; Send is his one tap */
.cardr{--ny:22px;--ns:8px}
.card{padding:14px 16px 16px;border-radius:var(--panel-radius);background:var(--tile)}
.card .from{font-size:var(--text-line);color:var(--muted)}
.card .from b{color:var(--fg);font-weight:650}
.card .ctx{margin:12px 0 0}
.draft{margin-top:12px;padding:10px 14px;border-radius:18px 18px 6px 18px;background:color-mix(in srgb,var(--wa) 9%,var(--bg));outline:1.5px dashed color-mix(in srgb,var(--wa) 70%,transparent);outline-offset:-1.5px;transition:outline-color .6s,background .6s}
.draft.sent{outline-color:transparent;background:color-mix(in srgb,var(--wa) 20%,var(--bg))}
.edits{display:flex;gap:8px;margin-top:10px}
.edits button{min-height:36px;padding:0 14px;border-radius:18px;background:var(--tint);font-size:var(--text-line);font-weight:600}
.send{margin-top:14px;width:100%;height:48px;border-radius:24px;background:var(--fg);color:var(--on);font-size:var(--text-title);font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,transform .2s}
.send:active{transform:scale(.97)}
.send:disabled{opacity:.55;cursor:default}
.sentl{margin-top:14px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:var(--text-line);color:var(--muted);animation:bloom .4s both}
.sentl svg{color:var(--ok);flex:none}
.sentl button{margin-left:auto;min-height:36px;padding:0 14px;border-radius:18px;background:var(--tint);color:var(--fg);font-weight:600}
.arrived{animation:arrive .9s var(--ease) both}
@keyframes arrive{from{opacity:0;transform:translateY(24px)}}

/* idle and earlier turns */
.hi{margin:auto 0 0;padding-bottom:8px}
.hi .row{--ny:20px;--ns:10px}
.hi h2{margin:0;font-size:32px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.hi p{margin:4px 0 0;color:var(--muted)}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:24px}
.sug button{min-height:44px;padding:0 16px;border-radius:22px;background:var(--tint);font-weight:600}
.h-at{--ns:0px;padding-bottom:4px;font-size:var(--text-meta);color:var(--faint);font-weight:600}
.h-me{--ns:7px;padding-bottom:6px;font-size:var(--text-title);font-weight:650}
.h-ans{--ns:5px;padding-bottom:28px;color:var(--muted)}
.h-ans .node{background:var(--muted)}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA,reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var CHEV='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
var TICK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
var PIN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
var RING='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/></svg>';

function el(parent,cls,html,tag){var e=document.createElement(tag||'div');if(cls)e.className=cls;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* the quiet tag on a piece that is not one of today's 8 blocks */
function nb(p){return p&&p.block==='new'?'<i class="nb">new block · '+p.kind+'</i>':'';}
function row(parent,cls,body,d,node){var r=el(parent,'row '+(cls||''),'<i class="seg"></i>'+(node==null?'<i class="node"></i>':node)+'<div class="body"></div>');
  r.style.setProperty('--d',(reduce?0:d||0)+'s');r.querySelector('.body').innerHTML=body||'';return r;}
function turn(c,next){return el(c.stage,'turn'+(next?' next':''),'');}
function scrollEnd(c){var s=c.stage;if(s.scrollHeight>s.clientHeight)s.scrollTo({top:s.scrollHeight,behavior:reduce?'auto':'smooth'});}
function scrollToEl(c,e){c.stage.scrollTo({top:Math.max(0,e.offsetTop-16),behavior:reduce?'auto':'smooth'});}
function spans(text){return text.split(' ').map(function(w){return '<span>'+esc(w)+'</span>';}).join(' ');}

/* his turn: the path's start */
function meRow(t,text,meta){return row(t,'me','<div class="words">'+spans(text)+'</div>'+(meta?'<div class="meta">'+meta+'</div>':''));}
async function askTyped(c,t,a){await c.type(c.field.input,a.ask);await c.wait(350);
  var from=c.field.input.getBoundingClientRect(),k=c.phone.getBoundingClientRect().width/390;c.field.clear();
  var r=meRow(t,a.ask),w=r.querySelector('.words');r.querySelector('.body').style.animation='none';
  if(!reduce){var to=w.getBoundingClientRect();w.style.transformOrigin='0 0';
    w.style.transition='none';w.style.transform='translate('+(from.left-to.left)/k+'px,'+(from.top-to.top)/k+'px) scale(.62)';w.style.opacity='.5';
    w.offsetWidth;w.style.transition='transform .6s var(--in),opacity .4s';w.style.transform='';w.style.opacity='';}
  r.style.setProperty('--d','.35s');await c.wait(700);w.style.transition='';return r;}
async function askSpoken(c,t,a){var r=meRow(t,'');r.classList.add('speaking');var w=r.querySelector('.words'),n=0;
  var ob=new MutationObserver(function(){var words=c.field.heard.textContent.split(' ').filter(Boolean);
    for(;n<words.length;n++){if(n)w.appendChild(document.createTextNode(' '));var s=el(w,'new',esc(words[n]),'span');
      (function(s){requestAnimationFrame(function(){requestAnimationFrame(function(){s.className='';});});})(s);}});
  ob.observe(c.field.heard,{childList:true,characterData:true,subtree:true});
  try{await c.speak(a.ask);}finally{ob.disconnect();}
  r.classList.remove('speaking');r.classList.add('planted');await c.wait(550);return r;}
function ask(c,t,a){return a.how==='voice'?askSpoken(c,t,a):askTyped(c,t,a);}

/* the waiting: "Thinking…", then one step line at the tip, replaced at each read; the line it replaces settles into a
   station above, its name only. A slow turn adds a still ring and a second quiet line. */
function tipOf(t){var w=el(t,'work','<div></div>'),box=w.firstChild,tip=row(box,'tip','<span class="thinking">Thinking…</span>',0);return {w:w,box:box,tip:tip,body:tip.querySelector('.body')};}
function step(p,text){var prev=p.body.querySelector('span:not(.thinking)');
  if(prev){var st=row(p.box,'st',esc(prev.textContent),0,'<i class="node"></i>');st.querySelector('.seg').style.animation='none';p.box.insertBefore(st,p.tip);}
  p.body.querySelector('span').remove();var s=document.createElement('span');s.textContent=text;p.body.insertBefore(s,p.body.firstChild);}
async function work(c,t,a,keep){c.edge.set('work');var p=tipOf(t),el0=0,still=null;scrollEnd(c);
  async function hold(ms){if(a.stillAfter&&!still&&el0+ms>a.stillAfter){var pre=a.stillAfter-el0;await c.wait(pre);
      still=el(p.body,'still',RING+esc(a.still));scrollEnd(c);ms-=pre;el0+=pre;}await c.wait(ms);el0+=ms;}
  await hold(a.first);
  for(var i=0;i<a.steps.length;i++){step(p,a.steps[i].t);scrollEnd(c);await hold(a.steps[i].ms);}
  if(keep)return p;
  step(p,'');p.tip.remove();return p;}

/* the fold: "Looked up Jade, read Jade's chat and what waits on you", a tap opens the stations again */
var PAST={Looking:'Looked',Reading:'Read',Searching:'Searched',Preparing:'Prepared',Handing:'Handed'};
function summaryOf(steps){var out=[],last='';steps.forEach(function(s){var i=s.t.indexOf(' '),v=s.t.slice(0,i),rest=s.t.slice(i+1),pv=PAST[v]||v;
    if(pv==='Looked'&&/^(at|up) /.test(rest)&&last==='Looked'){rest=rest.replace(/^(at|up) /,'');}
    out.push(pv===last?rest:pv.toLowerCase()+' '+rest);last=pv;});
  var s=out.length>1?out.slice(0,-1).join(', ')+' and '+out[out.length-1]:out[0];return s.charAt(0).toUpperCase()+s.slice(1);}
function fold(t,p,steps,d){var r=row(t,'foldr','<button type="button" class="foldb" aria-expanded="false">'+esc(summaryOf(steps))+CHEV+'</button>',d||0),b=r.querySelector('button');
  t.insertBefore(r,p.w);p.w.classList.add('folded');
  b.onclick=function(){var open=!p.w.classList.toggle('folded');b.setAttribute('aria-expanded',String(open));};return r;}

/* the arrival: one choreographed moment. The tip goes, the stations fold into one line, the answer blooms row by row
   down the path (about 1.2 s), and the edge lands. */
async function arrive(c,t,p,a,draw){fold(t,p,a.steps,0);t.classList.add('answered');c.edge.set('landed');
  draw(c,t,.18);await c.wait(30);scrollToEl(c,t);await c.wait(reduce?0:1200);}
async function full(c,t,a,draw){await ask(c,t,a);var p=await work(c,t,a);await arrive(c,t,p,a,draw);}

/* the answers */
function leadRow(t,text,d){return row(t,'lead',esc(text),d);}
function placeBtn(p){return '<button type="button" class="place" aria-label="Open '+esc(p.name)+' in Maps">'+PIN+'<span><b>'+esc(p.name)+'</b><small>'+esc(p.address)+'</small></span></button>';}
function faceNode(src){return '<i class="node"><img alt="" src="'+src+'"></i>';}
var STEP=.11;
function dayAnswer(c,t,d0){var a=D.asks.day.answer,d=d0,s=reduce?0:STEP;leadRow(t,a.lead,d);
  row(t,'ev now','<div class="h"><span class="tm">'+D.now.time+'</span><span class="tt">Now</span></div>',d+=s);
  a.events.forEach(function(e,i){var plc=e.where===a.place.name?placeBtn(a.place):'';
    row(t,'ev','<div class="h"><span class="tm">'+e.at+'</span><span class="tt">'+esc(e.t)+nb(e)+'</span></div>'+(plc||'<div class="ln">'+esc(e.where)+'</div>'),d+=s).style.paddingBottom=(i<2?26:18)+'px';});
  var w=a.waiting;
  row(t,'who','<div class="nm">'+w.who+'<small>waits on you · '+esc(w.about)+'</small></div><div class="msg">'+esc(w.last)+'<small><i></i>'+w.at+'</small></div>',d+=s,faceNode(D.asks.jade.answer.who.face));
  row(t,'ev end','<div class="amt"><b>'+a.payment.amount+'</b><span>'+esc(a.payment.t)+', due '+a.payment.due+nb(a.payment)+'</span></div>',d+=s);}

/* a draft card on the path: Send, then Sent and Undo */
function cardRow(c,t,k,d,node){var ctx=k.context?'<div class="ctx"><div class="msg">'+esc(k.context.t)+'<small><i></i>'+k.context.who+', '+k.context.app+', '+k.context.at+nb(k.context)+'</small></div></div>':'';
  var r=row(t,'cardr end','<div class="card"><div class="from"><b>To '+k.to+'</b> on '+k.app+' · '+esc(k.made)+'</div>'+ctx+
    '<div class="draft">'+esc(k.draft)+'</div>'+(k.edits?'<div class="edits">'+k.edits.map(function(e){return '<button type="button">'+e+'</button>';}).join('')+'</div>':'')+
    '<button type="button" class="send">'+k.send+'</button></div>',d,node);
  var cd=r.querySelector('.card'),b=cd.querySelector('.send');
  b.onclick=async function(){if(b.disabled)return;b.disabled=true;b.textContent=k.sending;
    try{await c.wait(k.sendMs);}catch(e){return;}
    cd.querySelector('.draft').classList.add('sent');var ed=cd.querySelector('.edits');if(ed)ed.remove();
    var l=el(cd,'sentl',TICK+'<span>'+k.sent+'</span><button type="button">'+k.undo+'</button>');b.replaceWith(l);
    l.querySelector('button').onclick=function(){l.querySelector('span').textContent='Deleted for everyone';this.remove();cd.querySelector('.draft').style.opacity='.4';};};
  return r;}
function jadeAnswer(c,t,d0){var a=D.asks.jade.answer,d=d0,s=reduce?0:STEP;leadRow(t,a.lead,d);
  row(t,'who','<div class="nm">'+a.who.name+nb(a.who)+'</div><div class="msg">'+esc(a.reply.t)+'<small><i></i>'+a.reply.app+', '+a.reply.at+nb(a.reply)+'</small></div>',d+=s,faceNode(a.who.face));
  cardRow(c,t,a.card,d+=s);}
function tellAnswer(c,t,d0){var a=D.asks.tell.answer;leadRow(t,a.lead,d0);cardRow(c,t,a.card,d0+(reduce?0:STEP));}
function slowAnswer(c,t,d0){var a=D.slow.answer;leadRow(t,a.lead,d0);row(t,'ev solo end',placeBtn(a.place),d0+(reduce?0:STEP));}
function failAnswer(c,t,d0){var r=leadRow(t,D.failure.error.t,d0);r.classList.add('end');}
function followAnswer(c,t,d0){leadRow(t,D.followUp.answer.lead,d0).classList.add('end');}

function greet(c,parent){var g=el(parent,'hi','');
  row(g,'end','<h2>Hi</h2><p>'+D.now.day+'</p><div class="sug"><button type="button" data-s="answer-day">'+esc(D.asks.day.ask)+'</button><button type="button" data-s="answer-jade">'+esc(D.asks.jade.ask)+'</button></div>',0);
  g.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){Shell.run(b.dataset.s);};});return g;}
/* a finished turn, drawn without the wait (the thread as it stands) */
function done(c,a,draw){var t=turn(c);meRow(t,a.ask);var p=tipOf(t);a.steps.forEach(function(s){step(p,s.t);});step(p,'');p.tip.remove();
  p.w.style.transition='none';fold(t,p,a.steps,0);p.w.offsetWidth;p.w.style.transition='';t.classList.add('answered');draw(c,t,0);return t;}

Shell.mount({title:'Turn by turn v2: E, path of work',scenes:[
  {id:'idle',label:'Idle',run:function(c){greet(c,c.stage);}},
  {id:'type-send',label:'He types an ask',run:async function(c){var t=turn(c);await ask(c,t,D.asks.day);c.edge.set('work');tipOf(t);}},
  {id:'voice-send',label:'He holds to talk',run:async function(c){var t=turn(c);await ask(c,t,D.asks.jade);c.edge.set('work');tipOf(t);}},
  {id:'working',label:'Life works',run:async function(c){var t=turn(c);meRow(t,D.asks.day.ask);await c.wait(400);await work(c,t,D.asks.day,true);}},
  {id:'answer-day',label:'Answer: the day',run:function(c){return full(c,turn(c),D.asks.day,dayAnswer);}},
  {id:'answer-jade',label:'Answer: Jade, with her draft',run:function(c){return full(c,turn(c),D.asks.jade,jadeAnswer);}},
  {id:'tell',label:'Tell Ben: a draft on his words',run:function(c){return full(c,turn(c),D.asks.tell,tellAnswer);}},
  {id:'card-arrives',label:'A card arrives',run:async function(c){var g=greet(c,c.stage);await c.wait(D.arrives.arriveMs);
    var t=el(c.stage,'turn arrived','');t.style.paddingTop='20px';cardRow(c,t,D.arrives.card,0,'<i class="node" style="background:var(--muted)"></i>');scrollEnd(c);}},
  {id:'slow',label:'A slow ask',run:function(c){return full(c,turn(c),D.slow,slowAnswer);}},
  {id:'failure',label:'A read fails',run:function(c){return full(c,turn(c),D.failure,failAnswer);}},
  {id:'history',label:'Earlier turns',run:async function(c){var hs=D.history,past=turn(c);
    hs.forEach(function(h,i){var d=(hs.length-1-i)*.18+.3;row(past,'h-at',h.at,d,'');row(past,'h-me',esc(h.ask),d+.06);row(past,'h-ans',esc(h.answer),d+.12);});
    var now=turn(c,true);now.style.justifyContent='flex-end';greet(c,now);c.stage.scrollTop=c.stage.scrollHeight;
    await c.wait(900);c.stage.scrollTo({top:0,behavior:reduce?'auto':'smooth'});}},
  {id:'follow-up',label:'A follow-up',run:async function(c){var t0=done(c,D.asks.day,dayAnswer);await c.wait(1500);
    var t=turn(c,true);t0.classList.add('past');scrollToEl(c,t);await full(c,t,D.followUp,followAnswer);}},
  {id:'hey-life',label:'Hey Life, from the pendant',run:async function(c){var h=D.heyLife;c.lock();c.edge.set('still');
    await c.wait(h.heardMs);c.lock(h.heardAt);c.notify(h.heard);await c.wait(h.answerMs);await Promise.race([c.notify(h.done),c.wait(4000)]); /* his tap, or on its own for Play all */
    c.lock(false);c.edge.set('rest');var t=turn(c);t.classList.add('answered');meRow(t,h.ask,'Said to your pendant at '+D.now.time);
    await c.wait(250);c.edge.set('landed');leadRow(t,h.answer.lead,0).classList.add('end');}}]});
</script>
