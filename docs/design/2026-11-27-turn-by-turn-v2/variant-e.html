<!doctype html>
<!-- Turn by turn v2, variant E, "Path of work": his words are the start of a fine path; each step Life takes is a
     station on it with a live sliver of what it found; the stations fold into one line and the answer blooms at the
     path's end, the path becoming the day's timeline. Scrolling up walks back along the same path. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: E, path of work</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
.ph{--wa:#25d366;--in:cubic-bezier(.22,1.18,.36,1);--out:cubic-bezier(.4,0,1,1);--x:7px}
/* his words also write at the top while he speaks: the field keeps only the live microphone */
.ph .field .heard{opacity:0}
.stage{padding-top:16px;padding-bottom:24px;font-variant-numeric:tabular-nums}
.turn{display:flex;flex-direction:column;flex:none}
.turn.next{min-height:100%;padding-top:24px}
.turn.past{opacity:.42;transition:opacity .2s var(--out)}

/* a row on the path: its segment of the path, its node, its body */
.row{position:relative;padding:0 0 18px 32px;--d:0s;--ny:10.5px;--ns:8px}
.seg{position:absolute;left:var(--x);top:0;bottom:0;width:1.5px;background:color-mix(in srgb,var(--fg) 26%,transparent);transform-origin:top;animation:draw .45s var(--d) cubic-bezier(.3,.7,.2,1) both}
.node{position:absolute;left:calc(var(--x) + .75px - var(--ns)/2);top:calc(var(--ny) - var(--ns)/2);width:var(--ns);height:var(--ns);border-radius:50%;background:var(--fg);animation:pop .4s calc(var(--d) + .16s) var(--in) both;transition:background .3s,transform .3s var(--in)}
.body{animation:ink .5s calc(var(--d) + .12s) cubic-bezier(.2,.8,.2,1) both}
.row.end .seg{-webkit-mask:linear-gradient(#000 30%,transparent);mask:linear-gradient(#000 30%,transparent)}
.row.beyond .seg{background:repeating-linear-gradient(color-mix(in srgb,var(--fg) 26%,transparent) 0 2px,transparent 2px 6px)}
@keyframes draw{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes ink{from{opacity:0;filter:blur(6px);transform:translateY(6px)}}
@keyframes breathe{50%{transform:scale(1.7);opacity:.55}}
@keyframes shimmer{to{background-position:-200% 0}}

/* his words: the path's start */
.me{--ny:16px;--ns:10px;padding-bottom:22px}
.me .seg{top:var(--ny);animation-delay:calc(var(--d) + .25s)}
.words{font-size:var(--text-profile);font-weight:650;line-height:1.22;letter-spacing:-.01em;transform-origin:0 0;transition:font-size .35s var(--in),color .35s}
.words span{transition:color .4s}
.words span.new{color:var(--muted)}
.me.speaking .node,.me.speaking .seg{animation:none;opacity:0}
.me.speaking .body{animation:none}
.me.planted .node{opacity:1;animation:pop .45s var(--in) both}
.me.planted .seg{opacity:1;animation:draw .45s .2s cubic-bezier(.3,.7,.2,1) both}
.me.planted .words{animation:settle .45s var(--in)}
@keyframes settle{from{transform:scale(1.04)}}
.turn.answered .me .words{font-size:var(--text-header);color:var(--muted)}
.turn.answered .me{--ny:13px;padding-bottom:14px}

/* a station: one step Life takes, with a sliver of what it found */
.st{--ns:7px}
.st .node{background:var(--muted)}
.st.live .node{background:var(--fg)}
.st.live .node::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fg);animation:breathe 1.4s ease-in-out infinite}
.st.fail .node{background:var(--flag)}
.st p{margin:0;font-size:var(--text-body);font-weight:600}
.st p .v{color:var(--muted);font-weight:450}
.st.live p .v{background:linear-gradient(90deg,var(--muted) 30%,var(--fg) 50%,var(--muted) 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}
.st.fail p{color:var(--flag)}
.pv{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:var(--text-line);color:var(--muted);clip-path:inset(0 100% 0 0);opacity:0;transition:clip-path .55s cubic-bezier(.2,.8,.2,1),opacity .3s}
.pv.on{clip-path:inset(0 0 0 0);opacity:1}
.pv b{color:var(--fg);font-weight:650}
.pv .big{font-size:var(--text-title)}
.strip{position:relative;width:150px;height:6px;border-radius:3px;background:var(--wash)}
.strip i{position:absolute;top:0;height:6px;border-radius:3px;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--in)}
.pv.on .strip i{transform:none}
.strip i.now{width:2px;top:-3px;height:12px;border-radius:1px;background:var(--flag)}
.mini{width:22px;height:22px;border-radius:50%;flex:none}
.bub{padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--wa) 16%,var(--bg));color:var(--fg);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash{padding:5px 10px;border-radius:12px;outline:1.5px dashed color-mix(in srgb,var(--wa) 70%,transparent);outline-offset:-1.5px;color:var(--fg)}
.ring{flex:none}
.ring circle+circle{transition:stroke-dashoffset .5s var(--in)}

/* the stations fold into one line */
.work,.foldr{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1),opacity .2s var(--out)}
.work>div,.foldr>div{min-height:0;overflow:hidden}
.work.folded{grid-template-rows:0fr;opacity:0}
.foldr{grid-template-rows:0fr;opacity:0}
.foldr.shown{grid-template-rows:1fr;opacity:1;transition-duration:.35s,.35s;transition-timing-function:var(--in),ease}
.foldr .row{padding-bottom:6px;--ny:22px;--ns:5px}
.foldr .node{background:var(--muted)}
.foldb{min-height:44px;display:flex;align-items:center;gap:6px;font-size:var(--text-line);color:var(--muted)}
.foldb svg{transition:transform .3s var(--in)}
.foldb[aria-expanded="true"] svg{transform:rotate(180deg)}

/* the answer */
.lead{--ny:13px;--ns:12px;padding-bottom:24px}
.lead .node{background:var(--fg);box-shadow:0 0 0 4px var(--bg)}
.lead .body,.words{text-wrap:balance}
.lead .body{font-size:var(--text-header);font-weight:650;line-height:1.3}
.ev{--ny:13px;--ns:8px}
.ev .h{display:flex;align-items:baseline;gap:12px}
.ev .tm{font-size:var(--text-header);font-weight:650;min-width:52px}
.ev .tt{font-size:var(--text-title);font-weight:650}
.ev .ln{margin:2px 0 0 64px;font-size:var(--text-line);color:var(--muted)}
.ev.minor{--ns:0px}
.ev.minor .tm{font-size:var(--text-line);color:var(--muted);font-weight:600}
.ev.minor .tt{font-size:var(--text-line);font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.ev.now .tm{color:var(--flag)}
.ev.now .tt{font-size:var(--text-line);color:var(--flag);font-weight:600}
.ev.now .node{background:var(--flag)}
.ev.now .seg{background:var(--flag)}
.pill{display:inline-flex;margin:8px 0 0 64px;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--flag);font-size:var(--text-line);font-weight:600}
.glyph{position:absolute;left:calc(var(--x) + .75px - 9px);top:calc(var(--ny) - 9px);width:18px;height:18px;color:var(--muted);background:var(--bg);animation:pop .4s calc(var(--d) + .16s) var(--in) both}
.who{--ny:16px;--ns:32px}
.who .node{background:none;overflow:hidden;box-shadow:0 0 0 4px var(--bg)}
.who .node img{width:100%;height:100%;display:block}
.who .nm{font-size:var(--text-title);font-weight:650;display:flex;align-items:center;gap:8px;min-height:32px}
.who .nm i{width:7px;height:7px;border-radius:50%;background:var(--flag)}
.who .nm small{font-size:var(--text-line);font-weight:450;color:var(--muted)}
.msg{margin-top:8px;padding:10px 14px;border-radius:var(--block-radius);background:color-mix(in srgb,var(--wa) 14%,var(--bg))}
.msg small{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:var(--text-meta);color:var(--muted)}
.msg small i{width:6px;height:6px;border-radius:50%;background:var(--wa)}
.draft{margin-top:12px;padding:10px 14px;border-radius:var(--block-radius);background:color-mix(in srgb,var(--wa) 9%,var(--bg));outline:1.5px dashed color-mix(in srgb,var(--wa) 75%,transparent);outline-offset:-1.5px;transition:outline-color .6s}
.draft.sent{outline-color:transparent}
.send{margin-top:16px;width:100%;height:48px;border-radius:24px;background:var(--fg);color:var(--on);font-size:var(--text-title);font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .3s,color .3s,transform .2s var(--out),opacity .2s}
.send:active{transform:scale(.97)}
.send.doing{opacity:.6}
.send.done{background:var(--ok);color:var(--on)}
.sentl{margin-top:16px;font-size:var(--text-line);color:var(--muted);display:flex;align-items:center;gap:6px;animation:ink .35s both}
.sentl svg{color:var(--ok)}
.amt{display:flex;align-items:baseline;gap:12px}
.amt b{font-size:var(--text-header);font-weight:650}
.amt span{font-size:var(--text-line);color:var(--muted)}
.big26{font-size:var(--text-profile);font-weight:650;line-height:1.15}
.sub{margin-top:6px;font-size:var(--text-body);color:var(--muted)}
.route{margin-top:16px;width:100%;height:auto;display:block}
.route .way{stroke-dasharray:420;stroke-dashoffset:420;animation:trace 1.2s calc(var(--d) + .4s) cubic-bezier(.4,0,.2,1) forwards}
@keyframes trace{to{stroke-dashoffset:0}}
.fail-t{font-size:var(--text-title);font-weight:650;color:var(--flag)}
.retry .tm{color:var(--muted)}
.retry .node{background:var(--muted)}

/* idle and earlier turns */
.hi{margin:auto 0 0;padding-bottom:8px}
.hi .row{--ny:20px;--ns:10px}
.hi h2{margin:0;font-size:32px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.hi p{margin:4px 0 0;color:var(--muted)}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:24px}
.sug button{min-height:44px;padding:0 16px;border-radius:22px;background:var(--tint);font-weight:600}
.h-at{--ns:0px;padding-bottom:4px;font-size:var(--text-meta);color:var(--faint);font-weight:600}
.h-me{--ns:7px;padding-bottom:6px;font-size:var(--text-title);font-weight:650}
.h-ans{--ns:5px;padding-bottom:28px;color:var(--muted)}
.h-ans .node{background:var(--muted)}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA,reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var SUN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
var DROP='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.5s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11Z"/></svg>';
var CHEV='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
var TICK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';

function el(parent,cls,html,tag){var e=document.createElement(tag||'div');if(cls)e.className=cls;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e;}
/* a row on the path; d staggers its entrance */
function row(parent,cls,body,d,node){var r=el(parent,'row '+(cls||''),'<i class="seg"></i>'+(node||'<i class="node"></i>')+'<div class="body"></div>');
  r.style.setProperty('--d',(reduce?0:d||0)+'s');r.querySelector('.body').innerHTML=body||'';return r;}
function turn(c,next){return el(c.stage,'turn'+(next?' next':''),'');}
function scrollEnd(c){var s=c.stage;if(s.scrollHeight>s.clientHeight)s.scrollTo({top:s.scrollHeight,behavior:reduce?'auto':'smooth'});}
function scrollToEl(c,e){c.stage.scrollTo({top:e.offsetTop-16,behavior:reduce?'auto':'smooth'});}
function spans(text){return text.split(' ').map(function(w){return '<span>'+w+'</span>';}).join(' ');}
function hhmm(t){var p=t.split(':');return +p[0]+p[1]/60;}

/* his turn: the path's start */
function meRow(t,text){var r=row(t,'me','<div class="words">'+spans(text)+'</div>');return r;}
async function askTyped(c,t,a){await c.type(c.field.input,a.ask);await c.wait(350);
  var from=c.field.input.getBoundingClientRect(),k=c.phone.getBoundingClientRect().width/390;c.field.clear();
  var r=meRow(t,a.ask),w=r.querySelector('.words'),b=r.querySelector('.body');b.style.animation='none';
  if(!reduce){var to=w.getBoundingClientRect();
    w.style.transition='none';w.style.transform='translate('+(from.left-to.left)/k+'px,'+(from.top-to.top)/k+'px) scale(.62)';w.style.opacity='.5';
    w.offsetWidth;w.style.transition='transform .6s var(--in),opacity .4s';w.style.transform='';w.style.opacity='';}
  r.style.setProperty('--d','.35s');await c.wait(700);w.style.transition='';return r;}
async function askSpoken(c,t,a){var r=meRow(t,'');r.classList.add('speaking');var w=r.querySelector('.words'),n=0;
  var ob=new MutationObserver(function(){var words=c.field.heard.textContent.split(' ').filter(Boolean);
    for(;n<words.length;n++){var s=el(w,'new',words[n],'span');w.insertBefore(document.createTextNode(n?' ':''),s);
      (function(s){requestAnimationFrame(function(){requestAnimationFrame(function(){s.className='';});});})(s);}});
  ob.observe(c.field.heard,{childList:true,characterData:true,subtree:true});
  try{await c.speak(a.ask);}finally{ob.disconnect();}
  r.classList.remove('speaking');r.classList.add('planted');await c.wait(550);return r;}
function ask(c,t,a){return a.how==='voice'?askSpoken(c,t,a):askTyped(c,t,a);}

/* what each step found, drawn as it happens */
var J=D.asks.jade.answer,DAY=D.asks.day.answer;
function strip(){return '<span class="strip"><i class="now" style="left:'+((hhmm(D.now.time)-8)/12*100)+'%"></i>'+DAY.events.map(function(e,i){
  return '<i style="left:'+((hhmm(e.at)-8)/12*100)+'%;width:9%;transition-delay:'+(.15+i*.12)+'s"></i>';}).join('')+'</span>';}
var FOUND={
  'Reading your calendar':function(s){return strip()+(s.d?'<b>'+s.d+'</b>':'');},
  'Looking at your chats':function(){return '<img class="mini" alt="" src="'+J.who.face+'"><b>Jade</b> is waiting on you';},
  'Checking Friday’s payments':function(){return '<b class="big">€84</b> Electricity, Friday';},
  'Checking the weather':function(){return SUN+'<b>14°</b> Lyon, rain at 18:00';},
  'Looking at Jade’s chat':function(){return '<img class="mini" alt="" src="'+J.who.face+'"><b>Jade</b> WhatsApp';},
  'Reading her reply from 9:12':function(){return '<span class="bub">'+J.reply.t+'</span>';},
  'Drafting an answer in your words':function(){return '<span class="dash">'+J.draft+'</span>';},
  'Checking the route to Clinique Rive':function(){return '<b>18 min</b> by bike, the long way';}};
function verb(t){var i=t.indexOf(' ');return '<span class="v">'+t.slice(0,i)+'</span>'+t.slice(i);}
function station(box,s,i){var r=row(box,'st live','<p>'+verb(s.t)+'</p><div class="pv">'+(FOUND[s.t]?FOUND[s.t](s):'')+'</div>',0);return r;}

async function work(c,t,a){c.edge.set('work');var w=el(t,'work','<div></div>'),box=w.firstChild;
  for(var i=0;i<a.steps.length;i++){var s=a.steps[i],r=station(box,s,i),pv=r.querySelector('.pv');scrollEnd(c);
    if(s.slow){await c.wait(s.ms/2);
      pv.innerHTML='<svg class="ring" width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--tint)" stroke-width="2"/><circle cx="10" cy="10" r="8" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="50.3" stroke-dashoffset="50.3" transform="rotate(-90 10 10)"/></svg>'+s.d;
      pv.classList.add('on');var arc=pv.querySelectorAll('circle')[1];
      for(var k=1;k<=4;k++){await c.wait(s.ms/2/4);arc.style.strokeDashoffset=50.3*(1-k/4);}}
    else{await c.wait(s.ms*.4);if(!s.fails)pv.classList.add('on');await c.wait(s.ms*.6);}
    r.classList.remove('live');
    if(s.fails){r.classList.add('fail');return false;}}
  await c.wait(300);fold(t,w,a.steps.length);await c.wait(400);return true;}
function fold(t,w,n){var f=el(t,'foldr','<div></div>');t.insertBefore(f,w);
  var r=row(f.firstChild,'','<button type="button" class="foldb" aria-expanded="false">'+n+(n===1?' thing':' things')+' checked '+CHEV+'</button>',0),b=r.querySelector('button');
  b.onclick=function(){var open=w.classList.toggle('folded');b.setAttribute('aria-expanded',String(!open));};
  w.classList.add('folded');f.offsetWidth;f.classList.add('shown');}
function land(c,t){t.classList.add('answered');c.edge.set('landed');}

/* the answers: the path goes on as the data */
function dayAnswer(c,t,quick){var a=DAY,d=quick?0:.12;land(c,t);
  row(t,'lead',a.lead,0);
  var times=[{at:D.now.time,cls:'now',h:'<span class="tm">'+D.now.time+'</span><span class="tt">Now</span>'}];
  a.events.forEach(function(e,i){times.push({at:e.at,cls:'',h:'<span class="tm">'+e.at+'</span><span class="tt">'+e.t+'</span>',
    ln:e.where,pill:e.leave||''});
    if(i===0)times.push({at:'12:00',cls:'minor',glyph:SUN,h:'<span class="tm">12:00</span><span class="tt">Sunny, 14°</span>'});});
  times.push({at:'18:00',cls:'minor',glyph:DROP,h:'<span class="tm">18:00</span><span class="tt">Rain</span>',ln:a.weather.split(': ')[1].replace(/^./,function(x){return x.toUpperCase();})});
  times.forEach(function(x,i){var next=times[i+1],gap=next?Math.max(0,hhmm(next.at)-hhmm(x.at)):0;
    var r=row(t,'ev '+x.cls,'<div class="h">'+x.h+'</div>'+(x.ln?'<div class="ln">'+x.ln+'</div>':'')+(x.pill?'<span class="pill">'+x.pill+'</span>':''),d*(i+1),x.glyph?'<i class="glyph">'+x.glyph+'</i>':null);
    r.style.paddingBottom=(14+gap*6)+'px';});
  var n=times.length+1,w=a.waiting;
  row(t,'who beyond','<div class="nm">'+w.who+'<i aria-label="waits on you"></i><small>'+w.about+'</small></div><div class="msg">'+w.last+'<small><i></i>'+w.at+'</small></div>',d*n++,'<i class="node"><img alt="" src="'+J.who.face+'"></i>');
  row(t,'ev end','<div class="amt"><b>'+a.payment.amount+'</b><span>'+a.payment.t+', due '+a.payment.due+'</span></div>',d*n);}

function jadeAnswer(c,t){var a=J;land(c,t);row(t,'lead',a.lead,0);
  row(t,'who','<div class="nm">'+a.who.name+'</div><div class="msg">'+a.reply.t+'<small><i></i>'+a.reply.app+', '+a.reply.at+'</small></div>',.15,'<i class="node"><img alt="" src="'+a.who.face+'"></i>');
  var r=row(t,'ev end','<div class="draft">'+a.draft+'</div><button type="button" class="send">'+a.send+'</button>',.3),b=r.querySelector('.send');
  b.onclick=async function(){if(b.disabled)return;b.disabled=true;b.classList.add('doing');b.textContent='Sending…';
    try{await c.wait(900);b.classList.remove('doing');b.classList.add('done');b.innerHTML=TICK+'Sent';r.querySelector('.draft').classList.add('sent');
      await c.wait(1000);b.style.opacity='0';b.style.transform='scale(.96)';await c.wait(200);
      var l=el(r.querySelector('.body'),'sentl',TICK+a.sent);b.replaceWith(l);}catch(e){}};}

function followAnswer(c,t){var p=D.followUp.answer.lead.split(': ');land(c,t);
  row(t,'lead','<div class="big26">'+p[0]+'</div><div class="sub">'+p[1].replace(/^./,function(x){return x.toUpperCase();})+'</div>'+
    '<svg class="route" viewBox="0 0 320 110" fill="none" aria-hidden="true"><path d="M0 62 C80 50 120 80 320 58" stroke="var(--wash)" stroke-width="14"/>'+
    '<path d="M40 96 L250 22" stroke="var(--glass)" stroke-width="1.5" stroke-dasharray="3 5"/><path d="M140 52 l10 10 m0 -10 l-10 10" stroke="var(--flag)" stroke-width="2" stroke-linecap="round"/>'+
    '<path class="way" d="M40 96 C70 100 80 70 60 50 S90 10 140 30 S230 40 250 22" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/>'+
    '<circle cx="40" cy="96" r="5" fill="var(--fg)"/><circle cx="250" cy="22" r="5" fill="var(--fg)"/>'+
    ' <text x="250" y="46" text-anchor="end" fill="var(--muted)" font-size="11.5" font-family="var(--sans)">Clinique Rive</text></svg>',0);}

function slowAnswer(c,t){var p=D.slow.answer.lead.split('. '),e=DAY.events[2];land(c,t);
  row(t,'lead','<div class="big26">'+p[0]+'</div>',0);
  row(t,'ev end','<div class="h"><span class="tm">'+e.at+'</span><span class="tt">'+p[1].replace(/ at \d+:\d+\.?$/,'')+'</span></div>',.15);}

function failAnswer(c,t,a){var p=a.error.t.split(': ');c.edge.set('rest');
  row(t,'lead','<div class="fail-t">'+p[0]+'</div>',0).querySelector('.node').style.background='var(--flag)';
  row(t,'ev retry beyond end','<div class="h"><span class="tm">'+a.error.retry+'</span><span class="tt">'+p[1].replace(/ at \d+:\d+\.?$/,'').replace(/^./,function(x){return x.toUpperCase();})+'</span></div>',.15);}

function greet(c,parent){var g=el(parent,'hi','');
  row(g,'end','<h2>Hi</h2><p>'+D.now.day+'</p><div class="sug"><button type="button" data-s="answer-day">'+D.asks.day.ask+'</button><button type="button" data-s="answer-jade">'+D.asks.jade.ask+'</button></div>',0);
  g.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){Shell.run(b.dataset.s);};});return g;}

/* answer: fold the stations, scroll back to his words, bloom */
async function answer(c,t,draw){scrollToEl(c,t);draw(c,t);await c.wait(200);}

Shell.mount({title:'Turn by turn v2: E, path of work',scenes:[
  {id:'idle',label:'Idle',run:function(c){greet(c,c.stage);}},
  {id:'type-send',label:'He types an ask',run:async function(c){var t=turn(c);await ask(c,t,D.asks.day);c.edge.set('work');
    station(el(t,'work','<div></div>').firstChild,D.asks.day.steps[0]);}},
  {id:'voice-send',label:'He says an ask',run:async function(c){var t=turn(c);await ask(c,t,D.asks.jade);c.edge.set('work');
    station(el(t,'work','<div></div>').firstChild,D.asks.jade.steps[0]);}},
  {id:'working',label:'Life works',run:async function(c){var t=turn(c);meRow(t,D.asks.day.ask);await c.wait(500);
    await work(c,t,D.asks.day);await answer(c,t,dayAnswer);}},
  {id:'slow',label:'A slow step',run:async function(c){var t=turn(c);meRow(t,D.slow.ask);await c.wait(500);
    await work(c,t,D.slow);await answer(c,t,slowAnswer);}},
  {id:'answer-day',label:'Answer: the day',run:async function(c){var t=turn(c);await ask(c,t,D.asks.day);await work(c,t,D.asks.day);await answer(c,t,dayAnswer);}},
  {id:'answer-jade',label:'Answer: Jade (voice)',run:async function(c){var t=turn(c);await ask(c,t,D.asks.jade);await work(c,t,D.asks.jade);await answer(c,t,jadeAnswer);}},
  {id:'follow-up',label:'A follow-up',run:async function(c){var t=turn(c);meRow(t,D.asks.day.ask);var w=el(t,'work folded','<div></div>');
    D.asks.day.steps.forEach(function(s){station(w.firstChild,s).classList.remove('live');});fold(t,w,D.asks.day.steps.length);dayAnswer(c,t,true);
    await c.wait(1800);var n=turn(c,true);t.classList.add('past');scrollToEl(c,n);
    await ask(c,n,D.followUp);await work(c,n,D.followUp);await answer(c,n,followAnswer);}},
  {id:'history',label:'Earlier turns',run:async function(c){var hs=D.history,past=turn(c);
    hs.forEach(function(h,i){var d=(hs.length-1-i)*.18+.3;row(past,'h-at',h.at,d,'');row(past,'h-me',h.ask,d+.06);row(past,'h-ans',h.answer,d+.12);});
    var now=turn(c,true);now.style.justifyContent='flex-end';greet(c,now);c.stage.scrollTop=c.stage.scrollHeight;
    await c.wait(900);c.stage.scrollTo({top:0,behavior:reduce?'auto':'smooth'});}},
  {id:'failure',label:'A step fails',run:async function(c){var t=turn(c);meRow(t,D.failure.ask);await c.wait(500);
    if(!await work(c,t,D.failure)){await c.wait(500);failAnswer(c,t,D.failure);}}}]});
</script>
</body>
</html>
