<!doctype html>
<!-- Turn by turn v2, variation A "Cinema", on the real flow (2026-11-28-real-flow.md): his words rise from the field to
     the centre like a title card; while Life works, "Thinking…" then one quiet step line under them, replaced at each
     read and never saying what it found; when the whole answer lands, his words shrink to a caption and the answer plays
     as full-screen shots, one idea each (swipe or tap to move), closing on what he can act on. Drafts are cards: Send is
     his one tap. A proposed block carries a quiet "new block" tag. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: A, cinema</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
/* the title card may rise from under the field, so the stage lets it out (history keeps its scroll) */
.stage:has(> .a:not(.a-scroll)){overflow:visible}
.a{position:absolute;inset:0;--spring:cubic-bezier(.2,1.15,.32,1);--soft:cubic-bezier(.2,.8,.2,1)}
.a-scroll{position:static;inset:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 0 32px;margin-top:auto}
b{font-weight:650}
.a-m{color:var(--muted)}
/* the title card: his words */
.a-ttl{position:absolute;left:20px;right:20px;margin:0;text-align:center;font-size:34px;line-height:1.14;font-weight:650;letter-spacing:-.025em;text-wrap:balance;transform-origin:50% 0;will-change:transform}
.a-ttl .w{display:inline-block;transition:opacity .35s,filter .35s,transform .45s var(--spring)}
.a-ttl .w:not(.on){opacity:0;filter:blur(8px);transform:translateY(6px)}
/* the subtitle: what Life is doing now */
.a-sub{position:absolute;left:24px;right:24px;height:64px;text-align:center}
.a-line{position:absolute;left:0;right:0;top:0;font-size:var(--text-title);font-weight:600;line-height:1.35}
.a-line .v{color:var(--muted);font-weight:450}
.a-line.note{font-size:var(--text-line);font-weight:450;color:var(--muted)}
/* idle */
.a-hi{position:absolute;left:0;right:0;top:38%;text-align:center}
.a-hi h2{margin:0;font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:1}
.a-hi p{margin:14px 0 0;color:var(--muted);font-size:var(--text-body)}
/* the reel: ticks, then one shot at a time */
.a-reel{position:absolute;left:0;right:0;bottom:0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.a-ticks{position:absolute;top:0;left:20px;right:20px;display:flex;gap:4px;height:2px}
.a-ticks i{flex:1;border-radius:1px;background:var(--tint);overflow:hidden;transform-origin:0 50%}
.a-ticks b{display:block;height:100%;background:var(--fg);transform:scaleX(0);transform-origin:0 50%}
.a-ticks .done b{transform:scaleX(1)}
.a-ticks .now b{animation:a-fill var(--d) linear forwards}
.a-ticks .held b{transform:scaleX(1);opacity:.5}
@keyframes a-fill{to{transform:scaleX(1)}}
.a-shot{position:absolute;inset:18px 0 0;padding:0 20px;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none}
.a-shot.on{pointer-events:auto}
.a-shot.top{justify-content:flex-start;padding-top:16px}
.a-shot.on>*{animation:a-in .62s var(--spring) both;animation-delay:calc(var(--i,0) * 80ms + 120ms)}
@keyframes a-in{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
.a-k{margin:0;color:var(--muted);font-size:var(--text-body)}
.a-hero{font-size:88px;line-height:.95;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:6px 0 18px}
.a-hero.mid{font-size:44px;letter-spacing:-.035em;line-height:1.04;text-wrap:balance;margin-bottom:0}
.a-h{font-size:var(--text-profile);font-weight:650;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
.a-p{margin:6px 0 0;color:var(--muted);font-size:var(--text-body)}
.a-big{font-size:var(--text-header);font-weight:600;line-height:1.35;margin:14px 0 0}
/* a proposed block, still to build: a quiet tag under it */
.a-new{display:block;margin-top:6px;font-style:normal;font-size:11px;font-weight:600;color:var(--faint)}
.a-new::before{content:"";display:inline-block;width:5px;height:5px;margin-right:6px;border-radius:3px;background:var(--flag);vertical-align:1px;opacity:.8}
/* the day's events as a filmstrip of frames, the next one lit */
.a-film{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:22px}
.a-fr{min-height:176px;padding:14px 12px;border-radius:var(--block-radius);background:var(--tile);display:flex;flex-direction:column}
.a-fr:first-child{background:var(--paper)}
.a-fr b{font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.a-fr span{margin-top:auto;font-size:var(--text-title);font-weight:650;line-height:1.2}
.a-fr small{margin-top:4px;color:var(--muted);font-size:var(--text-line);line-height:1.3}
/* a place: a tap opens Maps */
.a-place{margin-top:14px;padding:14px 16px;border-radius:var(--block-radius);background:var(--tile);color:var(--fg);text-decoration:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px}
.a-place b{font-size:var(--text-title)}
.a-place small{grid-column:1;color:var(--muted);font-size:var(--text-line)}
.a-place em{grid-column:2;grid-row:1/3;font-style:normal;font-size:var(--text-line);font-weight:650;color:var(--muted)}
/* faces, quotes */
.a-face{width:96px;height:96px;border-radius:48px;display:block}
.a-nb+.a-h{margin-top:18px}
.a-face.s{width:36px;height:36px;border-radius:18px;margin:0}
.a-who{display:flex;align-items:center;gap:12px;font-size:var(--text-title)}
.a-who small{display:block;color:var(--muted);font-size:var(--text-line);font-weight:450}
.a-quote{margin:18px 0 0;padding:16px 18px;border-radius:var(--block-radius);background:var(--paper);font-size:var(--text-header);font-weight:600;line-height:1.4}
.a-quote.s{font-size:var(--text-body);font-weight:450;color:var(--muted);margin-top:12px;padding:12px 14px}
/* a draft card: whose, when, the exact words, Send; then Sent and Undo */
.a-card{margin-top:18px}
.a-card .from{font-size:var(--text-line);color:var(--muted);margin:0}
.a-card .from b{color:var(--fg);font-weight:650}
.a-draft{margin:10px 0 0 auto;max-width:88%;width:fit-content;padding:14px 16px;border-radius:22px 22px 6px 22px;background:var(--tint);font-size:var(--text-title);font-weight:600;transition:background .6s,opacity .4s}
.a-card.sent .a-draft{background:var(--paper)}
.a-card.undone .a-draft{opacity:.4;text-decoration:line-through}
.a-edits{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.a-edits button{height:32px;padding:0 14px;border-radius:16px;background:var(--tile);font-size:var(--text-line);font-weight:600}
.a-send{position:relative;display:block;margin-top:18px;width:100%;height:52px;border-radius:26px;background:var(--fg);color:var(--on);font-weight:650;font-size:var(--text-title);overflow:hidden}
.a-send span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .25s,transform .4s var(--spring)}
.a-send .l2{opacity:0;transform:translateY(12px)}
.a-card.busy .a-send .l1{opacity:0;transform:translateY(-12px)}
.a-card.busy .a-send .l2{opacity:1;transform:none}
.a-card.sent .a-send,.a-card.undone .a-send{display:none}
.a-done{display:none;margin-top:16px;justify-content:space-between;align-items:center;font-size:var(--text-title);font-weight:650;color:var(--ok)}
.a-card.sent .a-done,.a-card.undone .a-done{display:flex}
.a-card.undone .a-done{color:var(--muted)}
.a-done button{height:36px;padding:0 16px;border-radius:18px;background:var(--tile);color:var(--fg);font-size:var(--text-line)}
.a-card.undone .a-done button{display:none}
/* a card brought in while he is idle: it rises above the field, the greeting steps back */
.a-arr{position:absolute;left:-8px;right:-8px;bottom:0;padding:18px 18px 20px;border-radius:30px;background:#1a1b20;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.a-arr .a-card{margin-top:14px}
/* the closing shot: everything in one list */
.a-rows{margin-top:10px}
.a-row{width:100%;min-height:60px;display:grid;grid-template-columns:64px 1fr;align-items:center;gap:12px;text-align:left;padding:8px 0;box-shadow:inset 0 -.5px 0 var(--line)}
.a-row:last-child{box-shadow:none}
.a-row .lead{font-size:var(--text-title);font-weight:650;font-variant-numeric:tabular-nums}
.a-row .txt b{display:block;font-size:var(--text-title)}
.a-row .txt small{display:block;color:var(--muted);font-size:var(--text-line);line-height:1.35}
/* earlier turns, read like credits */
.a-turn{max-width:310px;margin-top:40px}
.a-turn:first-child{margin-top:0}
.a-turn small{display:block;color:var(--faint);font-size:var(--text-meta)}
.a-turn .q{display:block;margin-top:6px;font-size:var(--text-header);font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.a-turn .r{display:block;margin-top:6px;color:var(--muted)}
/* the waveform the field becomes while he speaks */
.field .heard .a-wv{display:flex;align-items:center;justify-content:space-between;height:36px;padding-right:4px}
.field .heard .a-wv i{width:2.5px;height:28px;border-radius:2px;background:var(--fg);transform:scaleY(.1);transition:transform 80ms linear}
@media (prefers-reduced-motion:reduce){.a-ticks .now b{transform:scaleX(1);opacity:.5}}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA,R=matchMedia('(prefers-reduced-motion: reduce)').matches,asked=null;
var SPRING='cubic-bezier(.2,1.15,.32,1)',SOFT='cubic-bezier(.2,.8,.2,1)',OUT='cubic-bezier(.4,0,1,1)';
function el(p,cls,html){var e=document.createElement(cls.indexOf('a-row')===0?'button':'div');if(e.tagName==='BUTTON')e.type='button';e.className=cls;if(html!=null)e.innerHTML=html;p.appendChild(e);return e;}
function esc(s){return s.replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
function cap(s){return s.replace(/^./,function(ch){return ch.toUpperCase();});}
/* animates from one state to another and leaves the element in the second; under Reduce Motion, a cross-fade only */
function mv(e,from,to,ms,ease,delay){var fin=to;
  if(R){var gone=to.opacity===0;from={opacity:gone?1:0};to={opacity:gone?0:1};ms=300;ease='linear';}
  var a=e.animate([from,to],{duration:ms,easing:ease||SOFT,delay:delay||0,fill:'backwards'});
  for(var k in fin)e.style[k]=fin[k];return a;}
function gone(e,ms){var a=mv(e,{opacity:1,transform:'none',filter:'none'},{opacity:0,transform:'translateY(-10px)',filter:'blur(8px)'},ms||260,OUT);a.onfinish=function(){e.remove();};}
function root(c,scroll){return el(c.stage,'a'+(scroll?' a-scroll':''));}
function split(s,at){var i=s.indexOf(at);return i<0?[s,'']:[s.slice(0,i+(at==='. '?1:0)),s.slice(i+at.length)];}
/* a proposed block, still to build */
function nb(kind,html){return '<div class="a-nb">'+html+'<i class="a-new">new block · '+kind+'</i></div>';}

/* the title card: his words, centred a little above the middle */
function title(r,text,hidden){var t=el(r,'a-ttl','');
  text.split(' ').forEach(function(w,i){var s=document.createElement('span');s.className='w'+(hidden?'':' on');s.textContent=w;if(i)t.appendChild(document.createTextNode(' '));t.appendChild(s);});
  var top=Math.round(r.clientHeight*.4-t.offsetHeight/2);t.style.top=top+'px';t.dataset.top=top;return t;}
function scaleOf(c){return c.phone.getBoundingClientRect().width/390;}

/* typed: the words leave the field and rise to the centre, growing into the title card */
async function typed(c,r,text,already){
  if(!already){await c.type(c.field.input,text);await c.wait(380);mv(c.field.send,{transform:'scale(.8)'},{transform:'scale(1)'},420,SPRING);}
  var k=scaleOf(c),s=r.getBoundingClientRect(),f=c.field.el.getBoundingClientRect(),t=title(r,text),tr=t.getBoundingClientRect(),rg=document.createRange();
  rg.selectNodeContents(t);var w=rg.getBoundingClientRect().width/k,S=16/34;
  var dx=(f.left-s.left)/k+18+w*S/2-((tr.left+tr.width/2)-s.left)/k,dy=(f.top+f.height/2-s.top)/k-((tr.top+tr.height/2)-s.top)/k;
  c.field.clear();
  mv(t,{transform:'translate('+dx+'px,'+dy+'px) scale('+S+')',opacity:.5},{transform:'none',opacity:1},760,SPRING);
  await c.wait(780);return t;}

/* held to talk: the field becomes a waveform, his words write themselves in low on the screen as heard, then lift
   into the title card */
async function spoken(c,r,text,already){
  var t=title(r,text,!already),top=+t.dataset.top,h=t.offsetHeight,low=r.clientHeight-28-h*.9-top;
  if(already){c.field.clear();mv(t,{transform:'translateY('+low+'px) scale(.8)',opacity:0},{transform:'none',opacity:1},760,SPRING);await c.wait(780);return t;}
  t.style.transform='translateY('+low+'px) scale(.8)';
  c.field.live(true);c.edge.set('listen');var heard=c.field.heard,n=46,bars='';for(var i=0;i<n;i++)bars+='<i></i>';
  heard.innerHTML='<span class="a-wv" aria-hidden="true">'+bars+'</span>';var bs=heard.querySelectorAll('i'),words=t.querySelectorAll('.w'),ph=0;
  heard.setAttribute('aria-label',text);
  for(var j=0;j<words.length;j++){words[j].classList.add('on');
    for(var q=0;q<6;q++){var lv=.45+.55*Math.random();c.edge.level(lv);ph+=.55;
      for(var b=0;b<n;b++){var env=Math.sin(Math.PI*(b+.5)/n),v=.12+.88*env*lv*(.45+.55*Math.abs(Math.sin(b*.7+ph)*Math.cos(b*.31-ph*.6)));bs[b].style.transform='scaleY('+Math.max(.08,v).toFixed(3)+')';}
      await c.wait(55);}}
  bs.forEach(function(x){x.style.transform='scaleY(.08)';});c.edge.level(1);await c.wait(320);
  c.field.live(false);c.field.clear();heard.removeAttribute('aria-label');
  mv(t,{transform:'translateY('+low+'px) scale(.8)'},{transform:'none'},820,SPRING);await c.wait(840);return t;}

/* the subtitle under the title card: one quiet line, each new one inks in where the last blurred away; a second,
   quieter line when a turn runs long */
function subtitle(r,t){var s=el(r,'a-sub',''),cur=null;s.style.top=(+t.dataset.top+t.offsetHeight+22)+'px';s.setAttribute('aria-live','polite');
  function line(html,cls){var l=el(s,'a-line'+(cls?' '+cls:''),html);mv(l,{opacity:0,transform:'translateY(8px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'none'},480,SOFT,cur?140:0);return l;}
  return {set:function(html){if(cur)gone(cur);cur=line(html);},
    note:function(text){var n=line(esc(text),'note');n.style.top='34px';},
    out:function(){gone(s,300);}};}
function stepHtml(t){var i=t.indexOf(' ');return '<span class="v">'+t.slice(0,i)+'</span>'+esc(t.slice(i));}

/* Life works: "Thinking…", then the step line, replaced at each read; it never says what a read found */
async function work(c,r,t,a){c.edge.set('work');var s=subtitle(r,t),spent=0,noted=false;s.set('<span class="v">Thinking…</span>');
  async function hold(ms){if(a.stillAfter&&!noted&&spent+ms>a.stillAfter){var d=a.stillAfter-spent;await c.wait(d);s.note(a.still);noted=true;ms-=d;spent+=d;}
    await c.wait(ms);spent+=ms;}
  await hold(a.first);for(var st of a.steps){s.set(stepHtml(st.t));await hold(st.ms);}
  return s;}

/* the whole answer lands at once: the step line goes, his words shrink to a caption, the edge pulses, the reel's ticks
   draw in and the first shot's parts arrive one after another (about 1.2 s in all) */
async function land(c,r,t,s,shots){if(s)s.out();var top=+t.dataset.top,h=t.offsetHeight;
  mv(t,{transform:'none',opacity:1},{transform:'translateY('+(4-top)+'px) scale(.46)',opacity:.6},640,SPRING,s?100:0);
  c.edge.set('landed');await c.wait(220);return reel(c,r,Math.round(4+h*.46+20),shots).play();}
function captionNow(r,text){var t=title(r,text);t.style.transform='translateY('+(4-t.dataset.top)+'px) scale(.46)';t.style.opacity=.6;return Math.round(4+t.offsetHeight*.46+20);}

/* the reel: shots that advance on their own with a soft cut; swipe, or tap left and right, to move; a row of the
   closing shot jumps back to its shot */
function reel(c,r,top,shots,instant){var w=el(r,'a-reel',''),i=-1,user=false,n=shots.length,ticks=null,els=[];w.style.top=top+'px';
  if(n>1){ticks=el(w,'a-ticks',shots.map(function(){return '<i><b></b></i>';}).join(''));
    if(!instant)[].forEach.call(ticks.children,function(x,j){mv(x,{transform:'scaleX(0)',opacity:0},{transform:'none',opacity:1},520,SOFT,j*60);});}
  shots.forEach(function(sh){var e=el(w,'a-shot'+(sh.top?' top':''),sh.html);[].forEach.call(e.children,function(ch,j){ch.style.setProperty('--i',j);});els.push(e);if(sh.init)sh.init(e,go);});
  function marks(ms){if(!ticks)return;[].forEach.call(ticks.children,function(t,x){t.className=x<i?'done':x===i&&x<n-1?(user||!ms?'held':'now'):x===i?'done':'';if(ms)t.style.setProperty('--d',ms+'ms');});}
  function go(x,byHim,ms){x=Math.max(0,Math.min(n-1,x));if(byHim)user=true;if(x===i)return;var dir=x>i?1:-1,old=els[i];i=x;
    if(old){old.classList.remove('on');mv(old,{opacity:1,transform:'none',filter:'none'},{opacity:0,transform:'translateX('+(-dir*18)+'px) scale(.98)',filter:'blur(6px)'},220,OUT);}
    var e=els[x];e.classList.add('on');
    if(instant&&!old){e.style.opacity=1;[].forEach.call(e.children,function(ch){ch.style.animation='none';});}
    else mv(e,{opacity:0,transform:'translateX('+(dir*28)+'px) scale(.985)',filter:'blur(4px)'},{opacity:1,transform:'none',filter:'none'},520,SPRING,old?110:0);
    marks(ms);}
  var x0=null;w.addEventListener('pointerdown',function(e){x0=e.clientX;});
  w.addEventListener('pointerup',function(e){if(x0===null)return;var dx=(e.clientX-x0)/scaleOf(c);x0=null;
    if(Math.abs(dx)>40){go(i+(dx<0?1:-1),true);return;}
    if(e.target.closest('button,a')||i===n-1)return;var b=w.getBoundingClientRect();go(e.clientX-b.left<b.width/3?i-1:i+1,true);});
  return {go:go,play:async function(){for(var x=0;x<n;x++){if(user)return;var ms=shots[x].ms||0;go(x,false,ms);if(x<n-1)await c.wait(ms);}}};}

/* a draft card (an `items` block): whose, when it was drafted, the exact words, Send; then Sent and Undo */
function cardHtml(k){return '<div class="a-card"><p class="from"><b>To '+k.to+' on '+k.app+'</b><br>'+k.made+'</p>'+
  '<div class="a-draft">'+esc(k.draft)+'</div>'+
  (k.edits?'<div class="a-edits">'+k.edits.map(function(x){return '<button type="button">'+x+'</button>';}).join('')+'</div>':'')+
  '<button type="button" class="a-send"><span class="l1">'+k.send+'</span><span class="l2">'+k.sending+'</span></button>'+
  '<div class="a-done" aria-live="polite"><span>'+k.sent+'</span><button type="button">'+k.undo+'</button></div></div>';}
function wireCard(e,k,c){var card=e.querySelector('.a-card'),done=card.querySelector('.a-done span');
  card.querySelector('.a-send').onclick=async function(){if(card.classList.contains('busy'))return;card.classList.add('busy');
    try{await c.wait(k.sendMs);}catch(x){return;}card.classList.remove('busy');card.classList.add('sent');c.edge.set('landed');};
  card.querySelector('.a-done button').onclick=function(){card.classList.remove('sent');card.classList.add('undone');done.textContent='Deleted for everyone';};}
function placeHtml(p){return '<a class="a-place" href="https://maps.apple.com/?q='+encodeURIComponent(p.name+', '+p.address)+'" target="_blank" rel="noopener"><b>'+p.name+'</b><small>'+p.address+'</small><em>Maps</em></a>';}

function dayShots(){var a=D.asks.day.answer,ld=split(a.lead,'. '),face=D.asks.jade.answer.who.face,p=a.payment;
  return [
    {ms:4800,top:true,html:'<h3 class="a-h">'+ld[0]+'</h3>'+
      nb('event','<div class="a-film">'+a.events.map(function(e){return '<div class="a-fr"><b>'+e.at+'</b><span>'+e.t+'</span><small>'+e.where+'</small></div>';}).join('')+'</div>')+placeHtml(a.place)},
    {ms:4400,html:nb('face','<img class="a-face" alt="" src="'+face+'">')+'<h3 class="a-h">'+ld[1]+'</h3><p class="a-p">'+a.waiting.about+', last written '+a.waiting.at.toLowerCase()+'</p><div class="a-quote">“'+a.waiting.last+'”</div>'},
    {ms:3400,html:nb('payment','<p class="a-k">Due '+p.due+'</p><div class="a-hero">'+p.amount+'</div><h3 class="a-h">'+p.t+'</h3>')},
    {top:true,init:function(e,go){e.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(+b.dataset.go,true);};});},
      html:'<div class="a-rows">'+
        a.events.map(function(e){return '<button type="button" class="a-row" data-go="0"><span class="lead">'+e.at+'</span><span class="txt"><b>'+e.t+'</b><small>'+e.where+'</small></span></button>';}).join('')+
        '<button type="button" class="a-row" data-go="1"><span class="lead"><img class="a-face s" alt="" src="'+face+'"></span><span class="txt"><b>'+a.waiting.who+' waits on you</b><small>'+a.waiting.about+'</small></span></button>'+
        '<button type="button" class="a-row" data-go="2"><span class="lead">'+p.amount+'</span><span class="txt"><b>'+p.t+'</b><small>Due '+p.due+'</small></span></button></div>'}];}

function jadeShots(c){var a=D.asks.jade.answer,ld=split(a.lead,'. '),who='<div class="a-who"><img class="a-face s" alt="" src="'+a.who.face+'"><span><b>'+a.who.name+'</b><small>'+a.reply.app+', '+a.reply.at+'</small></span></div>';
  return [
    {ms:3000,html:nb('face','<img class="a-face" alt="" src="'+a.who.face+'">')+'<h3 class="a-h">'+ld[0]+'</h3>'},
    {ms:4200,html:who+nb('quote','<div class="a-quote">“'+a.reply.t+'”</div>')},
    {html:who+'<div class="a-quote s">“'+a.reply.t+'”</div><p class="a-p">'+ld[1]+'</p>'+cardHtml(a.card),init:function(e){wireCard(e,a.card,c);}}];}

function tellShots(c){var a=D.asks.tell.answer;
  return [{ms:2200,html:'<div class="a-hero mid">'+a.lead+'</div>'},
    {html:'<p class="a-k">'+a.lead+'</p>'+cardHtml(a.card),init:function(e){wireCard(e,a.card,c);}}];}

/* one idea answers: the key part large, the rest under it */
function oneShot(text,sep,extra,cls){var p=split(text,sep);return [{html:'<div class="'+(cls||'a-hero mid')+'">'+p[0]+'</div>'+(p[1]?'<p class="a-big">'+cap(p[1])+'</p>':'')+(extra||'')}];}

async function ask(c,r,a){var mine=asked;asked=null;var text=mine?mine.text:a.ask;
  return (mine?mine.how:a.how)==='voice'?spoken(c,r,text,!!mine):typed(c,r,text,!!mine);}
async function turn(c,a,shots){var r=root(c),t=await ask(c,r,a),s=await work(c,r,t,a);await land(c,r,t,s,shots);}
function shown(r,text){var t=title(r,text);mv(t,{opacity:0},{opacity:1},400);return t;}

Shell.mount({title:'Turn by turn v2: A, cinema',
  onAsk:function(text,how){asked={text:text,how:how};Shell.run(how==='voice'?'voice-send':'type-send');},
  scenes:[
  {id:'idle',label:'Idle',run:function(c){var r=root(c),h=el(r,'a-hi','<h2>Hi</h2><p>'+D.now.day+'</p>');
    mv(h.firstChild,{opacity:0,transform:'translateY(16px)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'none'},700,SPRING);
    mv(h.lastChild,{opacity:0},{opacity:1},600,SOFT,250);}},
  {id:'type-send',label:'He types an ask',run:async function(c){if(asked)return turn(c,D.asks.day,dayShots());
    var r=root(c),t=await ask(c,r,D.asks.day);c.edge.set('work');subtitle(r,t).set('<span class="v">Thinking…</span>');}},
  {id:'voice-send',label:'He holds to talk',run:async function(c){if(asked)return turn(c,D.asks.jade,jadeShots(c));
    var r=root(c),t=await ask(c,r,D.asks.jade);c.edge.set('work');subtitle(r,t).set('<span class="v">Thinking…</span>');}},
  {id:'working',label:'Life works',run:async function(c){var r=root(c),t=shown(r,D.asks.day.ask),s=await work(c,r,t,D.asks.day);await land(c,r,t,s,dayShots());}},
  {id:'answer-day',label:'Answer: the day',run:function(c){return turn(c,D.asks.day,dayShots());}},
  {id:'answer-jade',label:'Answer: Jade, with her draft',run:function(c){return turn(c,D.asks.jade,jadeShots(c));}},
  {id:'tell',label:'Tell Ben: a draft on his words',run:function(c){return turn(c,D.asks.tell,tellShots(c));}},
  {id:'card-arrives',label:'A card arrives',run:async function(c){var r=root(c),h=el(r,'a-hi','<h2>Hi</h2><p>'+D.now.day+'</p>'),k=D.arrives.card,x=k.context;
    await c.wait(D.arrives.arriveMs);
    var p=el(r,'a-arr','<div class="a-who"><span><b>'+x.who+'</b><small>'+x.app+', '+x.at+'</small></span></div>'+nb('quote','<div class="a-quote s">“'+x.t+'”</div>')+cardHtml(k));
    wireCard(p,k,c);mv(h,{transform:'none'},{transform:'translateY(-120px)',opacity:.5},900,SOFT);
    mv(p,{transform:'translateY(110%)',opacity:0},{transform:'none',opacity:1},900,SPRING);}},
  {id:'slow',label:'A slow ask',run:function(c){var a=D.slow;return turn(c,a,oneShot(a.answer.lead,'. ',placeHtml(a.answer.place)));}},
  {id:'failure',label:'A read fails',run:function(c){var a=D.failure;return turn(c,a,oneShot(a.error.t,'. ','','a-h'));}},
  {id:'history',label:'Earlier turns',run:function(c){var r=root(c,true);
    D.history.forEach(function(h,i){var e=el(r,'a-turn','<small>'+h.at+'</small><span class="q">'+h.ask+'</span><span class="r">'+h.answer+'</span>');
      mv(e,{opacity:0,transform:'translateY(40px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'none'},700,SPRING,i*140);});
    c.stage.scrollTop=c.stage.scrollHeight;}},
  {id:'follow-up',label:'A follow-up',run:async function(c){var r=root(c),top=captionNow(r,D.asks.day.ask),sh=dayShots();reel(c,r,top,sh,true).go(sh.length-1);
    mv(r,{opacity:0},{opacity:1},400);await c.wait(1500);
    await c.type(c.field.input,D.followUp.ask);await c.wait(380);mv(c.field.send,{transform:'scale(.8)'},{transform:'scale(1)'},420,SPRING);
    var r2=root(c);[].forEach.call(r.children,function(x){gone(x,260);});
    var t=await typed(c,r2,D.followUp.ask,true),s=await work(c,r2,t,D.followUp);r.remove();await land(c,r2,t,s,oneShot(D.followUp.answer.lead,': '));}},
  {id:'hey-life',label:'Hey Life, from the pendant',run:async function(c){var h=D.heyLife;c.lock();c.edge.set('still');
    await c.wait(h.heardMs);c.lock(h.heardAt);c.notify(h.heard);await c.wait(h.answerMs);
    await Promise.race([c.notify(h.done),c.wait(4000)]); /* his tap, or on its own for Play all */
    c.lock(false);c.edge.set('rest');var r=root(c),t=shown(r,h.ask);await c.wait(500);await land(c,r,t,null,oneShot(h.answer.lead,', '));}}]});
</script>
</body>
