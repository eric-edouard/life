<!doctype html>
<!-- Turn by turn v2, the variant template: every scene with plain placeholder visuals. Copy it to variant-<letter>.html
     and design only what goes in the stage (and this page's <style>); the shell, the edge and the data stay shared. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: template</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
.t-me{align-self:flex-end;margin-top:12px;padding:10px 14px;border-radius:20px;background:var(--tint);font-weight:600}
.t-life{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.t-step{color:var(--muted)}
.t-box{position:relative;padding:12px;border-radius:var(--block-radius);background:var(--tile)}
.t-box small{display:block;color:var(--muted);font-size:var(--text-line)}
.t-new{position:absolute;top:8px;right:10px;font-style:normal;font-size:11px;font-weight:650;color:var(--flag)}
.t-face{width:48px;height:48px;border-radius:24px}
.t-btn{height:44px;border-radius:22px;background:var(--fg);color:var(--on);font-weight:650;width:100%;margin-top:8px}
.t-hi{margin:auto 0;text-align:center;font-size:28px;font-weight:650}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA;
function el(parent,cls,html){var e=document.createElement('div');e.className=cls;e.innerHTML=html;parent.appendChild(e);return e;}
/* a piece of an answer: a box, marked when it is a proposed new block */
function box(parent,p,html){return el(parent,'t-box',(p.block==='new'?'<i class="t-new">new block · '+p.kind+'</i>':'')+html);}
/* his turn: typed in the field and sent, or held to talk (his words show as he speaks) */
async function ask(c,a){if(a.how==='voice')await c.speak(a.ask);else{await c.type(c.field.input,a.ask);await c.wait(300);c.field.clear();}
  el(c.stage,'t-me',a.ask);}
/* Life works: "Thinking…", then one step line replaced at each read; a slow turn adds a second quiet line */
async function work(c,a){c.edge.set('work');var b=el(c.stage,'t-life',''),line=el(b,'t-step','Thinking…'),t=0,still=null;
  async function hold(ms){if(a.stillAfter&&!still&&t+ms>a.stillAfter){await c.wait(a.stillAfter-t);still=el(b,'t-step',a.still);ms-=a.stillAfter-t;t=a.stillAfter;}await c.wait(ms);t+=ms;}
  await hold(a.first);for(var s of a.steps){line.textContent=s.t;await hold(s.ms);}
  b.remove();}
/* a draft card: Send one tap, then Sent and Undo */
function card(parent,k,c){var b=box(parent,k,'<small>'+k.app+' · to '+k.to+' · '+k.made+'</small>'+
    k.draft+(k.edits?'<small>'+k.edits.join(' · ')+'</small>':'')+'<button type="button" class="t-btn">'+k.send+'</button>');
  if(k.context)b.insertBefore(box(b,k.context,'<small>'+k.context.who+' · '+k.context.app+' · '+k.context.at+'</small>'+k.context.t),b.firstChild);
  var btn=b.querySelector('.t-btn');btn.onclick=async function(){btn.textContent=k.sending;btn.disabled=true;await c.wait(k.sendMs);
    btn.outerHTML='<div class="t-step">'+k.sent+' · <u>'+k.undo+'</u></div>';};return b;}
function lead(c,text){return el(c.stage,'t-life','<b>'+text+'</b>');}
function dayAnswer(c){var a=D.asks.day.answer,b=lead(c,a.lead);
  a.events.forEach(function(e){box(b,e,'<b>'+e.at+' '+e.t+'</b><small>'+e.where+'</small>');});
  box(b,a.place,'<b>'+a.place.name+'</b><small>'+a.place.address+'</small>');
  box(b,a.waiting,'<b>'+a.waiting.who+' waits on you: '+a.waiting.about+'</b><small>“'+a.waiting.last+'”</small>');
  box(b,a.payment,'<b>'+a.payment.t+' '+a.payment.amount+'</b><small>Due '+a.payment.due+'</small>');c.edge.set('landed');}
function jadeAnswer(c){var a=D.asks.jade.answer,b=lead(c,a.lead);
  box(b,a.who,'<img class="t-face" alt="" src="'+a.who.face+'"><small>'+a.who.name+'</small>');
  box(b,a.reply,'<small>'+a.reply.app+' · '+a.reply.at+'</small>'+a.reply.t);
  card(b,a.card,c);c.edge.set('landed');}
async function turn(c,a,draw){await ask(c,a);await work(c,a);draw(c);}
Shell.mount({title:'Turn by turn v2: template',scenes:[
  {id:'idle',label:'Idle',run:function(c){el(c.stage,'t-hi','Hi');}},
  {id:'type-send',label:'He types an ask',run:async function(c){await ask(c,D.asks.day);c.edge.set('work');}},
  {id:'voice-send',label:'He holds to talk',run:async function(c){await ask(c,D.asks.jade);c.edge.set('work');}},
  {id:'working',label:'Life works',run:async function(c){el(c.stage,'t-me',D.asks.day.ask);await work(c,D.asks.day);}},
  {id:'answer-day',label:'Answer: the day',run:function(c){return turn(c,D.asks.day,dayAnswer);}},
  {id:'answer-jade',label:'Answer: Jade, with her draft',run:function(c){return turn(c,D.asks.jade,jadeAnswer);}},
  {id:'tell',label:'Tell Ben: a draft on his words',run:function(c){return turn(c,D.asks.tell,function(c){var a=D.asks.tell.answer;card(lead(c,a.lead),a.card,c);c.edge.set('landed');});}},
  {id:'card-arrives',label:'A card arrives',run:async function(c){el(c.stage,'t-hi','Hi');await c.wait(D.arrives.arriveMs);c.stage.innerHTML='';card(c.stage,D.arrives.card,c);}},
  {id:'slow',label:'A slow ask',run:function(c){return turn(c,D.slow,function(c){var a=D.slow.answer,b=lead(c,a.lead);box(b,a.place,'<b>'+a.place.name+'</b><small>'+a.place.address+'</small>');c.edge.set('landed');});}},
  {id:'failure',label:'A read fails',run:function(c){return turn(c,D.failure,function(c){lead(c,D.failure.error.t);c.edge.set('landed');});}},
  {id:'history',label:'Earlier turns',run:function(c){D.history.forEach(function(h){el(c.stage,'t-step',h.at);el(c.stage,'t-me',h.ask);el(c.stage,'t-life',h.answer);});}},
  {id:'follow-up',label:'A follow-up',run:async function(c){el(c.stage,'t-me',D.asks.day.ask);dayAnswer(c);await c.wait(1500);
    await turn(c,D.followUp,function(c){lead(c,D.followUp.answer.lead);c.edge.set('landed');});}},
  {id:'hey-life',label:'Hey Life, from the pendant',run:async function(c){var h=D.heyLife;c.lock();c.edge.set('still');
    await c.wait(h.heardMs);c.lock(h.heardAt);c.notify(h.heard);await c.wait(h.answerMs);await Promise.race([c.notify(h.done),c.wait(4000)]); /* his tap, or on its own for Play all */
    c.lock(false);c.edge.set('rest');el(c.stage,'t-me',h.ask);lead(c,h.answer.lead);c.edge.set('landed');}}]});
</script>
</body>
</html>
