<!doctype html>
<!-- Turn by turn v2, variant D, "Cards on the table", on the real flow (2026-11-28-real-flow.md). While Life works the
     table stays empty: his words small at the top, one quiet step line under them, replaced at each read. When the
     answer is ready it arrives whole: the words ink in and Life deals the answer's objects onto the table in one motion.
     Tap an object to pick it up; drag it down or tap outside to put it back. Drafts are cards, Send is his one tap.
     A proposed block carries a quiet "new block" mark. Built on shell.js, edge.js and data.js; only this file is D's. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: D, cards on the table</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
.ph{
  --obj:color-mix(in srgb,var(--fg) 8%,var(--bg));
  --obj-up:color-mix(in srgb,var(--fg) 11%,var(--bg));
  --shade:color-mix(in srgb,var(--bg) 85%,transparent);
  --lay:0 1px 2px var(--shade),0 12px 28px -10px var(--shade);
  --held:0 30px 60px -12px var(--bg),0 8px 20px var(--shade)}
.d-wrap{position:relative;isolation:isolate;flex:1 0 auto;display:flex;flex-direction:column;padding:8px 0 24px}
/* the table: a faint pool of light that comes up when he asks, and stays */
.d-wrap::before{content:"";position:absolute;z-index:-1;inset:60px -20px 0;background:radial-gradient(70% 45% at 50% 40%,var(--wash),transparent 72%);opacity:0;transition:opacity 1.4s ease}
.d-wrap.lit::before{opacity:1}
/* his words: small, above the table, on his side */
.d-his{text-align:right;min-height:20px;margin-top:4px}
.d-his span{display:inline-block;max-width:86%;transform-origin:0 0;font-size:var(--text-line);font-weight:600;color:var(--muted);line-height:1.4}
.d-his small{display:block;font-size:var(--text-meta);color:var(--faint);margin-top:2px}
/* his voice, while he speaks: big words, each dim, then cream */
.d-live{position:absolute;left:4px;right:4px;top:34%;font-size:var(--text-profile);font-weight:650;line-height:1.25;text-align:center;text-wrap:balance}
.d-live .w{color:var(--muted);transition:color .35s}
.d-live .w.on{color:var(--fg)}
/* while Life works: one quiet line, and after a long while a second one with a still ring */
.d-steps{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.d-steps:empty{margin-top:0}
.d-step{font-size:var(--text-line);font-weight:600;line-height:1.35;color:var(--muted);width:fit-content;
  background:linear-gradient(100deg,var(--muted) 40%,var(--fg) 50%,var(--muted) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:d-shim 3.2s linear infinite}
@keyframes d-shim{from{background-position:100% 0}to{background-position:-150% 0}}
.d-still{display:flex;align-items:center;gap:8px;font-size:var(--text-line);color:var(--faint)}
.pie{width:16px;height:16px;flex:none}
/* the answer's words, on top of the table */
.d-lead{font-size:var(--text-header);font-weight:650;line-height:1.3;margin-top:12px;text-wrap:balance}
.d-lead:empty{margin-top:0}
.d-table{position:relative;display:flex;flex-direction:column;margin-top:18px}
.d-table.edge-of{margin-top:auto}
/* an object on the table */
.d-obj{position:relative;transition:scale .35s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s}
.d-obj+.d-obj,.d-obj+.d-pair{margin-top:14px}
.d-obj.can{cursor:pointer}
.d-face{position:relative;border-radius:var(--block-radius);background:var(--obj);padding:16px;box-shadow:var(--lay)}
.d-obj small,.d-lift small{display:block;font-size:var(--text-line);color:var(--muted);line-height:1.35}
.d-meta{display:block;font-size:var(--text-meta);color:var(--muted);font-weight:600;margin-bottom:6px}
.d-title{display:block;font-size:var(--text-title);font-weight:650;line-height:1.3}
/* the mark on a proposed block */
.d-new{display:flex;align-items:center;gap:6px;margin-top:12px;font-style:normal;font-size:10.5px;font-weight:600;color:var(--faint);opacity:.75}
.d-new::before{content:"";width:7px;height:7px;border-radius:2px;border:1px dashed currentColor}
/* the day */
.d-ev{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:7px 0}
.d-ev:last-of-type{padding-bottom:0}
.d-at{font-size:var(--text-title);font-weight:650;font-variant-numeric:tabular-nums}
.d-ev b:not(.d-at){display:block;font-size:var(--text-title);font-weight:650}
/* a place: one tap opens Maps */
.d-chip .d-face{padding:10px 14px;border-radius:16px}
.d-obj.d-under{margin:-10px 18px 0 auto;width:78%;z-index:0}
.d-place{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:40px}
.d-place b{display:block;font-size:var(--text-body);font-weight:650}
.d-pin{display:flex;color:var(--muted)}
/* two objects side by side, one over the other's edge */
.d-pair{display:flex;align-items:flex-start}
.d-pair>.d-obj:first-child{flex:1.3;min-width:0;z-index:2}
.d-pair>.d-obj:last-child{flex:1;min-width:0;margin:26px 0 0 -12px;z-index:3}
.d-amount{display:block;font-size:var(--text-profile);font-weight:650;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.d-msg{margin:8px 0 6px;font-size:var(--text-line);line-height:1.4}
/* a person: face and words */
.d-who{display:flex;align-items:center;gap:12px}
.d-who b{display:block;font-size:var(--text-title);font-weight:650}
.d-face-img{width:40px;height:40px;border-radius:20px;flex:none}
.d-big .d-face-img{width:52px;height:52px;border-radius:26px}
.d-big .d-who b{font-size:var(--text-header)}
.d-bubble{margin:12px 0 0;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--tint);font-size:var(--text-body);line-height:1.4;width:fit-content;max-width:94%}
/* the cards (the shell's): dealt as one object, each card an object of the table */
.d-cards{--s-card-bg:var(--obj);--s-card-shadow:var(--lay);--s-card-radius:var(--block-radius)}
.d-cards>.d-face{background:none;box-shadow:none;padding:0;border-radius:0}
.d-cards .d-meta{margin-bottom:10px}
.d-pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;background:var(--tint);font-size:var(--text-body);font-weight:650;margin-top:12px}
.d-pill.wide{display:flex;width:100%}
/* earlier turns: filed cards */
.d-file .d-face{padding:14px 16px}
.d-file .d-ask{font-size:var(--text-line);color:var(--muted);font-weight:600;margin:0 0 6px}
.d-file b{font-size:var(--text-title);font-weight:650;line-height:1.35}
.d-table.deck .d-obj+.d-obj{margin-top:-6px}
/* idle */
.d-hi{margin:auto 0;padding-bottom:48px;text-align:center}
.d-hi b{display:block;font-size:var(--text-profile);font-weight:650}
.d-hi small{display:block;margin-top:4px;font-size:var(--text-line);color:var(--muted)}
/* picked up: the object lifts into its full view, the rest recede */
.d-wrap.lifted .d-obj:not(.held),.d-wrap.lifted .d-lead,.d-wrap.lifted .d-his{opacity:.22;filter:blur(2px);scale:.95;transition:opacity .3s,filter .3s,scale .35s}
.d-obj.held{opacity:0}
.d-scrim{position:absolute;inset:0;z-index:3}
.d-lift{position:absolute;left:16px;right:16px;top:76px;max-height:calc(100% - 76px - 104px);overflow-y:auto;z-index:4;padding:8px 20px 20px;border-radius:var(--panel-radius);background:var(--obj-up);box-shadow:var(--held);transform-origin:0 0;touch-action:none;scrollbar-width:none}
.d-grab{display:block;width:100%;height:28px;margin-bottom:8px;position:relative;cursor:grab}
.d-grab::after{content:"";position:absolute;left:50%;top:10px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--glass)}
.d-lift .d-ev{grid-template-columns:56px 1fr;padding:12px 0}
.d-lift .d-at{font-size:var(--text-header)}
.d-lift h2{margin:0 0 12px;font-size:var(--text-header);font-weight:650}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA,RM=matchMedia('(prefers-reduced-motion: reduce)').matches,CTX=null,held=null;
/* springs: a soft one for settling, one with a little overshoot for objects landing on the table */
var SETTLE='linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.099 24.3%,1.108 26%,1.1 27.6%,1.078 30.1%,1.049 32.5%,.994 37.3%,.981 40.2%,.974 43.4%,.975 50.2%,.997 62.5%,1.003 69.4%,1)';
var SOFT='linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 85.9%,1)';
var INK='cubic-bezier(.2,.8,.2,1)',OUT='cubic-bezier(.4,0,1,1)';
var PIN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function h(parent,cls,html,tag){var e=document.createElement(tag||'div');if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x];});}
/* every motion goes through here: under Reduce Motion it becomes a cross-fade */
function anim(el,kf,o){if(RM){var a=kf[0].opacity,b=kf[kf.length-1].opacity;if(a==null)a=b==null?.4:1;if(b==null)b=1;
    return el.animate([{opacity:a},{opacity:b}],{duration:200,delay:o.delay||0,fill:o.fill||'none'});}
  return el.animate(kf,o);}
function ink(el,delay){return anim(el,[{opacity:0,filter:'blur(8px)',transform:'translateY(6px)'},{opacity:1,filter:'blur(0)',transform:'none'}],{duration:480,easing:INK,delay:delay||0,fill:'backwards'});}
/* a rect in the phone's own points, whatever the page's scale */
function rel(el){var p=CTX.phone.getBoundingClientRect(),k=p.width/390,r=el.getBoundingClientRect();return {x:(r.left-p.left)/k,y:(r.top-p.top)/k,w:r.width/k,h:r.height/k};}
/* the quiet mark on a proposed block: what needs building */
function tag(){var kinds=[].slice.call(arguments).filter(function(p){return p&&p.block==='new';}).map(function(p){return p.kind;});
  return kinds.length?'<i class="d-new">new block · '+kinds.join(', ')+'</i>':'';}

function begin(c){CTX=c;held=null;document.querySelectorAll('.d-lift,.d-scrim').forEach(function(e){e.remove();});
  var w=h(c.stage,'d-wrap','');w.his=h(w,'d-his','');w.steps=h(w,'d-steps','');w.steps.setAttribute('aria-live','polite');
  w.lead=h(w,'d-lead','');w.lead.setAttribute('aria-live','polite');w.table=h(w,'d-table','');return w;}

/* ---------- objects ---------- */
/* o: {front, full, tilt, cls}; full is what he sees when he picks it up (true: the front, bigger) */
function obj(parent,o){var e=h(parent,'d-obj '+(o.cls||''),'<div class="d-face">'+o.front+'</div>');
  e.o=o;e.front=e.firstChild;e.style.rotate=(o.tilt||0)+'deg';
  if(o.full){e.classList.add('can');e.tabIndex=0;e.setAttribute('role','button');}return e;}
/* dealt: thrown from under his thumb, spinning a little, landing with weight and settling at its tilt */
function deal(e,delay){var r=rel(e),dx=195-(r.x+r.w/2),dy=844-r.y+30,t=(dx>0?-1:1)*(9+Math.random()*6);
  anim(e,[{transform:'translate('+dx+'px,'+dy+'px) rotate('+t+'deg) scale(.92)'},{transform:'none'}],{duration:860,easing:SETTLE,delay:delay,fill:'backwards'});
  anim(e,[{opacity:0},{opacity:1}],{duration:140,delay:delay,fill:'backwards'});
  anim(e.front,[{boxShadow:'0 40px 60px -14px #000, 0 10px 24px rgba(0,0,0,.7)'},{boxShadow:'0 40px 60px -14px #000, 0 10px 24px rgba(0,0,0,.7)',offset:.4},{boxShadow:'0 1px 2px rgba(0,0,0,.6), 0 12px 28px -10px rgba(0,0,0,.8)'}],{duration:860,delay:delay,fill:'backwards'});}

/* the answer arrives whole: the step line goes, the words ink in, the objects are dealt in one motion */
async function arrive(c,w,lead,make){var gone=[].slice.call(w.steps.children);
  gone.forEach(function(x){anim(x,[{opacity:1},{opacity:0,filter:'blur(4px)'}],{duration:180,fill:'forwards'});});
  await c.wait(180);w.steps.innerHTML='';
  w.lead.innerHTML=lead;ink(w.lead);var objs=make?make(w.table):[];
  objs.forEach(function(e,i){deal(e,140+i*120);});
  await c.wait(objs.length?520:260);c.edge.set('landed');}

/* ---------- pieces ---------- */
function dayCard(t){var a=D.asks.day.answer;
  var rows=function(full){return a.events.map(function(e){return '<div class="d-ev"><span class="d-at">'+e.at+'</span><div><b>'+e.t+'</b><small>'+(full?e.where:e.where.split(',')[0])+'</small></div></div>';}).join('');};
  return obj(t,{tilt:-.7,cls:'d-day',front:'<span class="d-meta">Today</span>'+rows()+tag(a.events[0]),full:'<h2>'+D.now.day+'</h2>'+rows(true)+tag(a.events[0])});}
function placeCard(t,p,tilt){var url='https://maps.apple.com/?q='+encodeURIComponent(p.address);
  return obj(t,{tilt:tilt,cls:'d-chip',front:'<a class="d-place" href="'+url+'" target="_blank" rel="noopener"><span class="d-pin">'+PIN+'</span><span><b>'+esc(p.name)+'</b><small>'+esc(p.address)+'</small></span></a>'});}
function waitingCard(t){var x=D.asks.day.answer.waiting;
  return obj(t,{tilt:-1.6,front:'<span class="d-meta">Waits on you</span><b class="d-title">'+x.who+', '+x.about+'</b><p class="d-msg">“'+esc(x.last)+'”</p><small>'+x.at+'</small><button type="button" class="d-pill wide" data-act="reply">Reply</button>',full:true});}
function payCard(t){var p=D.asks.day.answer.payment;
  return obj(t,{tilt:2.2,cls:'d-pay',front:'<small>'+p.t+'</small><span class="d-amount">'+p.amount+'</span><small>Due '+p.due+'</small>'+tag(p)});}
function dayObjects(t){var a=D.asks.day.answer,day=dayCard(t),pl=placeCard(t,a.place,1.1);pl.classList.add('d-under');
  var pair=h(t,'d-pair','');return [day,pl,waitingCard(pair),payCard(pair)];}
/* Jade: her face and her words, her ready draft under */
function jadeObjects(t){var a=D.asks.jade.answer;
  var front='<div class="d-who"><img class="d-face-img" alt="" src="'+a.who.face+'"><div><b>'+a.who.name+'</b><small>'+a.reply.app+', '+a.reply.at+'</small></div></div><p class="d-bubble">'+esc(a.reply.t)+'</p>'+tag(a.who,a.reply);
  var j=obj(t,{tilt:-.9,cls:'d-big',front:front,full:true});j.style.zIndex=2;
  return [j,cardsObj(t,[a.card])];}
/* the cards: the shell's, one per item, swiped sideways; Send is his one tap */
function cardsObj(t,items,label){var e=obj(t,{cls:'d-cards',front:label?'<span class="d-meta">'+label+'</span>':''});e.front.appendChild(CTX.cards(items));return e;}

/* ---------- his turn ---------- */
async function typed(c,w,text){await c.type(c.field.input,text);await c.wait(260);
  anim(c.field.send,[{transform:'scale(1)'},{transform:'scale(.86)'},{transform:'scale(1)'}],{duration:240});
  await typedLand(c,w,text);}
/* typed words fly from the field to his place, small */
async function typedLand(c,w,text){var from=rel(c.field.input);c.field.clear();
  var s=h(w.his,'',null,'span');s.textContent=text;var to=rel(s),k=16/13.5;
  anim(s,[{transform:'translate('+(from.x-to.x)+'px,'+(from.y+(from.h-to.h*k)/2-to.y)+'px) scale('+k+')',color:getComputedStyle(c.field.input).color},{transform:'none',color:getComputedStyle(s).color}],{duration:620,easing:SOFT});
  await c.wait(420);}
/* spoken: his words write in big as he says them (the field hears them too), then fly up into his place */
async function spoken(c,w,text){var words=text.split(' '),live=h(w,'d-live',''),prev=null;live.setAttribute('aria-live','polite');
  c.field.live(true);c.edge.set('listen');
  for(var i=0;i<words.length;i++){c.field.heard.textContent=words.slice(0,i+1).join(' ');if(prev)prev.classList.add('on');
    prev=h(live,'w',words[i]+' ','span');ink(prev);
    for(var j=0;j<6;j++){c.edge.level(.45+.55*Math.random());await c.wait(55);}}
  prev.classList.add('on');c.edge.level(1);await c.wait(300);c.field.live(false);c.field.heard.textContent='';c.edge.set('rest');
  var s=h(w.his,'',null,'span');s.textContent=text;var a=rel(live),b=rel(s);
  anim(live,[{transform:'none',opacity:1},{transform:'translateY('+(b.y-a.y)+'px) scale(.52)',opacity:0}],{duration:380,easing:OUT,fill:'forwards'});
  anim(s,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:420,easing:SOFT,delay:160,fill:'backwards'});
  await c.wait(420);live.remove();}
/* the table clears for a new turn: the old objects slide off the bottom, faster than they came */
async function clearTurn(c,w){[].slice.call(w.table.querySelectorAll('.d-obj')).forEach(function(e,i){var t=(i%2?1:-1)*(6+i*2);
    anim(e,[{transform:'none',opacity:1},{transform:'translateY(320px) rotate('+t+'deg)',opacity:0}],{duration:260,easing:OUT,delay:i*35,fill:'forwards'});});
  [w.his,w.lead].forEach(function(x){anim(x,[{opacity:1},{opacity:0,filter:'blur(6px)',transform:'translateY(-8px)'}],{duration:200,easing:OUT,fill:'forwards'});});
  await c.wait(380);w.table.innerHTML='';w.lead.innerHTML='';w.his.innerHTML='';
  [w.his,w.lead].forEach(function(x){x.getAnimations().forEach(function(a){a.cancel();});});}

/* ---------- Life works: Thinking…, then one quiet line replaced at each read; nothing on the table yet ---------- */
function thinking(c,w){c.edge.set('work');w.classList.add('lit');var line=h(w.steps,'d-step','Thinking…');ink(line);return line;}
async function work(c,w,a){var line=thinking(c,w),t=0,still=null;
  async function hold(ms){if(a.stillAfter&&!still&&t+ms>a.stillAfter){await c.wait(a.stillAfter-t);ms-=a.stillAfter-t;t=a.stillAfter;
      still=h(w.steps,'d-still',ring()+'<span>'+a.still+'</span>');ink(still);}
    await c.wait(ms);t+=ms;}
  await hold(a.first);for(var s of a.steps){line.textContent=s.t;ink(line);await hold(s.ms);}}
/* app v4's still ring: a ring that never spins, empty for a long turn */
function ring(){return '<svg class="pie" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="2.2"/></svg>';}
async function turn(c,a,how,make,lead){var w=begin(c);
  if(how==='voice')await spoken(c,w,a.ask);else if(how==='typed')await typed(c,w,a.ask);else h(w.his,'',null,'span').textContent=a.ask;
  await work(c,w,a);await arrive(c,w,lead!=null?lead:esc(a.answer.lead),make);return w;}

/* ---------- picking an object up; drag down (or tap outside) to put it back ---------- */
function lift(e){if(held||!e.o.full)return;
  var ph=CTX.phone,w=e.closest('.d-wrap'),from=rel(e);
  var scrim=h(ph,'d-scrim',''),L=h(ph,'d-lift','<button type="button" class="d-grab" aria-label="Put back"></button>'+(e.o.full===true?'<div class="d-big">'+e.front.innerHTML+'</div>':e.o.full));
  L.setAttribute('role','dialog');L.setAttribute('aria-modal','true');held={e:e,L:L,scrim:scrim,w:w,from:from};
  var to=rel(L),s=from.w/to.w,tilt=parseFloat(e.style.rotate)||0;
  anim(L,[{transform:'translate('+(from.x-to.x)+'px,'+(from.y-to.y)+'px) rotate('+tilt+'deg) scale('+s+')',opacity:.6},{transform:'none',opacity:1}],{duration:560,easing:SETTLE});
  e.classList.add('held');w.classList.add('lifted');
  scrim.onclick=putBack;L.querySelector('.d-grab').onclick=putBack;L.querySelector('.d-grab').focus({preventScroll:true});
  var y0=null,dy=0;
  L.addEventListener('pointerdown',function(ev){if(ev.target.closest('button:not(.d-grab),a'))return;y0=ev.clientY;dy=0;L.setPointerCapture(ev.pointerId);});
  L.addEventListener('pointermove',function(ev){if(y0==null)return;dy=Math.max(0,(ev.clientY-y0)/(ph.getBoundingClientRect().width/390));L.style.transform='translateY('+dy+'px) scale('+(1-dy/2400)+')';});
  L.addEventListener('pointerup',function(){if(y0==null)return;y0=null;if(dy>80){putBack();return;}
    var t=L.style.transform;L.style.transform='';if(dy>2)anim(L,[{transform:t},{transform:'none'}],{duration:420,easing:SETTLE});});}
function putBack(){if(!held)return;var x=held;held=null;var to=rel(x.L),now=x.L.style.transform||'none',f=x.from,tilt=parseFloat(x.e.style.rotate)||0;
  x.L.style.transform='';var a=anim(x.L,[{transform:now,opacity:1},{transform:'translate('+(f.x-to.x)+'px,'+(f.y-to.y)+'px) rotate('+tilt+'deg) scale('+f.w/to.w+')',opacity:.4}],{duration:300,easing:'cubic-bezier(.3,0,.2,1)',fill:'forwards'});
  x.w.classList.remove('lifted');x.scrim.remove();
  a.finished.then(function(){x.e.classList.remove('held');x.L.remove();x.e.focus({preventScroll:true});},function(){x.L.remove();});}
addEventListener('keydown',function(ev){if(ev.key==='Escape')putBack();if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('can')){ev.preventDefault();lift(ev.target);}});

/* taps on what lies on the table */
document.addEventListener('click',function(ev){if(ev.target.closest('a'))return;
  var b=ev.target.closest('[data-act="reply"]'),o=ev.target.closest('.d-obj'),c=CTX;
  if(!b){if(o)lift(o);return;}
  putBack();c.field.input.value='Tell Jade ';c.field.sync();c.field.input.focus();anim(c.field.el,[{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:320,easing:SOFT});});
/* ---------- the scenes ---------- */
function hi(w){return w.insertBefore(h(null,'d-hi','<b>Hi</b><small>'+D.now.day+'</small>'),w.table);}
Shell.mount({title:'Turn by turn v2: D, cards on the table',scenes:[
  {id:'idle',label:'Idle',run:function(c){ink(hi(begin(c)));}},
  {id:'home-waiting',label:'Opens with matters waiting',run:function(c){var w=begin(c);ink(hi(w));w.table.classList.add('edge-of');
    deal(cardsObj(w.table,D.waiting.slice(0,3),'Waiting on you'),300);}},
  {id:'waiting-list',label:'Waiting on you',run:function(c){var w=begin(c);h(w.his,'',null,'span').textContent=D.waitingAsk;w.classList.add('lit');
    return arrive(c,w,esc(D.waitingLead),function(t){return [cardsObj(t,D.waiting)];});}},
  {id:'pendant',label:'Pendant status',run:function(c){ink(hi(begin(c)));c.pendant();}},
  {id:'type-send',label:'He types an ask',run:async function(c){var w=begin(c);await typed(c,w,D.asks.day.ask);thinking(c,w);}},
  {id:'voice-send',label:'He holds to talk',run:async function(c){var w=begin(c);await spoken(c,w,D.asks.jade.ask);thinking(c,w);}},
  {id:'working',label:'Life works',run:function(c){return turn(c,D.asks.day,'shown',dayObjects);}},
  {id:'answer-day',label:'Answer: the day',run:function(c){return turn(c,D.asks.day,'typed',dayObjects);}},
  {id:'answer-jade',label:'Answer: Jade, with her draft',run:function(c){return turn(c,D.asks.jade,'voice',jadeObjects);}},
  {id:'tell',label:'Tell Ben: a draft on his words',run:function(c){var a=D.asks.tell;
    return turn(c,a,'typed',function(t){return [cardsObj(t,[a.answer.card])];});}},
  {id:'card-arrives',label:'A card arrives',run:async function(c){var w=begin(c),x=hi(w);ink(x);await c.wait(D.arrives.arriveMs);c.count(D.waiting.length+1);
    anim(x,[{opacity:1},{opacity:.45}],{duration:600,fill:'forwards'});
    var e=cardsObj(w.table,[D.arrives.card]);w.table.classList.add('edge-of');
    anim(e,[{transform:'translateY(110%)',opacity:0},{transform:'none',opacity:1}],{duration:900,easing:SOFT});}},
  {id:'slow',label:'A slow ask',run:function(c){var a=D.slow;return turn(c,a,'shown',function(t){return [placeCard(t,a.answer.place,-.8)];});}},
  {id:'failure',label:'A read fails',run:function(c){var a=D.failure;return turn(c,a,'shown',null,esc(a.error.t));}},
  {id:'history',label:'Earlier turns',run:function(c){var w=begin(c);w.table.classList.add('deck');
    D.history.forEach(function(x,i){var e=obj(w.table,{cls:'d-file',tilt:[-1.2,.9,-.4][i%3],front:'<span class="d-meta">'+x.at+'</span><p class="d-ask">'+esc(x.ask)+'</p><b>'+esc(x.answer)+'</b>'});e.style.zIndex=i+1;
      anim(e,[{transform:'translateY(-140px) rotate('+(i%2?6:-6)+'deg) scale(.94)',opacity:0},{transform:'none',opacity:1}],{duration:720,easing:SETTLE,delay:i*110,fill:'backwards'});});}},
  {id:'follow-up',label:'A follow-up',run:async function(c){var w=begin(c),a=D.followUp;h(w.his,'',null,'span').textContent=D.asks.day.ask;
    w.lead.textContent=D.asks.day.answer.lead;dayObjects(w.table);w.classList.add('lit');
    await c.wait(1500);await c.type(c.field.input,a.ask);await c.wait(200);await clearTurn(c,w);await typedLand(c,w,a.ask);
    await work(c,w,a);await arrive(c,w,esc(a.answer.lead));}},
  {id:'hey-life',label:'Hey Life, from the pendant',run:async function(c){var x=D.heyLife;c.lock();c.edge.set('still');
    await c.wait(x.heardMs);c.lock(x.heardAt);c.notify(x.heard);await c.wait(x.answerMs);
    await Promise.race([c.notify(x.done),c.wait(4000)]); /* his tap, or on its own for Play all */
    c.lock(false);c.edge.set('rest');var w=begin(c);w.his.innerHTML='<span>'+esc(x.ask)+'</span><small>To your pendant, '+x.heardAt+'</small>';w.classList.add('lit');
    await c.wait(250);await arrive(c,w,esc(x.answer.lead));}}]});
</script>
