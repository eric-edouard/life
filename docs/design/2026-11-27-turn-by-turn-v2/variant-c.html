<!doctype html>
<!-- Turn by turn v2, variation C "Face to face", on the real flow (2026-11-28-real-flow.md). While Life works: his words
     small at the top, and one quiet step line in the subtitle place, replaced at each read. The answer arrives whole at
     the end, then its sentences show one at a time at a quick reading pace (text only, Life never speaks), each bringing
     the thing it names above it. Earlier lines dim and drift up; a tap on one brings its thing back. Built on shell.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: C, face to face</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
/* the view: his question (top), the things (middle), Life's lines or its step line (subtitle place) */
.cv{position:absolute;inset:0;overflow:hidden}
.cq{position:absolute;top:10px;left:36px;right:36px;display:flex;justify-content:center;text-align:center;pointer-events:none}
.cq-t{font-size:var(--text-body);font-weight:600;line-height:1.35;color:color-mix(in srgb,var(--fg) 56%,transparent);text-wrap:balance}
.cd{position:absolute;top:46px;bottom:170px;left:20px;right:20px}
.cg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.cs,.ct,.clive-a{position:absolute;left:24px;right:24px;bottom:30px;height:0}
/* a line of the answer: its words settle in fast; earlier lines shrink, dim and drift up */
.cl{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:var(--text-profile);font-weight:650;line-height:1.2;letter-spacing:-.012em;text-wrap:balance;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.2,1,.3,1),opacity .5s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cl::before{content:'';position:absolute;inset:-24px -4px}
.cl:focus-visible{outline:none;text-decoration:underline;text-underline-offset:6px}
.cl .w{display:inline-block;opacity:0}
.cl.quiet{color:var(--muted);cursor:default}
.cl.gone{pointer-events:none}
/* his words while he speaks, in the subtitle place */
.clive{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:var(--text-profile);font-weight:650;line-height:1.2;letter-spacing:-.012em;text-wrap:balance}
.clive span{display:inline-block}
/* Life working: one quiet line, its shimmer the brand's thinking line; a second, fainter line on a long turn */
.ct-row{position:absolute;left:0;right:0;bottom:0;text-align:center}
.ct-t{display:inline-block;font-size:var(--text-title);font-weight:600;background:linear-gradient(100deg,var(--muted) 0 38%,var(--fg) 50%,var(--muted) 62% 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.ct-s{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:var(--text-line);color:var(--faint)}
/* the things */
.tile{position:relative;background:var(--tile);border-radius:var(--block-radius);padding:14px 16px}
.meta{font-size:var(--text-meta);color:var(--faint)}
.mut{font-size:var(--text-line);color:var(--muted)}
.ttl{font-size:var(--text-title);font-weight:650}
/* a proposed block, to be built: a quiet tag under it */
.nb{display:block;margin-top:6px;font-style:normal;font-size:var(--text-meta);font-weight:600;color:var(--faint);text-align:right}
.nb::before{content:'';display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;outline:1px dashed var(--faint);outline-offset:1px;vertical-align:1px}
.ctr .nb{text-align:center}
/* event rows (new block) */
.ev{display:grid;grid-template-columns:52px 1fr;column-gap:12px;row-gap:12px;align-items:baseline}
.ev b{font-size:var(--text-title);font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
/* a payment (new block) */
.pay{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pay .amt{font-size:var(--text-header);font-weight:650;font-variant-numeric:tabular-nums}
/* a place (existing): a tap opens Maps */
a.place{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
a.place svg{flex:none;color:var(--muted)}
a.place:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* a face (new block) and a quoted message (new block) */
.who{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.face{width:72px;height:72px;border-radius:50%;object-fit:cover}
.qt{align-self:flex-start;max-width:300px}
.bub{padding:12px 16px;border-radius:var(--block-radius);border-bottom-left-radius:6px;background:var(--tile);line-height:1.4}
.qt .meta{display:block;padding:6px 0 0 6px}
.qt .nb{text-align:left;padding-left:6px}
.wait-row{display:flex;gap:12px;align-items:flex-start}
/* the cards (the shell's) sit at the bottom of the things, above Life's lines */
.cg>.s-cards{--s-pad:20px}
.c-k{font-size:var(--text-line);font-weight:600;color:var(--muted);margin-bottom:-2px}
/* earlier turns, a quiet chronology */
.hist{position:absolute;left:28px;right:28px;bottom:30px;display:flex;flex-direction:column;gap:28px;text-align:center}
.hist .ha{font-size:var(--text-line);font-weight:600;color:var(--muted);margin-top:4px}
.hist .hl{font-size:var(--text-header);font-weight:650;line-height:1.25;margin-top:6px;text-wrap:balance}
.hist .old{opacity:.55}
/* while he speaks: bars move in the field, his words are up in the subtitle place */
.field.live .heard{color:transparent}
.vbars{display:none;position:absolute;left:20px;top:50%;margin-top:-9px;height:18px;gap:3px;align-items:center;pointer-events:none}
.field.live .vbars{display:flex}
.vbars i{width:3px;height:100%;border-radius:2px;background:var(--fg);animation:vb .5s ease-in-out infinite alternate}
.vbars i:nth-child(2){animation-delay:-.2s}.vbars i:nth-child(3){animation-delay:-.35s}.vbars i:nth-child(4){animation-delay:-.1s}.vbars i:nth-child(5){animation-delay:-.27s}
@keyframes vb{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.ghost{position:absolute;z-index:7;white-space:nowrap;font-size:16px;font-weight:600;pointer-events:none;transform-origin:50% 50%}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var SPRING='cubic-bezier(.22,1.25,.36,1)',GLIDE='cubic-bezier(.16,1,.3,1)',OUT='cubic-bezier(.55,0,.85,.35)';
var PIN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function anim(el,kf,dur,ease,delay){if(!el||!el.animate)return Promise.resolve();
  return el.animate(kf,{duration:reduce?0:dur,easing:ease||GLIDE,delay:reduce?0:(delay||0),fill:'both'}).finished.catch(function(){});}
function enter(el,delay,dy){return anim(el,[{opacity:0,transform:'translateY('+(dy||26)+'px) scale(.96)'},{opacity:1,transform:'none'}],760,SPRING,delay);}
function leave(el,dur){return anim(el,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-22px) scale(.97)'}],dur||220,OUT).then(function(){el.remove();});}
function scaleOf(c){return c.phone.getBoundingClientRect().width/c.phone.offsetWidth;}
/* the quiet tag on a proposed block */
function nb(p){return p.block==='new'?'<i class="nb">new block · '+esc(p.kind)+'</i>':'';}
/* an answer's words cut into its sentences (a colon inside a sentence stays) */
function sentences(t){return t.match(/[^.!?]+[.!?]+/g).map(function(s){return s.trim();});}

/* ---------- the view ---------- */
function view(c){var r=h('div','cv'),V={c:c,r:r,q:h('div','cq'),d:h('div','cd'),s:h('div','cs'),lines:[],cur:null,pace:1};
  r.append(V.q,V.d,V.s);c.stage.appendChild(r);return V;}
function setQ(V,text,show){V.q.innerHTML='';var q=h('div','cq-t',esc(text));V.q.appendChild(q);
  if(show)anim(q,[{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],500);else q.style.opacity=0;return q;}
/* the previous turn leaves upward, fast, before a new one */
function clearTurn(V){var all=[].slice.call(V.q.children).concat([].slice.call(V.d.children),V.lines.map(function(L){return L.el;}));
  all.forEach(function(e,i){e.style.transition='none';var cs=getComputedStyle(e);
    anim(e,[{opacity:cs.opacity,transform:cs.transform},{opacity:0,transform:'translateY(-40px)'}],240,OUT,i*18).then(function(){e.remove();});});
  V.lines=[];V.cur=null;}

/* ---------- his turn ---------- */
/* typed: the words lift out of the field, hold a beat in the subtitle place, then become the question above */
async function askTyped(V,text){var c=V.c;await c.type(c.field.input,text);await c.wait(320);
  var k=scaleOf(c),pr=c.phone.getBoundingClientRect(),ir=c.field.input.getBoundingClientRect();
  var g=h('div','ghost',esc(text));c.phone.appendChild(g);
  g.style.left=(ir.left-pr.left)/k+'px';g.style.top=((ir.top-pr.top)/k+ir.height/k/2-11)+'px';
  c.field.clear();if(V.lines.length||V.q.children.length)clearTurn(V);
  var q=setQ(V,text),gr=g.getBoundingClientRect(),sr=V.s.getBoundingClientRect(),qr=q.getBoundingClientRect();
  var gx=(gr.left+gr.width/2-pr.left)/k,gy=(gr.top+gr.height/2-pr.top)/k;
  var mx=(sr.left+sr.width/2-pr.left)/k-gx,my=(sr.top-pr.top)/k-26-gy,ms=Math.min(26/16,300/(gr.width/k));
  var qx=(qr.left+qr.width/2-pr.left)/k-gx,qy=(qr.top+qr.height/2-pr.top)/k-gy;
  var fly=anim(g,[{transform:'none',opacity:1},{transform:'translate('+mx+'px,'+my+'px) scale('+ms+')',opacity:1,offset:.38},
    {transform:'translate('+mx+'px,'+my+'px) scale('+ms+')',opacity:1,offset:.6},{transform:'translate('+qx+'px,'+qy+'px) scale('+(15/16)+')',opacity:1,offset:.97},
    {transform:'translate('+qx+'px,'+qy+'px) scale('+(15/16)+')',opacity:0}],reduce?0:1500,'cubic-bezier(.45,0,.2,1)');
  await c.wait(reduce?0:1350);anim(q,[{opacity:0},{opacity:1}],220);await fly;g.remove();}
/* held to talk: his words appear in the subtitle place as heard (mirrored from the field, below), then step up */
async function askVoice(V,text){var c=V.c;if(V.lines.length||V.q.children.length)clearTurn(V);
  live(c);await c.speak(text);var L=live(c);renderLive(L,text);await c.wait(380);
  var q=setQ(V,text),k=scaleOf(c),a=L.getBoundingClientRect(),b=q.getBoundingClientRect();
  var dx=(b.left+b.width/2-a.left-a.width/2)/k,dy=(b.top+b.height/2-a.top-a.height/2)/k;
  anim(L,[{transform:'none',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+(15/26)+')',opacity:0}],720,'cubic-bezier(.5,0,.2,1)');
  await c.wait(reduce?0:430);anim(q,[{opacity:0,transform:'translateY(14px) scale(1.25)'},{opacity:1,transform:'none'}],420,GLIDE);
  await c.wait(reduce?0:320);L.parentNode&&L.parentNode.remove();}
function live(c){var a=c.stage.querySelector('.clive-a');if(!a){a=h('div','clive-a','<div class="clive"></div>');(c.stage.querySelector('.cv')||c.stage).appendChild(a);}return a.firstChild;}
function renderLive(L,text){var words=text?text.split(' '):[],have=L.children.length;
  for(var i=have;i<words.length;i++){var s=h('span','',esc(words[i]));L.append(i?' ':'',s);anim(s,[{opacity:0,transform:'translateY(8px)',filter:'blur(4px)'},{opacity:1,transform:'none',filter:'blur(0)'}],420,GLIDE);}}

/* ---------- Life working: "Thinking…", then one step line replaced at each read; nothing of what it finds ---------- */
async function work(V,a,opts){var c=V.c;c.edge.set('work');var T=h('div','ct'),prev=null,t=0,still=null;V.r.appendChild(T);
  function line(text){var row=h('div','ct-row','<div class="ct-t">'+esc(text)+'</div>');if(prev)leave(prev,260);T.appendChild(row);
    anim(row,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],520,GLIDE,prev?120:0);prev=row;}
  async function hold(ms){if(a.stillAfter&&!still&&t+ms>a.stillAfter){var w=a.stillAfter-t;await c.wait(w);t+=w;ms-=w;
      still=h('div','ct-s',esc(a.still));T.appendChild(still);anim(still,[{opacity:0},{opacity:1}],900);}
    await c.wait(ms);t+=ms;}
  line('Thinking…');if(opts&&opts.stopAtThinking)return;await hold(a.first);
  for(var i=0;i<a.steps.length;i++){line(a.steps[i].t);await hold(a.steps[i].ms);}
  /* the answer is in: the line goes, the edge lands, a breath before the first sentence */
  leave(prev,220);if(still)leave(still,220);c.edge.set('landed');await c.wait(reduce?0:420);T.remove();}

/* ---------- the answer's lines ---------- */
function layout(V){var y=0,list=V.lines.slice().reverse(),keep=[];
  list.forEach(function(L,i){var s=i?.6:1,op=i===0?1:i===1?.36:i===2?.17:0;if(L.recalled&&i)op=.8;
    L.el.style.transform='translateY('+(-y)+'px) scale('+s+')';L.el.style.opacity=op;y+=L.el.offsetHeight*s+(i?4:12);
    if(op===0){L.el.classList.add('gone');var e=L.el;setTimeout(function(){e.remove();},900);}else keep.unshift(L);});
  V.lines=keep;}
/* one sentence: its words settle in quickly, its thing arrives with it, then it holds for a reading beat */
async function say(V,line){var c=V.c,words=line.t.split(' '),el=h('div','cl'+(line.quiet?' quiet':''),words.map(function(w){return '<span class="w">'+esc(w)+'</span>';}).join(' '));
  var rec={el:el,line:line};
  if(!line.quiet){el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',line.t);
    el.onclick=function(){recall(V,rec);};el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();recall(V,rec);}};}
  V.lines.forEach(function(L){L.recalled=false;});
  el.style.transform='translateY(30px)';el.style.opacity=0;V.s.appendChild(el);el.offsetHeight;V.lines.push(rec);layout(V);
  [].forEach.call(el.querySelectorAll('.w'),function(s,i){anim(s,[{opacity:0,transform:'translateY(6px)',filter:'blur(3px)'},{opacity:1,transform:'none',filter:'blur(0)'}],380,GLIDE,i*32*V.pace);});
  show(V,rec);
  await c.wait(reduce?0:Math.max(1300,520+words.length*200)*V.pace);}
async function tell(V,lines){for(var i=0;i<lines.length;i++)await say(V,lines[i]);}
/* a line's thing: a new group replaces the last one; a "then" line adds to the group in place */
function show(V,rec){var L=rec.line;
  if(L.then&&V.cur){L.then(V.cur.el);var base=V.cur.make;rec.make=function(){var e=base();L.then(e,true);return e;};return;}
  if(!L.props)return;rec.make=L.props;swap(V,L.props);}
function swap(V,make){var old=V.cur;if(old&&old.el.isConnected)leave(old.el,220);
  var el=make();el.classList.add('cg');V.cur={el:el,make:make};V.d.appendChild(el);
  [].forEach.call(el.children,function(ch,i){enter(ch,60+i*110);});}
function recall(V,rec){if(!rec.make)return;V.lines.forEach(function(L){L.recalled=L===rec;});layout(V);
  if(V.cur&&V.cur.make===rec.make&&V.cur.el.isConnected){anim(V.cur.el,[{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],420,GLIDE);return;}
  swap(V,rec.make);}

/* ---------- the things a line brings ---------- */
function group(html){return function(){return h('div','',html);};}
function eventsHTML(evs){return '<div><div class="tile ev">'+evs.map(function(e){return '<b>'+esc(e.at)+'</b><div><div class="ttl">'+esc(e.t)+'</div><div class="mut">'+esc(e.where)+'</div></div>';}).join('')+'</div>'+nb(evs[0])+'</div>';}
function placeHTML(p){return '<a class="tile place" href="https://maps.apple.com/?q='+encodeURIComponent(p.address)+'" target="_blank" rel="noopener">'+PIN+'<div><div class="ttl">'+esc(p.name)+'</div><div class="mut">'+esc(p.address)+'</div></div></a>';}
function payHTML(p){return '<div><div class="tile pay"><div><div class="ttl">'+esc(p.t)+'</div><div class="mut">Due '+esc(p.due)+'</div></div><div class="amt">'+esc(p.amount)+'</div></div>'+nb(p)+'</div>';}
function faceHTML(f){return '<div class="who ctr"><img class="face" alt="" src="'+f.face+'"><div class="ttl">'+esc(f.name)+'</div>'+nb(f)+'</div>';}
function quoteHTML(q){return '<div class="qt"><div class="bub">'+esc(q.t)+'</div><span class="meta">'+esc((q.who?q.who+', ':'')+q.at+' on '+q.app)+'</span>'+nb(q)+'</div>';}
/* the day's waiting item (an items block): who, what about, their last words */
function waitingHTML(w){return '<div class="tile"><div class="ttl">'+esc(w.who)+' waits on you: '+esc(w.about)+'</div><div class="mut" style="margin-top:4px">“'+esc(w.last)+'”</div><div class="meta" style="margin-top:6px">'+esc(w.at)+'</div></div>';}

/* the cards: the shell's, one per item, swiped sideways; the shell keeps what he did, so a recalled card stays as he left it */
function cardEl(c,items){return c.cards(items);}

/* ---------- each answer, as lines and the things they bring ---------- */
function dayLines(){var a=D.asks.day.answer,s=sentences(a.lead);return [
  {t:s[0],props:group(eventsHTML(a.events)+placeHTML(a.place)+payHTML(a.payment))},
  {t:s[1],props:group(waitingHTML(a.waiting))}];}
function jadeLines(c){var a=D.asks.jade.answer,s=sentences(a.lead);return [
  {t:s[0],props:group(faceHTML(a.who)+quoteHTML(a.reply))},
  /* her ready reply joins her words: the card carries her face, so the big face leaves to make room */
  {t:s[1],then:function(el,now){var f=el.querySelector('.who');if(f)f.remove();var k=cardEl(c,[a.card]);el.appendChild(k);if(!now)enter(k,80);}}];}
function tellLines(c){var a=D.asks.tell.answer;return [{t:a.lead,props:function(){var g=h('div','');g.appendChild(cardEl(c,[a.card]));return g;}}];}
function waitingLines(c){return [{t:D.waitingLead,props:function(){var g=h('div','');g.appendChild(cardEl(c,D.waiting));return g;}}];}
function plain(t,props){return sentences(t).map(function(s,i){return {t:s,props:i?null:props};});}

/* ---------- scenes ---------- */
function greet(V){return say(V,{t:'Good morning.',quiet:true});}
async function turn(V,a,lines,how){if(how==='voice')await askVoice(V,a.ask);else await askTyped(V,a.ask);await work(V,a);await tell(V,lines);}

Shell.mount({title:'Turn by turn v2: C, face to face',scenes:[
  {id:'idle',label:'Idle',run:async function(c){var V=view(c);await c.wait(500);await greet(V);}},
  {id:'home-waiting',label:'Opens with matters waiting',run:async function(c){var V=view(c);await c.wait(300);
    swap(V,function(){var g=h('div','','<div class="c-k">Waiting on you</div>');g.appendChild(cardEl(c,D.waiting.slice(0,3)));return g;});await greet(V);}},
  {id:'waiting-list',label:'Waiting on you',run:async function(c){var V=view(c);setQ(V,D.waitingAsk,true);c.edge.set('landed');await c.wait(300);await tell(V,waitingLines(c));}},
  {id:'pendant',label:'Pendant status',run:async function(c){var V=view(c);greet(V);c.pendant();}},
  {id:'type-send',label:'He types an ask',run:async function(c){var V=view(c);await askTyped(V,D.asks.day.ask);await work(V,D.asks.day,{stopAtThinking:true});}},
  {id:'voice-send',label:'He holds to talk',run:async function(c){var V=view(c);await askVoice(V,D.asks.jade.ask);await work(V,D.asks.jade,{stopAtThinking:true});}},
  {id:'working',label:'Life works',run:async function(c){var V=view(c);setQ(V,D.asks.day.ask,true);await c.wait(400);await work(V,D.asks.day);await tell(V,dayLines());}},
  {id:'answer-day',label:'Answer: the day',run:function(c){return turn(view(c),D.asks.day,dayLines());}},
  {id:'answer-jade',label:'Answer: Jade, with her draft',run:function(c){return turn(view(c),D.asks.jade,jadeLines(c),'voice');}},
  {id:'tell',label:'Tell Ben: a draft on his words',run:function(c){return turn(view(c),D.asks.tell,tellLines(c));}},
  {id:'card-arrives',label:'A card arrives',run:async function(c){var V=view(c);await greet(V);await c.wait(Math.max(0,D.arrives.arriveMs-1300));
    var g=h('div','cg');g.appendChild(cardEl(c,[D.arrives.card]));V.d.appendChild(g);
    anim(g,[{opacity:0,transform:'translateY(48px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],1100,GLIDE);}},
  {id:'slow',label:'A slow ask',run:function(c){var a=D.slow.answer;return turn(view(c),D.slow,plain(a.lead,group(placeHTML(a.place))));}},
  {id:'failure',label:'A read fails',run:function(c){return turn(view(c),D.failure,plain(D.failure.error.t));}},
  {id:'history',label:'Earlier turns',run:async function(c){var V=view(c),H=h('div','hist');V.r.appendChild(H);
    D.history.forEach(function(t,i){H.appendChild(h('div',i<D.history.length-1?'old':'','<div class="meta">'+esc(t.at)+'</div><div class="ha">'+esc(t.ask)+'</div><div class="hl">'+esc(t.answer)+'</div>'));});
    for(var i=H.children.length-1;i>=0;i--){anim(H.children[i],[{opacity:0,transform:'translateY(-36px)'},{opacity:getComputedStyle(H.children[i]).opacity,transform:'none'}],800,SPRING);await c.wait(140);}}},
  {id:'follow-up',label:'A follow-up',run:async function(c){var V=view(c);setQ(V,D.asks.day.ask,true);V.pace=.35;await tell(V,dayLines());V.pace=1;await c.wait(1500);
    await turn(V,D.followUp,plain(D.followUp.answer.lead));}},
  {id:'hey-life',label:'Hey Life, from the pendant',run:async function(c){var hl=D.heyLife;c.lock();c.edge.set('still');
    await c.wait(hl.heardMs);c.lock(hl.heardAt);c.notify(hl.heard);await c.wait(hl.answerMs);await Promise.race([c.notify(hl.done),c.wait(4000)]); /* his tap, or on its own for Play all */
    c.lock(false);c.edge.set('landed');var V=view(c);setQ(V,hl.ask,true);await c.wait(600);await tell(V,plain(hl.answer.lead));}}]});

/* after mount: mirror what the field hears into the subtitle place, and put moving bars in the field while he speaks */
(function(){var f=document.querySelector('.field'),heard=f.querySelector('.heard'),bars=h('span','vbars','<i></i><i></i><i></i><i></i><i></i>');
  bars.setAttribute('aria-hidden','true');f.appendChild(bars);
  new MutationObserver(function(){var t=heard.textContent;if(!t)return;var stage=document.querySelector('.stage'),L=live({stage:stage});
    if(L.textContent&&t.indexOf(L.textContent.replace(/\s+/g,' ').trim())!==0)L.innerHTML='';renderLive(L,t);}).observe(heard,{childList:true,characterData:true,subtree:true});})();
</script>
</body>
