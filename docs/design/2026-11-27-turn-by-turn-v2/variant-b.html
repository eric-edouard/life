<!doctype html>
<!-- Turn by turn v2, variant B "Living page", on the real flow (2026-11-28-real-flow.md): the answer is a page made for
     him. His words are its kicker; while Life works the page stays calm, one quiet step line under his words, replaced
     at each read. Nothing is known until the end: then the whole spread composes itself at once, the headline first and
     the blocks settling in reading order. Proposed blocks carry a quiet "new block" tag. Shared shell, edge and data. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: B, living page</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
.stage{-webkit-mask:linear-gradient(transparent,#000 14px,#000 calc(100% - 28px),transparent);mask:linear-gradient(transparent,#000 14px,#000 calc(100% - 28px),transparent)}
.pg{display:flex;flex-direction:column;padding:4px 0 48px}
.w{display:inline-block}
/* his words: the kicker. Big while he speaks, then it steps back so the page can speak */
.kick{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px;font-size:var(--text-line);font-weight:600;line-height:1.3;color:var(--muted);
  transition:font-size .35s cubic-bezier(.3,1.05,.4,1),color .35s,line-height .35s}
.kick .q{min-width:0}
.kick .at{flex:none;font-size:var(--text-meta);color:var(--faint);font-variant-numeric:tabular-nums;transition:opacity .3s}
.kick.live{font-size:var(--text-profile);font-weight:650;line-height:1.2;color:var(--fg)}
.kick.live .at{opacity:0}
.kick.live .w{color:var(--muted);animation:cream .5s .25s forwards}
@keyframes cream{to{color:var(--fg)}}
.b-mirror .field .heard{opacity:0}
.fly{position:absolute;z-index:7;white-space:nowrap;font-size:16px;font-weight:500;color:var(--fg);transform-origin:0 0;pointer-events:none}
/* while Life works: one quiet line under his words, replaced at each read; a breathing dot, never a count */
.now{display:flex;flex-direction:column;gap:6px;margin-top:22px;font-size:var(--text-line)}
.now .row{display:flex;align-items:center;gap:12px}
.breath{flex:none;width:8px;height:8px;border-radius:4px;background:var(--ai);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.st{position:relative;flex:1;height:22px}
.st .line{position:absolute;left:0;right:0;top:0;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.still{margin-left:20px;color:var(--faint)}
/* the answer: headline, then blocks in reading order, spaced, never boxed */
.lead-t{margin:18px 0 0;font-size:var(--text-profile);font-weight:650;line-height:1.2;letter-spacing:-.018em;text-wrap:balance}
.blk{position:relative;margin-top:34px}
.blk.tight{margin-top:14px}
/* a proposed block, not built yet: one quiet tag */
.nb{font-style:normal;position:absolute;right:0;top:-20px;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ai);opacity:.8;letter-spacing:.01em}
.nb::before{content:"";width:5px;height:5px;border-radius:3px;border:1px dashed var(--ai)}
/* new block, event: the day as a timeline */
.ev{display:grid;grid-template-columns:54px 1fr;column-gap:4px}
.ev .t{font-size:var(--text-title);font-weight:650;font-variant-numeric:tabular-nums;line-height:22px}
.ev .b{position:relative;padding:0 0 24px 24px}
.ev .b::before{content:"";position:absolute;left:4px;top:18px;bottom:-2px;width:2px;border-radius:1px;background:var(--tint);transform-origin:top;transform:scaleY(var(--rail,1));transition:transform .5s cubic-bezier(.3,1.05,.4,1)}
.ev:last-child .b::before{display:none}
.ev:last-child .b{padding-bottom:0}
.ev .b::after{content:"";position:absolute;left:0;top:6px;width:10px;height:10px;border-radius:5px;background:var(--faint)}
.ev.next .b::after{background:var(--fg)}
.ev h3{margin:0;font-size:var(--text-title);font-weight:650;line-height:22px}
.ev p{margin:2px 0 0;color:var(--muted);font-size:var(--text-line)}
/* existing block, place: a tap opens Maps */
.place{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:52px}
.place .pin{flex:none;width:40px;height:40px;border-radius:20px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.place h3{margin:0;font-size:var(--text-title);font-weight:650}
.place p{margin:1px 0 0;color:var(--muted);font-size:var(--text-line)}
.place .go{margin-left:auto;color:var(--muted);font-size:var(--text-line);font-weight:600}
/* a person, their words */
.who{display:flex;align-items:center;gap:12px}
.who img{width:44px;height:44px;border-radius:22px}
.who h3{margin:0;font-size:var(--text-title);font-weight:650}
.who p{margin:1px 0 0;color:var(--muted);font-size:var(--text-line)}
.quote{margin:12px 40px 0 0;padding:14px 16px;border-radius:6px 18px 18px 18px;background:var(--paper);font-size:var(--text-title);line-height:1.45}
.quote small{display:block;margin-top:6px;color:var(--faint);font-size:var(--text-meta)}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;margin-top:12px;border-radius:22px;background:var(--tint);font-size:var(--text-line);font-weight:650}
/* new block, payment */
.money{display:flex;align-items:center;gap:16px}
.amt{font-size:var(--text-profile);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.money h3{margin:0;font-size:var(--text-title);font-weight:650}
.money p{margin:1px 0 0;color:var(--muted);font-size:var(--text-line)}
/* idle, a card arriving, earlier turns */
.hi{margin:auto 0 0;font-size:var(--text-profile);font-weight:650}
.sugg{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:28px 0 8px}
.sugg .pill{margin:0;font-size:var(--text-body)}
.foot{margin-top:28px}
.hx{margin:28px 0 0;font-size:var(--text-heading);font-weight:600;color:var(--muted)}
.ht{margin-top:16px;display:flex;justify-content:space-between;gap:16px;font-size:var(--text-line);font-weight:600;color:var(--muted)}
.ht span:last-child{color:var(--faint);font-size:var(--text-meta);font-variant-numeric:tabular-nums}
.ha{margin:4px 0 0;font-size:var(--text-header);font-weight:650;line-height:1.3}
.old{opacity:.5}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA,R=matchMedia('(prefers-reduced-motion: reduce)').matches;
var IN='cubic-bezier(.2,1.15,.35,1)',OUT='cubic-bezier(.5,0,.9,.4)',SETTLE='cubic-bezier(.16,1,.3,1)';
var PIN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function h(tag,cls,html,parent){var e=document.createElement(tag);e.className=cls;e.innerHTML=html||'';if(parent)parent.appendChild(e);return e;}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
/* every motion: spring in, quick out; under Reduce Motion, a cross-fade only */
function A(el,frames,ms,ease,delay,keep){if(R)frames=frames.map(function(f){return{opacity:'opacity' in f?f.opacity:1};});
  return el.animate(frames,{duration:ms,easing:ease||IN,delay:delay||0,fill:keep===false?'none':'both'});}
function inkIn(el,delay){return A(el,[{opacity:0,transform:'translateY(8px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],420,IN,delay);}
function inkOut(el){return A(el,[{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'translateY(-10px)',filter:'blur(6px)'}],200,OUT);}
/* words ink in one after another; returns how long it takes */
function inkWords(el,text,step,delay){el.textContent='';var ws=text.split(' ');ws.forEach(function(w,i){if(i)el.appendChild(document.createTextNode(' '));inkIn(h('span','w',esc(w),el),(delay||0)+i*step);});
  return (delay||0)+ws.length*step+420;}
/* a block settles into place: from a little lower, soft, then sharp */
function settle(el,delay){return A(el,[{opacity:0,transform:'translateY(22px) scale(.985)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'blur(0)'}],620,SETTLE,delay);}
/* a tap's follow-up waits; a scene stopped meanwhile drops it quietly */
function quiet(p){return p.catch(function(){});}

/* ---- the page's parts ---- */
function page(c){return h('div','pg','',c.stage);}
function kicker(pg,text,at){var k=h('div','kick','<span class="q"></span><span class="at">'+(at||D.now.time)+'</span>',pg);k.querySelector('.q').textContent=text;return k;}
function tag(p){return p&&p.block==='new'?'<i class="nb">new block · '+p.kind+'</i>':'';}
function blk(cls,p,html){var b=h('section','blk '+(cls||''),tag(p)+html);return b;}

function timeline(evs){return blk('',evs[0],evs.map(function(e,i){return '<div class="ev'+(i?'':' next')+'"><div class="t">'+e.at+'</div><div class="b"><h3>'+esc(e.t)+'</h3><p>'+esc(e.where)+'</p></div></div>';}).join(''));}
function place(p,tight){return blk(tight?'tight':'',p,'<button type="button" class="place"><span class="pin">'+PIN+'</span><span><h3>'+esc(p.name)+'</h3><p>'+esc(p.address)+'</p></span><span class="go">Maps</span></button>');}
function waiting(w){return blk('',w,'<div class="who"><div><h3>'+w.who+' waits on you</h3><p>'+esc(w.about)+', '+w.at.toLowerCase()+'</p></div></div><div class="quote">'+esc(w.last)+'</div><button type="button" class="pill" data-go="answer-jade">Reply</button>');}
function payment(p){return blk('',p,'<div class="money"><div class="amt">'+p.amount+'</div><div><h3>'+esc(p.t)+'</h3><p>Due '+p.due+'</p></div></div>');}
function face(w,r){return blk('',w,'<div class="who"><img alt="" src="'+w.face+'"><div><h3>'+w.name+'</h3><p>'+r.app+', '+r.at+'</p></div></div>');}
function quote(q,who){return blk('tight',q,'<div class="quote" style="margin-top:0">'+esc(q.t)+(who?'<small>'+who+', '+q.app+', '+q.at+'</small>':'')+'</div>');}

/* the cards: the shell's, one per item, swiped sideways, as one block of the page */
function cards(c,items,label){var b=blk('',null,label?'<p class="hx" style="margin:0 0 12px">'+label+'</p>':'');b.appendChild(c.cards(items));return b;}

/* ---- his turn ---- */
/* typed: the words leave the field and land as the page's kicker; the page before leaves upward */
async function typed(c,a){await c.type(c.field.input,a.ask);await c.wait(250);
  var pr=c.phone.getBoundingClientRect(),s=pr.width/c.phone.offsetWidth,ir=c.field.input.getBoundingClientRect();
  var fly=h('div','fly','',c.phone);fly.textContent=a.ask;fly.style.left=(ir.left-pr.left)/s+'px';fly.style.top=(ir.top-pr.top)/s+(ir.height/s-22)/2+'px';c.field.clear();
  var old=c.stage.querySelector('.pg');
  if(old){A(old,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-32px) scale(.97)'}],220,OUT);await c.wait(220);old.remove();}
  var pg=page(c),k=kicker(pg,a.ask);k.style.opacity=0;
  var q=k.querySelector('.q').getBoundingClientRect(),fr=fly.getBoundingClientRect();
  A(fly,[{transform:'none',color:'var(--fg)'},{transform:'translate('+(q.left-fr.left)/s+'px,'+(q.top-fr.top)/s+'px) scale('+(13.5/16)+')',color:'var(--muted)'}],R?1:560,IN);
  await c.wait(R?1:560);k.style.opacity=1;fly.remove();return pg;}
/* spoken in the app: the words arrive large at the top as he says them, then step back into the kicker */
async function spoken(c,a){var pg=page(c),k=kicker(pg,''),q=k.querySelector('.q'),n=0;k.classList.add('live');c.phone.classList.add('b-mirror');
  var mo=new MutationObserver(function(){var ws=c.field.heard.textContent.split(' ').filter(Boolean);
    for(;n<ws.length;n++){if(n)q.appendChild(document.createTextNode(' '));inkIn(h('span','w',esc(ws[n]),q));}});
  mo.observe(c.field.heard,{childList:true,characterData:true,subtree:true});
  try{await c.speak(a.ask);}finally{mo.disconnect();c.phone.classList.remove('b-mirror');}
  k.classList.remove('live');await c.wait(380);return pg;}
function ask(c,a){return a.how==='voice'?spoken(c,a):typed(c,a);}

/* ---- Life works: Thinking…, then one step line replaced at each read; nothing else moves ---- */
function say(st,text){st.querySelectorAll('.line').forEach(function(o){inkOut(o).onfinish=function(){o.remove();};});var l=h('div','line','',st);l.textContent=text;inkIn(l,80);}
function waitLine(c,pg){c.edge.set('work');var now=h('div','now','<div class="row"><i class="breath"></i><div class="st" aria-live="polite"></div></div>',pg);
  inkIn(now);say(now.querySelector('.st'),'Thinking…');return now;}
async function work(c,pg,a){var now=waitLine(c,pg),st=now.querySelector('.st'),t=0,still=null;
  async function hold(ms){if(a.stillAfter&&!still&&t+ms>a.stillAfter){await c.wait(a.stillAfter-t);ms-=a.stillAfter-t;t=a.stillAfter;
      still=h('div','still','',now);still.textContent=a.still;inkIn(still);}
    await c.wait(ms);t+=ms;}
  await hold(a.first);for(var s of a.steps){say(st,s.t);await hold(s.ms);}
  return now;}

/* ---- the arrival: the line goes, the headline inks in, the blocks settle in reading order (~1.3 s) ---- */
async function compose(c,pg,now,text,blocks){
  if(now){A(now,[{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(6px)'}],220,OUT);await c.wait(220);now.remove();}
  c.edge.set('landed');var lead=h('h2','lead-t','',pg),words=text.split(' ').length,step=Math.min(45,520/words);
  inkWords(lead,text,step);var at=Math.min(520,words*step)+80;
  blocks.forEach(function(b,i){pg.appendChild(b);settle(b,at+i*150);
    b.querySelectorAll('.ev').forEach(function(ev,j){ev.style.setProperty('--rail',0);A(ev,[{opacity:0,transform:'translateX(-6px)'},{opacity:1,transform:'none'}],420,SETTLE,at+i*150+120+j*110);
      quiet(c.wait(at+i*150+260+j*110)).then(function(){ev.style.setProperty('--rail',1);});});});
  await c.wait(at+blocks.length*150+620);}

async function turn(c,a,text,blocks){var pg=await ask(c,a),now=await work(c,pg,a);await compose(c,pg,now,text,blocks(c));return pg;}

/* ---- the answers ---- */
function dayBlocks(){var a=D.asks.day.answer;return [timeline(a.events),place(a.place,true),waiting(a.waiting),payment(a.payment)];}
function jadeBlocks(c){var a=D.asks.jade.answer;return [face(a.who,a.reply),quote(a.reply),cards(c,[a.card])];}
function dayPage(c){var pg=page(c),a=D.asks.day.answer;kicker(pg,D.asks.day.ask);h('h2','lead-t',esc(a.lead),pg);dayBlocks().forEach(function(b){pg.appendChild(b);});return pg;}

/* a tap on an inline action that has a scene plays it */
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-go]');if(b)Shell.run(b.dataset.go);});
function clean(c){c.phone.querySelectorAll('.fly').forEach(function(e){e.remove();});c.phone.classList.remove('b-mirror');}
function scene(id,label,fn){return {id:id,label:label,run:function(c){clean(c);return fn(c);}};}
function idle(c,waiting){var pg=page(c);pg.style.minHeight='100%';inkIn(kicker(pg,D.now.day));var hi=h('h2','hi','',pg);inkWords(hi,'Hi',0,200);
  if(waiting){var w=cards(c,D.waiting.slice(0,3),'Waiting on you');pg.appendChild(w);settle(w,300);return pg;}
  var sg=h('div','sugg','',pg);[[D.asks.day.ask,'answer-day'],[D.asks.jade.ask,'answer-jade']].forEach(function(x,i){var b=h('button','pill','',sg);b.type='button';b.textContent=x[0];b.dataset.go=x[1];
    A(b,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],420,IN,300+i*90);});return pg;}

Shell.mount({title:'Turn by turn v2: B, living page',scenes:[
  scene('idle','Idle',function(c){idle(c);}),
  scene('home-waiting','Opens with matters waiting',function(c){idle(c,true);}),
  scene('waiting-list','Waiting on you',function(c){var pg=page(c);inkIn(kicker(pg,D.waitingAsk));return compose(c,pg,null,D.waitingLead,[cards(c,D.waiting)]);}),
  scene('pendant','Pendant status',function(c){idle(c);c.pendant();}),
  scene('type-send','He types an ask',async function(c){waitLine(c,await typed(c,D.asks.day));}),
  scene('voice-send','He holds to talk',async function(c){waitLine(c,await spoken(c,D.asks.jade));}),
  scene('working','Life works',async function(c){var pg=page(c);inkIn(kicker(pg,D.asks.day.ask));await work(c,pg,D.asks.day);}),
  scene('answer-day','Answer: the day',function(c){return turn(c,D.asks.day,D.asks.day.answer.lead,dayBlocks);}),
  scene('answer-jade','Answer: Jade, with her draft',function(c){return turn(c,D.asks.jade,D.asks.jade.answer.lead,jadeBlocks);}),
  scene('tell','Tell Ben: a draft on his words',function(c){var a=D.asks.tell;return turn(c,a,a.answer.lead,function(c){return [cards(c,[a.answer.card])];});}),
  scene('card-arrives','A card arrives',async function(c){var pg=idle(c);await c.wait(D.arrives.arriveMs);var f=h('div','foot','',pg);
    f.appendChild(cards(c,[D.arrives.card]));
    A(f,[{opacity:0,transform:'translateY(60px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],700,SETTLE);
    c.stage.scrollTo({top:c.stage.scrollHeight,behavior:R?'auto':'smooth'});}),
  scene('slow','A slow ask',function(c){var a=D.slow;return turn(c,a,a.answer.lead,function(){return [place(a.answer.place)];});}),
  scene('failure','A read fails',function(c){return turn(c,D.failure,D.failure.error.t,function(){return [];});}),
  scene('history','Earlier turns',function(c){var pg=page(c),last='',items=[];pg.style.cssText='min-height:100%;justify-content:flex-end';
    D.history.forEach(function(x,i){var day=x.at.split(' ')[0],time=x.at.split(' ')[1];if(day!==last){items.push(h('p','hx',day,pg));last=day;}
      var t=h('div','ht'+(i<D.history.length-1?' old':''),'<span></span><span>'+time+'</span>',pg);t.firstChild.textContent=x.ask;
      var an=h('p','ha'+(i<D.history.length-1?' old':''),'',pg);an.textContent=x.answer;items.push(t,an);});
    c.stage.scrollTop=c.stage.scrollHeight;
    items.reverse().forEach(function(e,i){A(e,[{opacity:0,transform:'translateY(-12px)'},{opacity:e.classList.contains('old')?.5:1,transform:'none'}],420,IN,i*60);});}),
  scene('follow-up','A follow-up',async function(c){dayPage(c);await c.wait(1500);var a=D.followUp;await turn(c,a,a.answer.lead,function(){return [];});}),
  scene('hey-life','Hey Life, from the pendant',async function(c){var hl=D.heyLife;c.lock();c.edge.set('still');
    await c.wait(hl.heardMs);c.lock(hl.heardAt);c.notify(hl.heard);await c.wait(hl.answerMs);
    await Promise.race([c.notify(hl.done),c.wait(4000)]); /* his tap, or on its own for Play all */
    c.lock(false);c.edge.set('rest');var pg=page(c);inkIn(kicker(pg,hl.ask,hl.heardAt));await compose(c,pg,null,hl.answer.lead,[]);})]});
</script>
</body>
</html>
