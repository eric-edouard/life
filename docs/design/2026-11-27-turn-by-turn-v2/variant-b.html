<!doctype html>
<!-- Turn by turn v2, variant B "Living page": the answer is a page composed live for him. His words are its kicker;
     while Life works, the page's skeleton stands and each block fills with real data the moment its step ends; the
     headline lands last, once everything under it is known. Shared shell, edge and data; only the stage is designed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v2: B, living page</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="edge.css">
<link rel="stylesheet" href="shell.css">
<style>
.stage{-webkit-mask:linear-gradient(transparent,#000 14px,#000 calc(100% - 28px),transparent);mask:linear-gradient(transparent,#000 14px,#000 calc(100% - 28px),transparent)}
.pg{display:flex;flex-direction:column;padding:4px 0 48px}
.w{display:inline-block}
/* his words: the kicker. Big while he speaks, then it steps back so the page can speak */
.kick{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px;font-size:var(--text-line);font-weight:600;line-height:1.3;color:var(--muted);
  transition:font-size .35s cubic-bezier(.3,1.05,.4,1),color .35s,line-height .35s}
.kick .q{min-width:0}
.kick .at{flex:none;font-size:var(--text-meta);color:var(--faint);font-variant-numeric:tabular-nums;transition:opacity .3s}
.kick.live{font-size:var(--text-profile);font-weight:650;line-height:1.2;color:var(--fg)}
.kick.live .at{opacity:0}
.kick.live .w{color:var(--muted);animation:cream .5s .25s forwards}
@keyframes cream{to{color:var(--fg)}}
.b-mirror .field .heard{opacity:0}
.fly{position:absolute;z-index:7;white-space:nowrap;font-size:16px;font-weight:500;color:var(--fg);transform-origin:0 0;pointer-events:none}
/* what Life is doing now: one line, a ring that fills at each finished step */
.now{display:flex;align-items:flex-start;gap:10px;margin-top:18px;font-size:var(--text-line)}
.ring{flex:none;width:18px;height:18px;margin-top:2px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2;stroke:var(--tint)}
.ring .p{stroke:var(--fg);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .45s cubic-bezier(.3,1.05,.4,1)}
.st{position:relative;flex:1;min-height:22px}
.st .line{position:absolute;left:0;right:0;top:0;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{color:var(--muted)}.st b{font-weight:650}
.st .sub{position:absolute;left:0;top:24px;color:var(--faint)}
.mini{width:18px;height:18px;border-radius:9px;vertical-align:-4px;margin-right:4px}
/* the page's blocks: a ghost first, then the data */
.slot{position:relative;margin-top:36px}
.slot.s-lead{margin-top:14px}
.slot.s-quote{margin-top:12px}
.ghost{display:flex;flex-direction:column;gap:10px}
.bar{height:12px;border-radius:6px;background:var(--wash)}
.bar.big{height:22px;border-radius:8px}
.dot{flex:none;width:44px;height:44px;border-radius:22px;background:var(--wash)}
.gr{display:flex;align-items:center;gap:14px}
.gr .bar{flex:1}
.slot.on .bar,.slot.on .dot{background:linear-gradient(90deg,var(--wash) 20%,var(--tint) 50%,var(--wash) 80%);background-size:250% 100%;animation:sheen 1.5s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
/* the headline: one sentence, the largest type Life has */
.lead-t{margin:0;font-size:var(--text-profile);font-weight:650;line-height:1.2;letter-spacing:-.018em;text-wrap:balance}
.lead-t.fail::before{content:"";display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--flag);margin-right:10px;vertical-align:3px}
/* the day: a timeline */
.ev{display:grid;grid-template-columns:54px 1fr;column-gap:4px}
.ev .t{font-size:var(--text-title);font-weight:650;font-variant-numeric:tabular-nums;line-height:22px}
.ev .b{position:relative;padding:0 0 26px 24px}
.ev .b::before{content:"";position:absolute;left:4px;top:18px;bottom:-2px;width:2px;border-radius:1px;background:var(--tint);transform-origin:top;animation:draw .6s .15s cubic-bezier(.3,1.05,.4,1) backwards}
.ev:last-child .b::before{display:none}
.ev:last-child .b{padding-bottom:0}
.ev .b::after{content:"";position:absolute;left:0;top:6px;width:10px;height:10px;border-radius:5px;background:var(--faint)}
.ev.next .b::after{background:var(--fg)}
@keyframes draw{from{transform:scaleY(0)}}
.ev h3{margin:0;font-size:var(--text-title);font-weight:650;line-height:22px}
.ev p{margin:2px 0 0;color:var(--muted);font-size:var(--text-line)}
.ev .due{color:var(--flag);font-weight:600}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;margin-top:10px;border-radius:22px;background:var(--tint);font-size:var(--text-line);font-weight:650}
/* a person, their words */
.who{display:flex;align-items:center;gap:12px}
.who img{width:44px;height:44px;border-radius:22px}
.who h3{margin:0;font-size:var(--text-title);font-weight:650}
.who p{margin:1px 0 0;color:var(--muted);font-size:var(--text-line)}
.quote{margin:12px 40px 0 0;padding:14px 16px;border-radius:6px 18px 18px 18px;background:var(--paper);font-size:var(--text-title);line-height:1.45}
.draft{margin:0 0 0 40px;padding:14px 16px;border-radius:18px 18px 6px 18px;background:var(--paper);font-size:var(--text-title);line-height:1.45;border:1.5px dashed color-mix(in srgb,var(--fg) 38%,transparent);transition:border-color .6s}
.draft.sent{border-color:transparent}
.send{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:26px;background:var(--fg);color:var(--on);font-size:var(--text-title);font-weight:650;transition:background-color .3s,color .3s}
.send.busy{background:var(--tint);color:var(--muted)}
.send.done{background:transparent;color:var(--ok);cursor:default}
/* money, weather, a place */
.money{display:flex;align-items:center;gap:16px}
.amt{font-size:var(--text-profile);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.money h3{margin:0;font-size:var(--text-title);font-weight:650}
.money p{margin:1px 0 0;color:var(--muted);font-size:var(--text-line)}
.wx{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:var(--text-line);line-height:1.45}
.wx svg{flex:none;margin-top:1px}
.place h3{margin:0;font-size:var(--text-header);font-weight:650}
.place p{margin:3px 0 0;color:var(--muted);font-size:var(--text-line)}
/* idle and earlier turns */
.hi{margin:auto 0 0;font-size:var(--text-profile);font-weight:650}
.sugg{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:28px 0 24px}
.sugg .pill{margin:0;font-size:var(--text-body)}
.hx{margin:28px 0 0;font-size:var(--text-heading);font-weight:600;color:var(--muted)}
.ht{margin-top:16px;display:flex;justify-content:space-between;gap:16px;font-size:var(--text-line);font-weight:600;color:var(--muted)}
.ht span:last-child{color:var(--faint);font-size:var(--text-meta);font-variant-numeric:tabular-nums}
.ha{margin:4px 0 0;font-size:var(--text-header);font-weight:650;line-height:1.3}
.old{opacity:.5}
</style>
</head>
<body>
<script src="edge.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
var D=DATA,R=matchMedia('(prefers-reduced-motion: reduce)').matches;
var IN='cubic-bezier(.2,1.15,.35,1)',OUT='cubic-bezier(.5,0,.9,.4)',MOVE='cubic-bezier(.3,1.05,.4,1)';
var FACE=D.asks.jade.answer.who.face;
var SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

function h(tag,cls,html,parent){var e=document.createElement(tag);e.className=cls;e.innerHTML=html||'';if(parent)parent.appendChild(e);return e;}
/* every motion: spring in, quick out; under Reduce Motion, a cross-fade only */
function A(el,frames,ms,ease,delay,keep){if(R)frames=frames.map(function(f){return{opacity:'opacity' in f?f.opacity:1};});
  return el.animate(frames,{duration:ms,easing:ease||IN,delay:delay||0,fill:keep===false?'none':'both'});}
function inkIn(el,delay){return A(el,[{opacity:0,transform:'translateY(8px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],420,IN,delay);}
function inkOut(el){return A(el,[{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'translateY(-10px)',filter:'blur(6px)'}],200,OUT);}
/* words ink in one after another; returns how long it takes */
function inkWords(el,text,step){el.textContent='';text.split(' ').forEach(function(w,i){if(i)el.appendChild(document.createTextNode(' '));inkIn(h('span','w',w,el),i*step);});
  return text.split(' ').length*step+420;}

/* ghosts: the page's structure before its data, one per kind of block */
var G={lead:'<div class="bar big" style="width:94%"></div><div class="bar big" style="width:58%"></div>',
  tl:[1,2,3].map(function(i){return '<div class="gr"><div class="bar" style="flex:none;width:40px"></div><div class="bar" style="flex:none;width:'+(150-i*24)+'px"></div></div><div class="bar" style="margin-left:54px;width:'+(170-i*20)+'px;height:9px"></div>';}).join(''),
  chat:'<div class="gr"><div class="dot"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="bar" style="width:60%"></div><div class="bar" style="width:38%;height:9px"></div></div></div><div class="bar big" style="height:58px;border-radius:18px;margin-right:40px"></div>',
  who:'<div class="gr"><div class="dot"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="bar" style="width:40%"></div><div class="bar" style="width:30%;height:9px"></div></div></div>',
  quote:'<div class="bar big" style="height:72px;border-radius:18px;margin-right:40px"></div>',
  draft:'<div class="bar big" style="height:52px;border-radius:18px;margin-left:40px"></div><div class="bar big" style="height:52px;border-radius:26px"></div>',
  money:'<div class="gr"><div class="bar big" style="flex:none;width:64px;height:30px"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="bar" style="width:46%"></div><div class="bar" style="width:30%;height:9px"></div></div></div>',
  wx:'<div class="bar" style="width:84%"></div>',
  ev:'<div class="gr"><div class="bar" style="flex:none;width:40px"></div><div class="bar" style="flex:none;width:150px"></div></div>',
  place:'<div class="bar big" style="width:62%"></div><div class="bar" style="width:74%"></div>',
  route:'<div class="gr"><div class="bar" style="flex:none;width:40px"></div><div class="bar" style="flex:none;width:110px"></div></div><div class="bar" style="margin-left:54px;width:190px;height:9px"></div><div class="gr"><div class="bar" style="flex:none;width:40px"></div><div class="bar" style="flex:none;width:130px"></div></div>',
  bank:'<div class="gr"><div class="bar big" style="flex:none;width:90px;height:30px"></div><div class="bar" style="width:40%"></div></div>'};

/* the data, as it lands in each block (.k parts ink in one by one) */
function evHTML(e,next){return '<div class="ev k'+(next?' next':'')+'"><div class="t">'+e.at+'</div><div class="b"><h3>'+e.t+'</h3><p>'+e.where+'</p>'+
  (e.leave?'<p class="due">'+e.leave+'</p><button type="button" class="pill">Directions</button>':'')+'</div></div>';}
function tlHTML(evs){return evs.map(function(e,i){return evHTML(e,!i);}).join('');}
function chatHTML(){var w=D.asks.day.answer.waiting;
  return '<div class="who k"><img alt="" src="'+FACE+'"><div><h3>'+w.who+' waits on you</h3><p>'+w.about+', '+w.at.toLowerCase()+'</p></div></div>'+
    '<div class="quote k">'+w.last+'</div><button type="button" class="pill k" data-go="answer-jade">Reply</button>';}
function moneyHTML(){var p=D.asks.day.answer.payment;return '<div class="money k"><div class="amt">'+p.amount+'</div><div><h3>'+p.t+'</h3><p>Due '+p.due+'</p></div></div>';}
function wxHTML(){return '<div class="wx k">'+SUN+'<span>'+D.asks.day.answer.weather+'</span></div>';}

function page(c){return h('div','pg','',c.stage);}
function kicker(pg,text){var k=h('div','kick','<span class="q"></span><span class="at">'+D.now.time+'</span>',pg);k.querySelector('.q').textContent=text;return k;}
function slots(pg,kinds){var o={};kinds.forEach(function(k){o[k]=h('div','slot s-'+k,'<div class="ghost">'+G[k]+'</div>',pg);});return o;}
function clean(c){c.phone.querySelectorAll('.fly').forEach(function(e){e.remove();});c.phone.classList.remove('b-mirror');}

/* his typed turn: the words leave the field and land as the page's kicker; the page before leaves upward */
async function typed(c,a){await c.type(c.field.input,a.ask);await c.wait(250);
  var pr=c.phone.getBoundingClientRect(),s=pr.width/c.phone.offsetWidth,ir=c.field.input.getBoundingClientRect();
  var fly=h('div','fly','',c.phone);fly.textContent=a.ask;fly.style.left=(ir.left-pr.left)/s+'px';fly.style.top=(ir.top-pr.top)/s+(ir.height/s-22)/2+'px';c.field.clear();
  var old=c.stage.querySelector('.pg');
  if(old){A(old,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-32px) scale(.97)'}],220,OUT);await c.wait(220);old.remove();}
  var pg=page(c),k=kicker(pg,a.ask);k.style.opacity=0;
  var q=k.querySelector('.q').getBoundingClientRect(),fr=fly.getBoundingClientRect();
  A(fly,[{transform:'none',color:'var(--fg)'},{transform:'translate('+(q.left-fr.left)/s+'px,'+(q.top-fr.top)/s+'px) scale('+(13.5/16)+')',color:'var(--muted)'}],R?1:560,IN);
  await c.wait(R?1:560);k.style.opacity=1;fly.remove();return pg;}

/* his spoken turn: the words arrive large at the top as he says them, then step back into the kicker */
async function spoken(c,a){var pg=page(c),k=kicker(pg,''),q=k.querySelector('.q'),n=0;k.classList.add('live');c.phone.classList.add('b-mirror');
  var mo=new MutationObserver(function(){var ws=c.field.heard.textContent.split(' ').filter(Boolean);
    for(;n<ws.length;n++){if(n)q.appendChild(document.createTextNode(' '));inkIn(h('span','w',ws[n],q));}});
  mo.observe(c.field.heard,{childList:true,characterData:true,subtree:true});
  try{await c.speak(a.ask);}finally{mo.disconnect();c.phone.classList.remove('b-mirror');}
  k.classList.remove('live');await c.wait(380);return pg;}

/* Life's working line: verb quiet, what it acts on bright, a face when it is someone */
function stepHTML(t){var m=/^(\S+(?: at)?) (.*)$/.exec(t);
  return '<span class="v">'+m[1]+'</span> '+(/Jade/.test(t)?'<img class="mini" alt="" src="'+FACE+'">':'')+'<b>'+m[2]+'</b>';}
function say(st,html){st.querySelectorAll('.line').forEach(function(o){inkOut(o);o.classList.add('gone');});
  st.querySelectorAll('.gone').forEach(function(o,i,all){if(all.length>1&&i<all.length-1)o.remove();});inkIn(h('div','line',html,st),80);}
/* the camera follows the block being filled */
function follow(c,slot){var top=slot.offsetTop,bottom=top+slot.offsetHeight+24,v=c.stage;
  if(bottom>v.scrollTop+v.clientHeight)v.scrollTo({top:bottom-v.clientHeight,behavior:R?'auto':'smooth'});}

/* a block's data replaces its ghost: the ghost dissolves, the block grows to fit, the data inks in */
async function fill(c,slot,html){var h0=slot.offsetHeight,g=slot.querySelector('.ghost');slot.classList.remove('on');
  g.style.cssText='position:absolute;left:0;right:0;top:0';var real=h('div','real',html,slot),h1=real.offsetHeight;
  slot.style.overflow='hidden';A(slot,[{height:h0+'px'},{height:h1+'px'}],340,MOVE,0,false);A(g,[{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(5px)'}],200,OUT);
  var parts=real.querySelectorAll('.k');parts.forEach(function(p,i){inkIn(p,60+i*90);});
  await c.wait(Math.max(360,60+parts.length*90));slot.style.overflow='';g.remove();}

/* the steps: each names what Life does, lights its block, and fills it when done; false if one fails */
async function work(c,pg,a,plan){c.edge.set('work');var now=pg.querySelector('.now'),st=now.querySelector('.st'),p=now.querySelector('.p');
  for(var i=0;i<a.steps.length;i++){var s=a.steps[i],slot=plan[i]&&plan[i][0];say(st,stepHTML(s.t));
    if(slot){slot.classList.add('on');follow(c,slot);}
    if(s.slow){await c.wait(5000);inkIn(h('div','sub',s.d,st));now.animate([{marginBottom:'0'},{marginBottom:'24px'}],{duration:R?1:300,easing:MOVE,fill:'forwards'});await c.wait(s.ms-5000);}
    else await c.wait(s.ms);
    if(s.fails)return false;
    p.style.strokeDashoffset=1-(i+1)/a.steps.length;
    if(slot)await fill(c,slot,plan[i][1]);}
  return true;}

/* the end of work: the line leaves, the camera returns to the top, the headline lands */
async function land(c,pg,slot,text,fail){var now=pg.querySelector('.now');
  if(now){A(now,[{opacity:1,filter:'blur(0)',height:now.offsetHeight+'px',marginTop:'18px'},{opacity:0,filter:'blur(6px)',height:'0px',marginTop:'0px'}],260,OUT);}
  c.stage.scrollTo({top:0,behavior:R?'auto':'smooth'});await c.wait(260);if(now)now.remove();
  await fill(c,slot,'<h2 class="lead-t'+(fail?' fail':'')+'"></h2>');var ms=inkWords(slot.querySelector('.lead-t'),text,60);
  c.edge.set(fail?'rest':'landed');await c.wait(ms);}

/* the page stands: status line and ghosts rise in under the kicker */
async function frame(c,pg,kinds){h('div','now','<svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><circle class="p" cx="10" cy="10" r="8" pathLength="1"/></svg><div class="st" aria-live="polite"></div>',pg);
  var s=slots(pg,kinds);kinds.forEach(function(k,i){A(s[k],[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420,IN,i*70);});
  c.edge.set('work');await c.wait(200);return s;}

async function dayFlow(c,pg){var a=D.asks.day,s=await frame(c,pg,['lead','tl','chat','money','wx']);
  await work(c,pg,a,[[s.tl,tlHTML(a.answer.events)],[s.chat,chatHTML()],[s.money,moneyHTML()],[s.wx,wxHTML()]]);
  await land(c,pg,s.lead,a.answer.lead);}

async function jadeFlow(c,pg){var a=D.asks.jade,b=a.answer,s=await frame(c,pg,['lead','who','quote','draft']);
  await work(c,pg,a,[[s.who,'<div class="who k"><img alt="" src="'+b.who.face+'"><div><h3>'+b.who.name+'</h3><p>'+b.reply.app+', '+b.reply.at+'</p></div></div>'],
    [s.quote,'<div class="quote k" style="margin-top:0">'+b.reply.t+'</div>'],
    [s.draft,'<div class="draft k"></div><button type="button" class="send k" style="margin-top:14px">'+b.send+'</button>']]);
  var d=s.draft.querySelector('.draft');await c.wait(inkWords(d,b.draft,70));
  var btn=s.draft.querySelector('.send');btn.onclick=async function(){if(btn.disabled)return;btn.disabled=true;btn.classList.add('busy');btn.textContent='Sending';
    await c.wait(700);d.classList.add('sent');btn.classList.remove('busy');btn.classList.add('done');btn.textContent='';inkWords(h('span','',null,btn),b.sent,40);};
  await land(c,pg,s.lead,b.lead);}

async function followFlow(c,pg){var a=D.followUp,e=D.asks.day.answer.events[0],s=await frame(c,pg,['lead','route']);
  await work(c,pg,a,[[s.route,evHTML({at:'9:55',t:'Leave',where:'18 min by bike, the long way: the bridge is closed'},true)+evHTML({at:e.at,t:e.t,where:e.where})]]);
  await land(c,pg,s.lead,a.answer.lead);}

async function slowFlow(c,pg){var a=D.slow,e=D.asks.day.answer.events[2],s=await frame(c,pg,['lead','ev','place']);
  await work(c,pg,a,[[s.ev,evHTML({at:e.at,t:e.t,where:'With Ben'},true)],
    [s.place,'<div class="place k"><h3>8 Rue Vauban</h3><p>Third floor, Ben meets you downstairs</p></div><button type="button" class="pill k">Directions</button>']]);
  await land(c,pg,s.lead,a.answer.lead);}

async function failFlow(c,pg){var a=D.failure,s=await frame(c,pg,['lead','money','bank']);
  var ok=await work(c,pg,a,[[s.money,moneyHTML()],[s.bank,'']]);
  if(!ok){c.edge.set('rest');s.bank.classList.remove('on');A(s.bank,[{opacity:1,height:s.bank.offsetHeight+'px',marginTop:'36px'},{opacity:0,height:'0px',marginTop:'0px'}],240,OUT);
    await c.wait(240);s.bank.remove();await land(c,pg,s.lead,a.error.t,true);}}

/* the day's page, already there (for the follow-up) */
function staticDay(c){var pg=page(c),a=D.asks.day.answer;kicker(pg,D.asks.day.ask);
  h('div','slot s-lead','<h2 class="lead-t">'+a.lead+'</h2>',pg);[tlHTML(a.events),chatHTML(),moneyHTML(),wxHTML()].forEach(function(x){h('div','slot',x,pg);});
  A(pg,[{opacity:0},{opacity:1}],350);return pg;}

/* a tap on an inline action that has a scene plays it */
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-go]');if(b)Shell.run(b.dataset.go);});

function scene(id,label,fn){return {id:id,label:label,run:function(c){clean(c);return fn(c);}};}
Shell.mount({title:'Turn by turn v2: B, living page',scenes:[
  scene('idle','Idle',async function(c){var pg=page(c);pg.style.minHeight='100%';var k=kicker(pg,D.now.day);inkIn(k);
    var hi=h('h2','hi','',pg);await c.wait(200);inkWords(hi,'Hi',0);var sg=h('div','sugg','',pg);
    [[D.asks.day.ask,'answer-day'],[D.asks.jade.ask,'answer-jade']].forEach(function(x,i){var b=h('button','pill','',sg);b.type='button';b.textContent=x[0];b.dataset.go=x[1];
      A(b,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],420,IN,300+i*90);});}),
  scene('type-send','He types an ask',async function(c){var pg=await typed(c,D.asks.day),s=await frame(c,pg,['lead','tl','chat','money','wx']);
    say(pg.querySelector('.st'),stepHTML(D.asks.day.steps[0].t));s.tl.classList.add('on');}),
  scene('voice-send','He says an ask',async function(c){var pg=await spoken(c,D.asks.jade),s=await frame(c,pg,['lead','who','quote','draft']);
    say(pg.querySelector('.st'),stepHTML(D.asks.jade.steps[0].t));s.who.classList.add('on');}),
  scene('working','Life works',async function(c){var pg=page(c);inkIn(kicker(pg,D.asks.day.ask));await dayFlow(c,pg);}),
  scene('slow','A slow step',async function(c){var pg=page(c);inkIn(kicker(pg,D.slow.ask));await slowFlow(c,pg);}),
  scene('answer-day','Answer: the day',async function(c){await dayFlow(c,await typed(c,D.asks.day));}),
  scene('answer-jade','Answer: Jade (voice)',async function(c){await jadeFlow(c,await spoken(c,D.asks.jade));}),
  scene('follow-up','A follow-up',async function(c){staticDay(c);c.edge.set('rest');await c.wait(1500);await followFlow(c,await typed(c,D.followUp));}),
  scene('history','Earlier turns',async function(c){var pg=page(c),last='',items=[];pg.style.cssText='min-height:100%;justify-content:flex-end';
    D.history.forEach(function(x,i){var day=x.at.split(' ')[0],time=x.at.split(' ')[1];if(day!==last){items.push(h('p','hx',day,pg));last=day;}
      var t=h('div','ht'+(i<D.history.length-1?' old':''),'<span></span><span>'+time+'</span>',pg);t.firstChild.textContent=x.ask;
      var an=h('p','ha'+(i<D.history.length-1?' old':''),'',pg);an.textContent=x.answer;items.push(t,an);});
    c.stage.scrollTop=c.stage.scrollHeight;
    items.reverse().forEach(function(e,i){A(e,[{opacity:0,transform:'translateY(-12px)'},{opacity:e.classList.contains('old')?.5:1,transform:'none'}],420,IN,i*60);});}),
  scene('failure','A step fails',async function(c){var pg=page(c);inkIn(kicker(pg,D.failure.ask));await failFlow(c,pg);})]});
</script>
</body>
</html>
