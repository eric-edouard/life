<!doctype html>
<!-- Mini projects, composed: a one-off project from the ask to done (the flow of .plan/mini-projects/map.md), drawn only
     from a fixed set of general components that any project fills with data (philosophy, "How a design is done":
     composed, never bespoke; the owner's yes of 28 Nov 2026). Every scene plays on two very different projects, a photo
     library cleanup and a child's party invites: switch them in the side panel (or #ex=party). A screen that only works for
     one of them is bespoke, and wrong. The components and the data each gets (scene 0 shows them with their shapes):
       status line   {doing, eta, done}              the agent's `doing` and `eta` (AgentNow, its under-way item)
       checklist     {steps[{text, why, state: done|missing|refused, mustHave}]}   an `access` need, worked out live
       question      {q, examples[thumb|text], choices[], pick, multi}            a card's ask (card-request.ts, needs.ts)
       preview link  {title, line, cover[thumb|text], versions}                  waits on the artifact system
       plan          {steps[text], done (how many), time, cost{est, cap}, budget{cap, spent, room}}, Build it; it waits
                     for room when room < cost.est
       batch list    {t, why, count, sample[thumb|text], undo, restore}; or drafts[] (Decision.drafts, each a StoredDraft:
                     chat, app, text, editable) with one "Send all"
       result        {done[], before, after, where, undo, cost}                  waits on the artifact system
     Reused from App v4 (card-blocks.js, the turn by turn v3 shell): the row and its unfolding, the still ring, the check,
     the chat with its draft, Life's pick, the one cream answer and its pills. Parts marked "new component" are proposals.
     A thumb stands for an image Life read (here drawn); every name, place and number is made up. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini projects</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<link rel="stylesheet" href="../2026-11-28-turn-by-turn-v3/edge.css">
<link rel="stylesheet" href="../2026-11-28-turn-by-turn-v3/shell.css">
<style>
@keyframes rise{from{opacity:0;transform:translateY(6px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.stage>*{flex:none}
.m-sp{margin-top:auto!important}
.m-me{align-self:flex-end;max-width:300px;margin-top:14px;padding:9px 14px;border-radius:20px;background:var(--tint);font-weight:600;animation:rise .3s ease-out}
.m-bt{margin-top:14px;font-size:15.5px;line-height:1.45;animation:rise .4s ease-out}
.m-bt b{font-weight:650}
.m-step{margin-top:14px;display:flex;align-items:center;gap:9px;color:var(--muted);animation:rise .3s ease-out}
.m-step b{color:var(--fg);font-weight:600}
.m-spin{width:14px;height:14px;border-radius:7px;border:1.8px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
/* a row (App v4's): a disc, the title, one line; unfolded: the same header larger, its body */
.m-item{margin-top:12px;animation:rise .35s ease-out}
.m-row{display:flex;align-items:center;gap:14px;cursor:pointer}
.m-row .m-tx{flex:1;min-width:0}
.m-row b{display:block;font-size:var(--text-title);font-weight:650;line-height:1.3}
.m-row small,.m-hl{display:block;font-size:var(--text-line);color:var(--muted);line-height:1.35}
.m-row small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-disc{width:44px;height:44px;border-radius:22px;background:var(--glass);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:16px;flex:none}
.m-disc svg{width:20px;height:20px}
.is-earlier,.is-dropped,.is-parked{opacity:.45}.is-done .m-row,.is-dropped .m-row,.is-parked .m-row,.is-earlier .m-row{cursor:default}
i.m-due{font-style:normal;color:var(--flag)}
.m-ok{color:var(--ok);font-weight:600}
.m-l .pie{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.m-q{display:block;transition:opacity .25s,filter .25s}.m-q.out{opacity:0;filter:blur(4px)}
.m-ip{position:relative;margin:14px -20px 4px;padding:10px 20px 14px;background:radial-gradient(farthest-side at 35% 40%,var(--wash),transparent)}
.m-ip>*:not(.m-fold){animation:rise .38s ease-out both}
.m-hero{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-right:40px}
.m-hero .m-disc{width:48px;height:48px;border-radius:24px}
.m-ht{font-size:var(--text-header);font-weight:650;line-height:1.2;letter-spacing:-.01em}
.m-hl{margin-top:3px;font-size:14px}
.m-fold{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:16px;background:var(--tint);color:var(--muted);display:flex;align-items:center;justify-content:center}
.m-why{margin:0 0 12px;font-size:14.5px;line-height:1.45;color:color-mix(in srgb,var(--fg) 74%,transparent)}
.m-sec{margin:14px 0 6px;font-size:var(--text-heading);font-weight:600;color:var(--muted)}
.m-box{position:relative;background:var(--tile);border-radius:var(--block-radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m-kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.m-kv span{color:var(--muted);flex:none}.m-kv b{font-weight:600;text-align:right}
.m-foot{margin-top:12px;font-size:13px;line-height:1.4;color:var(--muted)}
.m-new{position:absolute;top:-8px;right:10px;padding:1px 7px;border-radius:8px;background:var(--bg);font-style:normal;font-size:10.5px;font-weight:650;color:var(--flag);z-index:1}
.m-goal{font-size:15px;line-height:1.45}
.m-goal small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
/* answers: one cream button saying what it does, quiet equal pills under it */
.m-ans{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.m-prim{height:50px;border-radius:25px;background:var(--fg);color:var(--on);font-weight:650;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s}
.m-prim.busy{background:var(--tint);color:var(--fg)}
.m-prim.okd{background:var(--ok);color:var(--on)}
.m-two{display:flex;gap:8px}
.m-pill{flex:1;height:44px;border-radius:22px;background:var(--tint);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.m-two.quiet{margin-top:14px}
.m-box .m-pill{flex:none}
/* steps (the checklist and the plan): App v4's check, ticked by Life when it sees the step done */
.m-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.m-steps li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4;transition:color .4s}
.m-steps li.ok{color:var(--muted)}
.m-steps li.no>.cb-box{box-shadow:inset 0 0 0 1.8px var(--flag)}
.m-steps li small{display:block;font-size:13px;color:var(--muted)}
.m-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;background:var(--tint);font-size:11.5px;font-weight:650;color:var(--muted);vertical-align:1px}
.m-tag.need{color:var(--fg)}
/* a thumb: an image Life read, drawn here (a scene, a screen, a page, a card); or a line of text in a tile */
.m-th{display:flex;gap:6px;flex-wrap:wrap}
.m-pic{width:54px;height:54px;border-radius:10px;flex:none;position:relative;overflow:hidden;display:block}
.m-pic.bl{filter:blur(2px) brightness(.7)}
.m-pic.gone{opacity:.35}
.m-pic.kept::after{content:'✓';position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:8px;background:var(--ok);color:var(--on);font-size:10px;font-weight:650;display:flex;align-items:center;justify-content:center}
.m-txt{padding:7px 10px;border-radius:10px;background:var(--tint);font-size:13px;line-height:1.35;max-width:100%}
/* the question: its examples, then its choices as round pills; Life's pick in blue */
.m-qn{padding:14px 0;display:flex;flex-direction:column;gap:9px}
.m-qn+.m-qn{padding-top:4px}
.m-qn>b{font-size:15.5px;font-weight:650}
.m-vals{display:flex;gap:6px;flex-wrap:wrap}
.m-val{min-height:36px;padding:0 14px;border-radius:18px;background:var(--tint);font-size:14px;font-weight:600;transition:background .2s,color .2s}
.m-val[aria-pressed="true"]{background:var(--fg);color:var(--on)}
.m-val.other{color:var(--muted)}
.m-pick{font-size:12px;font-weight:650;color:var(--ai)}
/* the preview link: its cover, a mark that it is a preview, where it opens; its versions under it */
.m-pv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:var(--block-radius);background:var(--tile);position:relative}
.m-cover{flex:none;width:92px;height:92px;border-radius:12px;background:var(--bg);padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;overflow:hidden}
.m-cover .m-pic{width:37px;height:37px;border-radius:6px}
.m-cover .m-txt{padding:3px 5px;border-radius:5px;font-size:8.5px;line-height:1.25}
.m-pv b{display:block;font-size:15.5px;font-weight:650}
.m-pv small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.m-pv .m-open{margin-top:6px;font-size:13.5px;font-weight:650}
.m-vers{display:flex;gap:6px;margin-top:8px;align-items:center}
.m-vers span{font-size:12.5px;color:var(--muted);margin-right:2px}
.m-vers button{width:30px;height:30px;border-radius:15px;background:var(--tint);font-size:13px;font-weight:650}
.m-vers button[aria-pressed="true"]{background:var(--fg);color:var(--on)}
/* the result: before and after side by side */
.m-ba{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-ba>div{background:var(--tile);border-radius:var(--block-radius);padding:12px;display:flex;flex-direction:column;gap:6px}
.m-ba small{font-size:12px;color:var(--muted);font-weight:600}
.m-ba b{font-size:15px;font-weight:650;line-height:1.3}
.m-lk{align-self:flex-start;font-size:13.5px;font-weight:650;color:var(--fg);text-decoration:none;opacity:.85}
/* many drafts: each App v4's chat with its draft, the draft editable; marked sent one by one */
.m-drafts{display:flex;flex-direction:column;gap:18px;max-height:360px;overflow-y:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.m-dr .cb-cd{outline:none}
.m-dr .cb-cd:focus{box-shadow:inset 0 0 0 1.5px rgba(var(--app),.9)}
.m-dr .m-st{display:block;text-align:right;font-size:12px;font-weight:650;color:var(--ok);opacity:0;transition:opacity .3s;margin-top:4px}
.m-dr.sent .m-st{opacity:1}
/* scene 0: each component, its shape under it */
.m-cat{margin-top:22px}
.m-cat>h3{margin:0 0 8px;font-size:var(--text-heading);font-weight:650}
.m-shape{margin-top:8px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:pre-wrap}
.m-src{margin-top:4px;font-size:12px;color:var(--muted)}
/* the example switch, atop the side panel */
.m-ex{display:flex;gap:6px;margin-bottom:8px}
.side .m-ex button{flex:1;text-align:center;padding:8px 10px}
</style>
</head>
<body>
<script src="../2026-11-28-turn-by-turn-v3/edge.js"></script>
<script src="../2026-11-28-turn-by-turn-v3/data.js"></script>
<script src="../2026-11-23-chat-first/2026-11-26-design-lab/card-blocks.js" charset="utf-8"></script>
<script>document.head.insertAdjacentHTML("beforeend","<style>"+CB.css.cards+"</style>");</script>
<script src="../2026-11-28-turn-by-turn-v3/shell.js"></script>
<script>
DATA.waiting=[];
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var esc=CB.esc;
var I={
  photos:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/>',
  mac:'<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/>',
  cake:'<path d="M4 20h16v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2Z"/><path d="M4 16c2 1.4 4 1.4 6 0s4-1.4 6 0 3 1 4 .4"/><path d="M12 12V8"/><path d="M12 6c-.9-.9-.9-2 0-3 .9 1 .9 2.1 0 3Z"/>',
  party:'<path d="M12 3c3.3 0 6 2.6 6 6 0 3.9-3.4 7-6 7s-6-3.1-6-7c0-3.4 2.7-6 6-6Z"/><path d="m11 16-1 2h4l-1-2"/><path d="M12 18c0 2-2 2-2 4"/>',
  notes:'<path d="M7 3h7l5 5v13H7Z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>'};
function icon(k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[k]+'</svg>';}
function isNew(){return '<i class="m-new">new component</i>';}

/* ===== the components: each takes its data and nothing else; no project's name or kind is known here ===== */
var SKY=[['#86c5f0','#e3c48f'],['#f2ad5b','#a3345e'],['#6cd0c4','#126e66'],['#a7cf96','#3f6b35'],['#c59bf0','#33468f'],['#ee8fb1','#f2ad5b'],['#e3c48f','#7a5a24'],['#9aa8ec','#1f5f8b']];
/* a thumb: {img: kind, n, mark} stands for an image Life read (drawn here); {text} is a line in a tile */
function thumb(t){if(t.text!=null)return '<span class="m-txt">'+esc(t.text)+'</span>';
  var s=SKY[(t.n||0)%SKY.length],bg;
  if(t.img==='screen')bg='repeating-linear-gradient(180deg,#2a2b31 0 4px,#1a1b1f 4px 9px)';
  else if(t.img==='paper')bg='repeating-linear-gradient(180deg,#e9e2d2 0 3px,#cfc7b5 3px 4px,#e9e2d2 4px 8px)';
  else if(t.img==='page')bg='linear-gradient(180deg,'+s[0]+' 0 34%,#f4efe4 34% 42%,#d9d2c2 42% 46%,#f4efe4 46% 54%,#d9d2c2 54% 58%,#f4efe4 58%)';
  else bg='radial-gradient(circle at '+(55+(t.n||0)*7%30)+'% 30%,rgba(255,248,234,.85) 0 9%,transparent 10%),linear-gradient(170deg,'+s[0]+','+s[1]+' 62%,rgba(0,0,0,.5) 63%)';
  return '<i class="m-pic'+(t.mark?' '+t.mark:'')+'" style="background:'+bg+'"></i>';}
function thumbs(list){return '<div class="m-th">'+list.map(thumb).join('')+'</div>';}

/* status line {doing, eta, done 0..1}: App v4's row line with its still ring */
function statusLine(s){return CB.ring(s.done||0)+esc(s.doing)+(s.eta?' · '+esc(s.eta):'');}

/* steps, shared by the checklist and the plan: App v4's check, then the text and its line */
function stepsList(rows){return '<ol class="m-steps">'+rows.map(function(r){return '<li class="'+(r.ok?'ok':r.no?'no':'')+'">'+CB.check(r.ok)+'<span>'+r.html+'</span></li>';}).join('')+'</ol>';}

/* checklist {steps[{text, why, state, mustHave}]}: each ticks itself once Life sees it done (new component) */
function checklist(c){return '<div class="m-box">'+isNew()+stepsList(c.steps.map(function(s){
  return {ok:s.state==='done',no:s.state==='refused',html:esc(s.text)+'<span class="m-tag'+(s.mustHave?' need':'')+'">'+(s.mustHave?'needed':'helps')+'</span><small>'+esc(s.state==='refused'?'You said no: I go on another way':s.why)+'</small>'};}))+'</div>';}

/* question {q, examples[], choices[], pick, multi}: its examples, then its choices, Life's pick marked (new component: the examples) */
function question(x,i){var at=x.at==null?(x.multi?x.choices.map(function(_,j){return j===x.pick;}):x.pick):x.at;
  var on=function(j){return x.multi?!!at[j]:j===at;};
  return '<div class="m-qn"><b>'+esc(x.q)+'</b>'+(x.examples&&x.examples.length?thumbs(x.examples):'')+'<div class="m-vals">'+x.choices.map(function(v,j){
    return '<button type="button" class="m-val" data-q="'+i+'" data-v="'+j+'" aria-pressed="'+on(j)+'">'+esc(v)+'</button>';}).join('')+
    (x.multi?'':'<button type="button" class="m-val other" data-other="'+i+'">Other…</button>')+'</div>'+
    (!x.multi&&at===x.pick?'<span class="m-pick">Life’s pick</span>':x.multi?'<span class="m-pick">Life’s ideas, picked for you</span>':'')+'</div>';}
function questions(list){return '<div class="m-box" style="padding-top:2px;padding-bottom:4px">'+isNew()+list.map(question).join('')+'</div>';}
function wireQuestions(list){return function(e,c){e.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){var x=list[+b.dataset.q],j=+b.dataset.v;
    if(x.multi){if(x.at==null)x.at=x.choices.map(function(_,k){return k===x.pick;});x.at[j]=!x.at[j];}else x.at=j;paint(c,e);};});
  e.querySelectorAll('[data-other]').forEach(function(b){b.onclick=function(){c.field.input.value=list[+b.dataset.other].q+': ';c.field.sync();c.field.input.focus();};});};}
function resetQuestions(list){list.forEach(function(x){delete x.at;});}

/* preview link {title, line, cover[], versions}: opens Life's page of it (waits on the artifact system) (new component) */
function preview(p,v){v=v||1;return '<button type="button" class="m-pv" data-open-preview>'+isNew()+'<span class="m-cover">'+p.cover.map(thumb).join('')+'</span><span><b>'+esc(p.title)+'</b><small>'+esc(v>1&&p.changed?p.changed:p.line)+'</small><span class="m-open">Open the preview ↗</span></span></button>'+
  (v>1?'<div class="m-vers"><span>Versions</span>'+Array.from({length:v},function(_,i){return '<button type="button" aria-pressed="'+(i+1===v)+'">'+(i+1)+'</button>';}).join('')+'</div>':'');}
function wirePreview(e){var b=e.querySelector('[data-open-preview]');if(b)b.onclick=function(){b.querySelector('.m-open').textContent='Opens the preview page (artifact system, not designed here) ↗';};}

/* plan {steps[text], done, time, cost{est, cap}, budget{cap, spent, room}}: the plan he builds with one tap (new component) */
function plan(p,now){return '<div class="m-box">'+isNew()+stepsList(p.steps.map(function(s,i){return {ok:now!=null&&i<now,html:esc(s)};}))+
  (p.time?'<div class="m-kv" style="margin-top:6px"><span>Time</span><b>'+esc(p.time)+'</b></div>':'')+
  '<div class="m-kv"><span>Cost</span><b>About '+eur(p.cost.est)+' · I stop at '+eur(p.cost.cap)+' and ask</b></div>'+
  '<div class="m-kv"><span>This month</span><b>'+eur(p.budget.room)+' left of your '+eur(p.budget.cap)+'</b></div></div>';}
function eur(n){return String(Number.isInteger(n)?n:n.toFixed(2)).replace('.',',')+' €';}

/* batch {t, why, count, sample[], undo, restore}: one yes for many changes (new component) */
function batch(b){return '<div class="m-box">'+isNew()+thumbs(b.sample)+
  '<div class="m-kv"><span>How many</span><b>'+esc(b.count)+'</b></div>'+
  (b.undo?'<div class="m-kv"><span>Undo</span><b>'+esc(b.undo)+'</b></div>':'')+
  '<div class="m-kv"><span>Restore point</span><b>'+esc(b.restore)+'</b></div></div>';}

/* drafts[] {to, app, text}: App v4's chat with its draft, each editable, one Send all (new component: many in one card) */
function drafts(list,ed){return '<div class="m-box">'+isNew()+'<div class="m-drafts">'+list.map(function(d,i){
  return '<div class="m-dr">'+CB.chat({to:d.to,app:d.app,chat:d.chat||[],draft:(ed||{})[i]||d.text})+'<span class="m-st">Sent</span></div>';}).join('')+'</div></div>';}
function wireDrafts(e){var o=e._o;e.querySelectorAll('.m-dr .cb-cd').forEach(function(b,i){b.contentEditable='true';b.spellcheck=false;b.oninput=function(){(o.ed=o.ed||{})[i]=b.textContent;};});}

/* result {done[], before, after, where, undo, cost}: what changed, where it is, how to undo it (waits on the artifact system) (new component) */
function result(r){return '<div class="m-ba">'+isNew()+'<div><small>Before</small><b>'+esc(r.before.line)+'</b>'+(r.before.sample?thumbs(r.before.sample):'')+'</div>'+
  '<div><small>After</small><b>'+esc(r.after.line)+'</b>'+(r.after.sample?thumbs(r.after.sample):'')+'</div></div>'+
  '<div class="m-sec">What I did</div>'+stepsList(r.done.map(function(t){return {ok:true,html:esc(t)};}))+
  '<div class="m-sec">Where it is</div><div class="m-box"><span>'+esc(r.where.text)+'</span><a class="m-lk" href="#" onclick="return false">'+esc(r.where.open)+' ↗</a></div>'+
  (r.undo?'<div class="m-sec">Undo</div><div class="m-box"><span>'+esc(r.undo)+'</span><button type="button" class="m-pill" data-undo>Put everything back</button></div>':'')+
  '<div class="m-sec">Cost</div><div class="m-box"><div class="m-kv"><span>Spent</span><b>'+esc(r.cost)+'</b></div></div>';}

/* ===== the two projects, as data only ===== */
var EX={
 photos:{icon:'photos',name:'Photo library cleanup',goal:'Clean up my photo library, it’s a mess',asked:'You asked, Tue',
  look:'your photo library',bigger:'That’s a bigger job. I’m on it, and I’ll come back within the hour if I need anything from you.',
  status:[{doing:'Counting your photos',eta:'about 40 min',done:.1},{doing:'Checking your iCloud',eta:'about 25 min',done:.3},{doing:'Checking your Mac',eta:'about 15 min',done:.5}],

/* ===== the thread: App v4's pieces, unchanged by which project plays ===== */
var cur=null,lastCtx=null;
function add(c,e){c.stage.appendChild(e);if(!c.cancelled())c.stage.scrollTo({top:c.stage.scrollHeight,behavior:reduce?'auto':'smooth'});return e;}
function el(cls,html,tag){var e=document.createElement(tag||'div');e.className=cls;e.innerHTML=html;return e;}
function begin(c,id){cur=id;c.field.input.placeholder='Ask Life or hold to talk';c.stage.appendChild(el('m-sp',''));count(c);}
function count(c){var n=c.stage.querySelectorAll('.is-needs').length,k=c.phone.querySelector('.s-count');k.textContent=n;k.setAttribute('aria-label',n+' waiting on you');k.style.visibility=n?'visible':'hidden';}
function me(c,t){var e=el('m-me','');e.textContent=t;return add(c,e);}
function say(c,t){var e=el('m-bt','');e.textContent=t;return add(c,e);}
async function asks(c,t){await c.type(c.field.input,t);await c.wait(300);c.field.clear();me(c,t);}
async function works(c,steps){c.edge.set('work');var s=add(c,el('m-step','<span class="m-spin"></span><span>Thinking…</span>'));await c.wait(1400);
  for(var i=0;i<steps.length;i++){s.lastChild.innerHTML=steps[i];await c.wait(1500);}s.remove();}
function landed(c){c.edge.set('landed');}

/* an item: a row, or unfolded in place. o = {icon, t, line, state, why, body, foot, act, doing, ok, pills, then, wire}
   state: needs, under, queued, done, dropped, parked, earlier. Answers only while it needs him. */
function item(c,o){var e=el('m-item','');e._o=o;o.fresh=o.open;paint(c,e);return add(c,e);}
function disc(o){return '<span class="m-disc">'+icon(o.icon)+'</span>';}
function paint(c,e){var o=e._o;e.className='m-item is-'+o.state+(o.open&&o.fresh?' m-ip':'');o.fresh=false;
  if(!o.open){e.innerHTML='<div class="m-row">'+disc(o)+'<span class="m-tx"><b>'+esc(o.t)+'</b><small class="m-l">'+o.line+'</small></span></div>';
    e.firstChild.onclick=function(){if(/needs|under|queued/.test(o.state)&&o.body!==undefined){o.open=o.fresh=true;paint(c,e);}};count(c);return;}
  var body=typeof o.body==='function'?o.body(o):(o.body||'');
  e.innerHTML='<button type="button" class="m-fold" aria-label="Fold">⌃</button><div class="m-hero">'+disc(o)+'<div><div class="m-ht">'+esc(o.t)+'</div><div class="m-hl m-l">'+o.line+'</div></div></div>'+
    (o.why?'<p class="m-why">'+esc(o.why)+'</p>':'')+body+(o.foot?'<div class="m-foot">'+esc(o.foot)+'</div>':'')+answers(o);
  e.querySelector('.m-fold').onclick=function(){o.open=false;paint(c,e);};
  if(o.wire)o.wire(e,c);
  var p=e.querySelector('.m-prim');if(p)p.onclick=function(){act(c,e,p);};
  e.querySelectorAll('[data-pill]').forEach(function(b){b.onclick=function(){var f=o.pills[+b.dataset.pill];if(f.then)f.then(c,e,b);else if(f.field){c.field.input.value=f.field;c.field.sync();c.field.input.focus();}
      else{b.textContent='It stays here';b.disabled=true;}};});count(c);}
function answers(o){if(o.state!=='needs'&&!o.quiet)return '';
  var pills=(o.pills||[]).map(function(p,i){return '<button type="button" class="m-pill" data-pill="'+i+'">'+esc(p.t)+'</button>';}).join('');
  if(o.state!=='needs')return pills?'<div class="m-two quiet">'+pills+'</div>':'';
  return '<div class="m-ans">'+(o.act?'<button type="button" class="m-prim">'+esc(o.act)+'</button>':'')+(pills?'<div class="m-two">'+pills+'</div>':'')+'</div>';}
async function act(c,e,p){var o=e._o;if(p.disabled)return;p.disabled=true;p.classList.add('busy');p.innerHTML='<span class="m-spin"></span>'+esc(o.doing);
  try{if(o.during)await o.during(c,e);else await c.wait(1300);p.classList.remove('busy');p.classList.add('okd');p.textContent='✓ '+o.ok;await c.wait(1000);
    if(o.then)await o.then(c,e);}catch(x){if(!x||!x.cancelled)throw x;}}
function settle(c,e,state,ln){var o=e._o;o.state=state;o.open=false;o.line=ln;paint(c,e);}
async function quiet(c,e,ln){var l=e.querySelector('.m-l');if(!l)return;l.classList.add('m-q','out');await c.wait(260);e._o.line=ln;l.innerHTML=ln;l.classList.remove('out');}
function due(w){return esc(P().name)+' · <i class="m-due">'+w+'</i>';}
function ok(t){return '<span class="m-ok">'+esc(t)+'</span>';}

/* ===== the items, composed from the components; the same code for every project ===== */
function projectRow(state,line,extra){var p=P();return Object.assign({icon:p.icon,t:p.name,state:state,line:line},extra||{});}
function goalHTML(){var p=P();return '<div class="m-goal">“'+esc(p.goal)+'”<small>'+esc(p.asked)+'</small></div>';}
function projectPage(){var p=P();return projectRow('under',statusLine(p.working[2]),{open:true,quiet:true,
  body:goalHTML()+'<div class="m-sec">The plan</div>'+plan(p.plan,2)+
    '<div class="m-sec">So far</div><div class="m-box"><div class="m-kv"><span>Spent</span><b>'+esc(p.spent)+'</b></div><div class="m-kv"><span>Read</span><b>'+esc(p.read)+'</b></div></div>'+
    '<div class="m-sec">Preview</div>'+preview(p.preview,2),
  wire:wirePreview,
  pills:[{t:'Park it',then:async function(c,e){settle(c,e,'parked','Parked · say “go on” when you want');}},
         {t:'Drop it',then:async function(c,e){settle(c,e,'dropped','Dropped by you · what’s done stays');}}]});}

function accessCard(){var a=Object.assign({},P().access,{steps:P().access.steps.map(function(x){return Object.assign({},x);})});
  return {icon:a.where,t:a.t,line:due('today'),state:'needs',why:a.why,
  body:function(){return checklist(a)+'<div class="m-foot">'+esc(a.privacy)+'</div>';},
  foot:a.wait,act:a.act,doing:a.doing,ok:a.ok,pills:[{t:'Later'}],
  then:async function(c,e){e.querySelector('.m-ans').style.display='none';
    for(var i=0;i<a.steps.length;i++){if(a.steps[i].state==='done'||!a.steps[i].mustHave)continue;await c.wait(1600);a.steps[i].state='done';e.querySelector('.m-steps').parentNode.outerHTML=checklist(a);}
    await c.wait(2000);settle(c,e,'done',ok('Done')+' · without what only helps');say(c,a.after);landed(c);}};}

function questionsCard(){var q=P().q;return {icon:P().icon,t:q.t,line:due('today'),state:'needs',why:q.why,
  body:function(){return questions(q.list);},wire:wireQuestions(q.list),
  foot:'No answer by tomorrow 10:00: I go with my picks and tell you.',
  act:'Use these',doing:'Saving…',ok:'Saved',pills:[{t:'Later'}],
  then:async function(c,e){settle(c,e,'done',ok('Done')+' · your choices · today');say(c,'Thanks. I’ll have a preview for you in about 20 minutes.');landed(c);}};}

function previewCard(v){var p=P();return {icon:p.icon,t:'Look at the preview, then build it',line:due('today'),state:'needs',
  body:preview(p.preview,v)+'<div class="m-sec">The plan</div>'+plan(p.plan),wire:wirePreview,
  foot:'Nothing of yours changes until you tap Build it. Each change you ask for makes a new version.',
  act:'Build it',doing:'Starting…',ok:'Started',pills:[{t:'Later'},{t:'Change something',field:'Change the preview: '}],
  then:async function(c,e){live=null;settle(c,e,'under',statusLine(p.working[0]));landed(c);}};}

function batchCard(){var b=P().batch;return {icon:P().icon,t:b.t,line:due('today'),state:'needs',why:b.why,body:batch(b),
  foot:'Until you answer, I go on with the rest and leave these as they are.',
  act:b.act,doing:'Working…',ok:b.ok,pills:[{t:'Later'},{t:b.no,then:async function(c,e){settle(c,e,'done','Left as they are');}}],
  then:async function(c,e){settle(c,e,'done',ok(b.settled));landed(c);}};}

function sendCard(){var s=P().send;return {icon:P().icon,t:s.t,line:due('tonight'),state:'needs',why:s.why,
  body:function(o){return drafts(s.list,o.ed);},wire:wireDrafts,
  foot:'Nothing goes until you tap. Each is sent on its own, only if nobody wrote in that chat since.',
  act:'Send all '+s.list.length,doing:'Sending…',ok:'Sent to all '+s.list.length,pills:[{t:'Later'}],
  during:async function(c,e){var d=e.querySelectorAll('.m-dr');for(var i=0;i<d.length;i++){d[i].querySelector('.cb-cd').contentEditable='false';await c.wait(380);d[i].classList.add('sent');}await c.wait(300);},
  then:async function(c,e){settle(c,e,'done',ok('Sent to all '+s.list.length)+' · today');landed(c);}};}

function overCapCard(){var p=P(),o=p.over,cap=p.plan.cost.cap;return {icon:p.icon,t:o.t,line:due('today'),state:'needs',why:o.why,
  body:'<div class="m-box">'+isNew()+'<div class="m-kv"><span>So far</span><b>'+eur(cap)+' of '+eur(cap)+'</b></div><div class="m-kv"><span>To finish</span><b>About '+eur(o.more)+' more</b></div><div class="m-kv"><span>This month</span><b>Fits your '+eur(p.plan.budget.cap)+'</b></div></div>',
  foot:'Until you answer I’ve paused here. Everything done so far stays.',
  act:'Raise to '+eur(cap+o.more),doing:'Saving…',ok:'Raised',pills:[{t:'Later'},{t:'Stop here',then:async function(c,e){settle(c,e,'done',esc(o.stop));}}],
  then:async function(c,e){settle(c,e,'under',statusLine(o.resumed));landed(c);}};}

function roomWait(open){var p=P(),r=p.room,b=p.plan.budget;return projectRow('queued','Waits for room this month · starts '+esc(r.starts),{open:open,quiet:true,
  body:'<p class="m-why" style="margin-top:4px">Your other projects use what’s left of this month’s '+eur(b.cap)+'. This one needs about '+eur(r.needs)+', so it starts on '+esc(r.starts)+', '+esc(r.inTime)+'.</p>',
  pills:[{t:'Raise to '+eur(b.cap+5),then:async function(c,e){settle(c,e,'under',statusLine(p.status[0]));landed(c);}}]});}

function donePage(){var p=P();return projectRow('done',ok('Done')+' · today',{open:true,body:goalHTML()+'<div class="m-sec">What changed</div>'+result(p.result),

function nextCard(){var n=P().next;return {icon:P().icon,t:n.q,line:esc(P().name)+' · ideas',state:'needs',

  foot:'If you don’t answer, nothing starts.',act:'Start these',doing:'Starting…',ok:'Started',pills:[{t:'Not now'}],

/* a change to the preview: the version he sees folds to an earlier one, the next lands */
var live=null;
async function round(c,text){if(!live||c.cancelled())return;var old=live;me(c,text);await works(c,['Changing <b>the preview</b>','Making <b>version '+(old._v+1)+'</b>']);
  settle(c,old,'earlier','Earlier version '+old._v);var v=old._v+1;say(c,'Here it is:');live=item(c,Object.assign(previewCard(v),{open:true}));live._v=v;landed(c);}

  ['Status line','{ doing, eta, done }','The agent’s doing and eta (AgentNow, its under-way item). App v4’s row and still ring.',function(p){return '<div class="m-row">'+disc(p)+'<span class="m-tx"><b>'+esc(p.name)+'</b><small class="m-l">'+statusLine(p.working[1])+'</small></span></div>';}],

  ['Preview link','{ title, line, cover: [thumb | text], versions }','Waits on the artifact system.',function(p){return preview(p.preview,2);}],
  ['Plan','{ steps: [text], done, time, cost: { est, cap }, budget: { cap, spent, room } }','The project’s budget; it waits for room when room < cost.est; over the cap is asked again.',function(p){return plan(p.plan);}],
  ['Batch list','{ t, why, count, sample: [thumb | text], undo?, restore }','One yes for many changes.',function(p){return batch(p.batch);}],
  ['Many drafts','drafts: [StoredDraft { chat, app, text }], one Send all','Decision.drafts[]; each App v4’s chat and draft.',function(p){return drafts(p.send.list.slice(0,1));}],
  ['Result','{ done, before, after, where, undo?, cost }','Waits on the artifact system.',function(p){return result(p.result);}]];
function catalog(c){var p=P();SHAPES.forEach(function(s){var e=el('m-cat','<h3>'+s[0]+'</h3>'+s[3](p)+'<div class="m-shape">'+esc(s[1])+'</div><div class="m-src">'+esc(s[2])+'</div>');c.stage.appendChild(e);});
  c.stage.scrollTop=0;}

Shell.mount({title:'Mini projects',
  onAsk:function(text){if(cur==='preview'&&live)round(lastCtx,text);else Shell.run('ask');},
  scenes:[
  {id:'idle',label:'Idle',run:async function(c){begin(c,'idle');}},
  {id:'parts',label:'0. The components and their data',run:async function(c){begin(c,'parts');catalog(c);}},
  {id:'ask',label:'1. You ask; the project appears',run:async function(c){var p=P();begin(c,'ask');lastCtx=c;
    await asks(c,p.goal);await works(c,['Looking at <b>'+esc(p.look)+'</b>']);say(c,p.bigger);
    var r=item(c,projectRow('under',statusLine(p.status[0])));landed(c);
    await c.wait(3500);await quiet(c,r,statusLine(p.status[1]));await c.wait(3500);await quiet(c,r,statusLine(p.status[2]));}},
  {id:'page',label:'2. The project, unfolded',run:async function(c){var p=P();begin(c,'page');
    me(c,'How’s '+p.name+' going?');await works(c,['Looking at <b>'+esc(p.name)+'</b>']);
    say(c,'It’s going well. Here’s where it stands:');item(c,projectPage());landed(c);}},
  {id:'access',label:'3. Access: steps that tick themselves',run:async function(c){var p=P();begin(c,'access');
    item(c,projectRow('under',statusLine(p.status[2])));await c.wait(900);
    say(c,'To go further I need your help with a few things:');item(c,Object.assign(accessCard(),{open:true}));landed(c);}},
  {id:'questions',label:'4. Questions about what you want',run:async function(c){var p=P();resetQuestions(p.q.list);begin(c,'questions');
    say(c,p.found);item(c,Object.assign(questionsCard(),{open:true}));landed(c);}},
  {id:'preview',label:'5. Preview and plan: Build it',run:async function(c){begin(c,'preview');lastCtx=c;
    say(c,'Here’s how it would look, and how I’d get there:');live=item(c,Object.assign(previewCard(1),{open:true}));live._v=1;landed(c);
    c.field.input.placeholder='Say what to change';}},
  {id:'preview-round',label:'5b. A change: version 2',run:async function(c){var p=P();begin(c,'preview');lastCtx=c;
    say(c,'Here’s how it would look, and how I’d get there:');live=item(c,Object.assign(previewCard(1),{open:true}));live._v=1;landed(c);
    await c.wait(1800);await c.type(c.field.input,p.preview.change);await c.wait(300);c.field.clear();await round(c,p.preview.change);}},
  {id:'lapsed',label:'5c. No answer after a day',run:async function(c){begin(c,'preview');lastCtx=c;
    item(c,{icon:P().icon,t:P().q.t,line:'Went with Life’s picks · Thu',state:'done'});
    say(c,'You didn’t get to the choices yesterday, so I went with my picks. Here’s the preview; change anything by saying it.');
    live=item(c,Object.assign(previewCard(1),{open:true}));live._v=1;landed(c);}},
  {id:'working',label:'6. The work: a small part first',run:async function(c){var p=P();begin(c,'working');
    var r=item(c,projectRow('under',statusLine(p.working[0])));await c.wait(3000);say(c,p.firstPart);landed(c);
    await c.wait(1500);await quiet(c,r,statusLine(p.working[1]));await c.wait(3000);await quiet(c,r,statusLine(p.working[2]));}},
  {id:'batch-yes',label:'7. A batch to approve: your yes',run:async function(c){begin(c,'batch-yes');
    say(c,'This batch needs your yes:');item(c,Object.assign(batchCard(),{open:true}));landed(c);}},
  {id:'batch-send',label:'8. Sending many: one card',run:async function(c){begin(c,'batch-send');
    say(c,P().send.lead);item(c,Object.assign(sendCard(),{open:true}));landed(c);}},
  {id:'over-cap',label:'9. Over its cap: asked again',run:async function(c){var p=P();begin(c,'over-cap');
    item(c,projectRow('under',statusLine(p.over.now)));await c.wait(700);
    say(c,p.name+' needs your word:');item(c,Object.assign(overCapCard(),{open:true}));landed(c);}},
  {id:'budget',label:'10. Waiting for room in the month',run:async function(c){var p=P();begin(c,'budget');
    await asks(c,p.goal);await works(c,['Looking at <b>this month’s spending</b>']);
    say(c,'I’ll do it, from '+p.room.starts+':');item(c,roomWait(true));landed(c);}},
  {id:'done',label:'11. Done: one push, the result',run:async function(c){var p=P();begin(c,'done');c.lock('18:20');c.edge.set('still');await c.wait(900);
    var n=c.notify(p.push);await Promise.race([n,c.wait(4000)]);c.lock(false);c.edge.set('rest');
    say(c,'Here’s what changed:');item(c,donePage());await c.wait(1200);
    say(c,'While I was at it, two ideas:');resetQuestions([p.next]);item(c,Object.assign(nextCard(),{open:true}));landed(c);}},
  {id:'dropped',label:'12. Dropped and parked',run:async function(c){var p=P();begin(c,'dropped');
    me(c,'What happened with '+p.name+' and the bakery site?');await works(c,['Looking at <b>your projects</b>']);
    say(c,'I stopped '+p.name+'; nothing of yours changed. The bakery site is parked, as you asked; say “go on” any time.');
    item(c,projectRow('dropped',esc(p.dropped)));item(c,{icon:OTHER.icon,t:OTHER.name,state:'parked',line:'Parked by you · Sat'});landed(c);}},
  {id:'several',label:'13. Several projects at once',run:async function(c){begin(c,'several');
    me(c,'What are you working on for me?');await works(c,['Looking at <b>your projects</b>']);
    say(c,'Three projects. The bakery site needs your choices.');
    item(c,{icon:OTHER.icon,t:OTHER.name,state:'needs',line:'Needs your choices · <i class="m-due">today</i>'});
    ['photos','party'].forEach(function(k){var p=EX[k];item(c,{icon:p.icon,t:p.name,state:'under',line:statusLine(p.working[1])});});landed(c);}},
  {id:'waiting-list',label:'Waiting on you (the count)',run:async function(c){begin(c,'waiting-list');resetQuestions(P().q.list);
    me(c,'What’s waiting on me?');say(c,'Three things for '+P().name+':');
    [accessCard(),questionsCard(),sendCard()].forEach(function(o){item(c,o);});landed(c);}}]});

/* the example switch: the same scene, the other project; a screen that breaks on one is bespoke */
(function(){var side=document.querySelector('.side'),box=el('m-ex','');box.setAttribute('role','group');box.setAttribute('aria-label','Example project');
  [['photos','Photo cleanup'],['party','Party invites']].forEach(function(x){var b=document.createElement('button');b.type='button';b.textContent=x[1];b.dataset.ex=x[0];
    b.onclick=function(){ex=x[0];mark();var on=side.querySelector('button[aria-pressed="true"]:not([data-ex])');if(on)on.click();};box.appendChild(b);});
  function mark(){box.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.ex===ex));});}
  side.insertBefore(box,side.querySelector('.play'));mark();})();
</script>
