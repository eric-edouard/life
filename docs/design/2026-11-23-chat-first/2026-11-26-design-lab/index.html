<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life design lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<style>
/* Layout: one phone, one item at a time. Squarish or wide: the phone on the left sized to the height, the selectors
   and the item list in a column on the right. Narrow and tall (a phone): the screen is the device, a slim header on top,
   the list as a sheet. Dark only, as the app (the owner's answer 11); colours are tokens.css's dark values. */
:root{--bg:#000;--fg:#fff8ea;--muted:#8a867e;--tile:#111214;--card:#0b0c0e;--line:#1f2024;--tint:rgba(255,248,234,.1);--glass:rgba(255,248,234,.14);--ai:#9aa8ec;--ok:#30d158;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-within{outline:2px solid var(--fg);outline-offset:2px}
/* two sizes only: body 15, labels 13 (600, muted); the item's name is the one large line */
.lab{height:100%;display:grid;grid-template-columns:var(--pw,390px) minmax(0,380px);justify-content:center;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage head";column-gap:clamp(24px,4vw,48px);padding:0 max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;max-width:1280px;margin:0 auto}
.top{grid-area:top;position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px}
.top .ib{justify-self:start}
.ib{width:40px;height:40px;border-radius:20px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.mode{display:flex;gap:4px;padding:4px;border-radius:20px;background:var(--tile)}
.mode button{height:32px;padding:0 16px;border-radius:16px;font-size:13px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--fg);color:#000}
.stage{grid-area:stage;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.head{grid-area:head;align-self:center;display:flex;flex-direction:column;gap:24px;max-height:100%;overflow-y:auto;min-width:0;scrollbar-width:none}
.r1{display:flex;align-items:center;gap:8px;min-width:0}
.r1 .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.r1 b{font-size:22px;font-weight:650;line-height:1.2}
.nav{width:32px;height:32px;border-radius:16px;font-size:20px;color:var(--muted);flex:none}.nav:hover{background:var(--tint);color:var(--fg)}
.st{font-size:13px;font-weight:600;color:var(--muted)}.st:empty{display:none}
.sit{display:flex;align-items:baseline;gap:8px;min-width:0;margin-top:-16px}
#isit{margin:0;flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#isit b{color:var(--fg);font-weight:600}
#isit.open{white-space:normal}
#sitmore{font-size:13px;font-weight:600;color:var(--muted);flex:none}#sitmore:hover{color:var(--fg)}
.ver{display:flex;flex-direction:column;gap:16px}
.r2{display:flex;align-items:center;gap:8px;min-width:0}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots button{position:relative;min-width:40px;padding:0 10px;white-space:nowrap;height:40px;border-radius:20px;background:var(--tint);font-weight:650}
.dots button[aria-current="true"]{background:var(--fg);color:#000}
.dots button.rec::after{content:"";position:absolute;left:50%;bottom:-8px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--ai)}
#vw{margin:0;font-weight:600}
#pick{flex:none;height:40px;padding:0 24px;border-radius:20px;background:var(--fg);color:#000;font-weight:650}
#pick.on{background:var(--ok)}#pick[disabled]{background:var(--tint);color:var(--muted);cursor:default}
#refine summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);width:max-content}
#refine summary::-webkit-details-marker{display:none}#refine summary::before{content:"+ "}#refine[open] summary::before{content:"\2212  "}
#refine summary:hover{color:var(--fg)}
#more{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.tg{display:flex;flex-wrap:wrap;gap:8px}.tg:empty{display:none}
.tg button{height:32px;padding:0 16px;border-radius:16px;background:var(--tile);font-size:13px;font-weight:600}
.tg button[aria-pressed="true"]{background:var(--fg);color:#000}
.parts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}.parts:empty{display:none}
.parts label{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px 0 8px;border-radius:16px;background:var(--tile);font-weight:600;color:var(--fg);cursor:pointer}
.parts input{accent-color:var(--fg);margin:0}
#note{width:100%;min-height:48px;box-sizing:border-box;background:var(--tile);color:var(--fg);border:0;border-radius:12px;padding:8px 16px;font:inherit;resize:vertical}
.vnote{font-size:13px;color:var(--muted)}.vnote:empty{display:none}.vnote .warn{display:block;color:#f0b49f;margin-top:4px}
#save{font-size:13px;color:var(--muted)}#more.dec .parts,#more.dec #note,#more.dec #save{display:none}
/* the list: a sheet opened by the list button, on every layout */
.side{position:absolute;z-index:20;top:56px;left:0;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 88px);box-sizing:border-box;overflow-y:auto;background:var(--tile);border-radius:22px;padding:8px 16px 24px;scrollbar-width:thin;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .18s,transform .18s}
.side.open{opacity:1;transform:none;pointer-events:auto}
.sheetbg{display:none}.sheetbg.open{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.55)}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:24px 8px 8px}
.li{display:flex;width:100%;align-items:baseline;gap:16px;text-align:left;padding:8px;border-radius:12px}
.li span{flex:1;min-width:0}.li .st{flex:none}.li[aria-current="true"]{background:var(--tint)}.li:hover{background:var(--tint)}
.hint{font-size:13px;color:var(--muted);margin:8px 8px 0}
/* the device: a 390 x 844 screen, scaled to the stage (wide), or the whole screen (phone) */
.dev{position:relative;border-radius:54px;background:#000;box-shadow:inset 0 0 0 2px #2a2b31,0 0 0 1px #000;overflow:hidden;flex:none}
.scr{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0}
.track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.pg>.sx,.pg>.ax,.scene{position:absolute;inset:0}
.shell{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
/* a card's screen: the thread around it fades back, the card stands out */
.vph{position:absolute;inset:0;font-family:var(--sans);color:var(--fg)}
.vsb{position:absolute;top:16px;left:34px;right:30px;display:flex;justify-content:space-between;font-size:14px;font-weight:650}
.vpl{position:absolute;top:52px;left:16px;right:16px;display:flex;justify-content:space-between}
.vpl i,.vback{width:38px;height:38px;border-radius:19px;background:rgba(40,41,48,.8);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.vpl i.pd::after{content:"";width:9px;height:9px;border-radius:5px;background:var(--fg)}.vback{font-size:24px;line-height:1}
.vth{position:absolute;top:100px;bottom:92px;left:16px;right:16px;overflow-y:auto;scrollbar-width:none}
.vth .cbf{min-height:100%;justify-content:flex-end;padding-bottom:6px}.vph.pgv .vth .cbf{justify-content:flex-start}
.vfl{position:absolute;left:16px;right:16px;bottom:28px}.vctx{opacity:.55}
.sheetbg{display:none}
/* narrow and tall: the screen is the device */
@media (max-width:599px),(max-aspect-ratio:3/5){
 .lab{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top" "head" "stage";padding:0;column-gap:0}
 .top{height:56px;padding:0 max(16px,env(safe-area-inset-left,0px));grid-template-columns:auto 1fr;gap:16px}.top .mode{justify-self:end}
 .mode button{padding:0 12px}
 .head{align-self:stretch;gap:16px;padding:0 16px 16px;max-height:55vh}
 .r1 b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sit{margin-top:-8px}
 .ver{gap:8px}.dots button.rec::after{bottom:-6px}#vw{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dots button,#pick{height:36px}.dots button{width:36px}
 .stage{display:block;position:relative}
 .dev{position:absolute!important;inset:0;width:auto!important;height:auto!important;border-radius:0;box-shadow:none}
 .scr{width:100%!important;height:100%!important;transform:none!important}
 .vsb,.sx .sb,.ax .sb{display:none}.vpl{top:8px}.vth{top:56px}.sx .pills,.ax .pills{top:8px}.sx .th,.ax .th{top:60px!important}
 .side{position:fixed;top:auto;bottom:0;left:0;width:100%;max-height:78%;border-radius:22px 22px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);opacity:1;transition:transform .25s}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

 return {id:it.id,area:it.id==='matterpage'?'pages':ga,n:it.n,d:it.d,rec:(V2[it.id]&&V2[it.id].rec)||it.rec,parts:it.parts,v:v};});
