<!doctype html>
<!-- Turn by turn v3: the one prototype (turn.html), its scenes, and the variations his review of 28 Nov left open, per
     topic, and a design judge's fixes (Before, as he saw it; After; or each fix on its own). The prototype loads once: a scene or a variation is a postMessage to it, never a reload. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turn by turn v3: compare</title>
<link rel="stylesheet" href="../../../assets/brand/tokens.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;gap:10px;padding:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar b{font-size:var(--text-heading);font-weight:650;color:var(--muted);margin-right:6px}
.bar button{height:34px;padding:0 14px;border-radius:17px;background:var(--tile);font-size:14px;font-weight:600}
.bar button[aria-pressed="true"]{background:var(--fg);color:var(--on)}
.bar button.sm{height:28px;padding:0 11px;font-size:12.5px}
.view{flex:1;min-height:0;position:relative;border-radius:var(--panel-radius);background:var(--card);overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (min-width:900px){body{display:grid;grid-template-columns:1fr 260px;grid-template-rows:auto auto auto auto 1fr;gap:14px}
  .view{grid-column:1;grid-row:1/6}.bar{grid-column:2;align-content:flex-start}.bar b{flex-basis:100%;margin:6px 0 2px}}
</style>
</head>
<body>
<div class="bar" id="scene"><b>Scene</b></div>
<div class="bar" id="day"><b>A day's events</b></div>
<div class="bar" id="pager"><b>Earlier turns</b></div>
<div class="bar" id="fix"><b>Judge’s fixes</b></div>
<div class="view"><iframe id="frame" title="Turn by turn v3"></iframe></div>
<script>
var PICKS={
  scene:[['idle','Idle'],['home-waiting','Opens with matters waiting'],['waiting-list','Waiting on you'],['pendant','Pendant status'],['type-send','Types an ask'],['voice-send','Holds to talk'],['working','Life works'],
    ['answer-day','What’s on today'],['answer-jade','Did Jade answer?'],['tell','Tell Ben'],['card-arrives','A card arrives'],
    ['slow','A slow ask'],['failure','A read fails'],['history','Earlier turns'],['follow-up','And tomorrow?'],['hey-life','Hey Life']],
  day:[['rows','Rows'],['line','Timeline'],['big','Large times']],
  pager:[['snap','Snap'],['depth','Depth'],['peek','Peek']]},
  /* the scenes each topic shows in: a variation replays the current one if it is among them, else goes to the first */
  SHOWN={day:['answer-day','follow-up','history','working'],pager:['history']};
/* a design judge's fixes: Before (none, the default: what he already saw), After (all but the last, which goes against
   his ask of 28 Nov for cards swiped sideways), or each on its own; [name, label, the scenes it shows in] */
var FIXES=[['lead','Headline first',['tell']],['which','Which Ben? first',['tell']],['old','Replaced draft kept',['answer-jade']],
  ['head','Smaller home header',['home-waiting']],['raw','No raw labels',['answer-day','follow-up','history','working']],
  ['fail','Failed read fills the screen',['failure']],['hint','Earlier turns hint',['idle','home-waiting']],
  ['stack','Stack instead of swipe (judge)',['home-waiting','waiting-list']]],
  AFTER=FIXES.slice(0,-1).map(function(f){return f[0];}).join('-');
var state={scene:'idle',day:'rows',pager:'snap',fix:''},frame=document.getElementById('frame');
(location.hash.match(/(scene|day|pager|fix)=[\w-]*/g)||[]).forEach(function(x){x=x.split('=');state[x[0]]=x[1];});
function fixes(){return state.fix?state.fix.split('-'):[];}
function press(){Object.keys(PICKS).forEach(function(t){document.querySelectorAll('#'+t+' button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===state[t]));});});
  document.querySelectorAll('#fix button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.all!=null?state.fix===b.dataset.all:fixes().indexOf(b.dataset.v)>=0));});
  history.replaceState(null,'','#scene='+state.scene+'&day='+state.day+'&pager='+state.pager+'&fix='+state.fix);}
function setFix(f,scenes){state.fix=FIXES.map(function(x){return x[0];}).filter(function(k){return f.indexOf(k)>=0;}).join('-');var msg={vary:{fix:state.fix}};
  if(scenes&&scenes.indexOf(state.scene)<0)msg.scene=state.scene=scenes[0];press();frame.contentWindow.postMessage(msg,'*');}
function fixButton(label,cls,click,data){var b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;for(var k in data)b.dataset[k]=data[k];b.onclick=click;document.getElementById('fix').appendChild(b);}
fixButton('Before','',function(){setFix([]);},{all:''});
fixButton('After','',function(){setFix(AFTER.split('-'));},{all:AFTER});
FIXES.forEach(function(f){fixButton(f[1],'sm',function(){var l=fixes(),i=l.indexOf(f[0]);if(i<0)l.push(f[0]);else l.splice(i,1);setFix(l,i<0?f[2]:null);},{v:f[0]});});
Object.keys(PICKS).forEach(function(t){PICKS[t].forEach(function(p){var b=document.createElement('button');b.type='button';b.dataset.v=p[0];b.textContent=p[1];
  b.onclick=function(){var msg={};state[t]=p[0];
    if(t==='scene')msg.scene=p[0];else{msg.vary={};msg.vary[t]=p[0];if(SHOWN[t].indexOf(state.scene)<0)msg.scene=state.scene=SHOWN[t][0];}
    press();frame.contentWindow.postMessage(msg,'*');};
  document.getElementById(t).appendChild(b);});});
frame.src='turn.html#embed&scene='+state.scene+'&day='+state.day+'&pager='+state.pager+'&fix='+state.fix;press();
</script>
</body>
</html>
