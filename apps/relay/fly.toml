# The relay behind *.hostedbyme.app: OpenTunnel's server on raw TCP, so each Mac's TLS passes through unopened
# (docs/plans/2026-11-27-private-relay.md). Raw TCP on 443 needs a dedicated IPv4: `fly ips allocate-v4`.
# Secrets: DATABASE_URL, INTERNAL_TOKEN, ACME_ACCOUNT_KEY_JWK, PORKBUN_API_KEY, PORKBUN_SECRET_API_KEY.
app = "hostedbyme"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[deploy]
  strategy = "bluegreen"

[[restart]]
  policy = "on-failure"
  retries = 10

[env]
  OPENTUNNEL_DOMAIN = "hostedbyme.app"
  PROXY_PROTOCOL = "true"
  RUST_LOG = "info"
  LOG_FORMAT = "json"
  ACME_URL = "https://acme-v02.api.letsencrypt.org/directory"
  ACME_EMAIL = "relay@hostedbyme.app"
  DNS_PROVIDER = "exec"
  DNS_HOOK = "/usr/local/bin/porkbun-dns-hook"
  ZONE = "hostedbyme.app"
  # Porkbun's DNS is slower to reach public resolvers than Cloudflare's.
  ACME_DNS_PROPAGATION_TIMEOUT_MS = "180000"
  # No visitor comes through Cloudflare.
  TRUSTED_PROXY_RANGES = "off"
  INTERNAL_LISTEN = "[::]:9000"

[[services]]
  internal_port = 8443
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["proxy_proto"]
    proxy_proto_options = { version = "v2" }

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
