[project]
name = "speech"
version = "0.1.0"
description = "The speech service: speaker embeddings, languages, speaker turns and words for the voice server"
requires-python = "==3.12.*"
dependencies = [
  "librosa==0.11.0",  # Nemotron's processor's features
  "mlx-audio==0.6.1; sys_platform == 'darwin'",
  "numpy==2.3.4",
  "onnx-asr==0.12.0; sys_platform != 'darwin'",
  "onnxruntime==1.31.0; sys_platform != 'darwin'",
  "soundfile==0.14.0",
  "speechbrain==1.1.1",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "transformers==5.20.2",
]

# CPU-only wheels on Linux (the Docker image); macOS wheels on PyPI are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
