# The push relay, `life-push`: lifelog's `push-relay.ts`, which holds the app's APNs key and forwards its ids-only pushes
# to Apple, so no user's server holds that key (SECURITY.md, "What leaves the Mac"). Always APNs production. Its hostname
# is `life-push.fly.dev` (no custom domain). One machine, pinned: its hourly counters live in memory.
#
# Secrets: APNS_KEY_ID, APNS_PRIVATE_KEY, APNS_TEAM_ID (`fly secrets set -a life-push`).
# Not deployed until the owner says yes: from the repo root, which the Dockerfile builds from,
# `fly deploy -a life-push --remote-only --config apps/lifelog/apps/server/push-relay/fly.toml .`
app = "life-push"
primary_region = "sin"

[build]
  dockerfile = "apps/lifelog/apps/server/push-relay/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
