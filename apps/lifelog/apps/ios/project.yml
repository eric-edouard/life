name: Lifelog
options:
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
packages:
  LifelogKit:
    path: Kit
settings:
  base:
    # The two settings to change to build under another team: every bundle id, the app group and the background
    # task derive from LIFELOG_BUNDLE_ID.
    DEVELOPMENT_TEAM: FA22AU429R
    LIFELOG_BUNDLE_ID: com.ericedouard.lifelog
    CODE_SIGN_STYLE: Automatic
    # The build number every target's Info.plist reads, so the extensions and the watch match the app. "1" only where
    # nothing passes one: install-phone.ts passes the UTC build time (YYYYMMDD.HHMM), the one place it is computed.
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Lifelog:
    type: application
    platform: iOS
    # Shared: the app group, snapshot copy and the control's intent, compiled into the widget extension too.
    sources: [Lifelog, Shared]
    dependencies:
      - target: LifelogWidgets
      - target: LifelogWatch
      - target: LifelogNotificationService
      - target: LifelogNotificationContent
      - package: LifelogKit
        product: Capture
      - package: LifelogKit
        product: SourceStore
      - package: LifelogKit
        product: PendantProtocol
      - package: LifelogKit
        product: Incidents
      - package: LifelogKit
        product: OwnerSettings
      - package: LifelogKit
        product: Upload
      - package: LifelogKit
        product: ServerAPI
      - package: LifelogKit
        product: AudioPipeline
      - package: LifelogKit
        product: Library
      - package: LifelogKit
        product: Export
      - package: LifelogKit
        product: Timeline
      - package: LifelogKit
        product: Glance
      - package: LifelogKit
        product: Health
      - package: LifelogKit
        product: LifeConnector
    # The build's commit (a `+` when the tree is dirty), written to `build-stamp.txt` in the app's resources, which
    # Settings shows beside the version and build date: every build and install carries it, and the file is signed with the bundle. The sandbox is off for
    # this target because git reads `.git`, which sits outside the source folder in a worktree.
    postBuildScripts:
      - name: Stamp the build
        outputFiles: [$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/build-stamp.txt]
        basedOnDependencyAnalysis: false
        script: |
          dirty=$(git -C "$SRCROOT" diff --quiet HEAD || echo +)
          echo "$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo nogit)$dirty" > "$SCRIPT_OUTPUT_FILE_0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFELOG_BUNDLE_ID)
        PRODUCT_NAME: lifelog
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Lifelog/AppIcon.icon, the Icon Composer document (Liquid Glass layers, light/dark/tinted).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lifelog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: lifelog connects to your Pendant to save its recordings on this iPhone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: lifelog notes where you were every few minutes so a conversation can show where it happened.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: lifelog notes where you were every few minutes while your Pendant records, even with the app closed, so each conversation shows where it happened.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: lifelog shows the photos and screenshots you took during a conversation beside what was said. They stay in your library.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Life asks for Face ID before it sends a message in your name from a notification.
        INFOPLIST_KEY_NSHealthShareUsageDescription: lifelog reads your sleep and workouts to send them to your own server for Life.
    info:
      path: Lifelog/Info.plist
      properties:
        # The app group, read at run time (Shared/AppGroup.swift).
        LifelogAppGroup: group.$(LIFELOG_BUNDLE_ID)
        # The app's own bundle id, which names its Keychain service in every target that reads it (Keychain.swift).
        LifelogBundleID: $(LIFELOG_BUNDLE_ID)
        # remote-notification: the server's silent push when a transcript or summary is ready.
        UIBackgroundModes: [bluetooth-central, processing, audio, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [$(LIFELOG_BUNDLE_ID).processing]
        UILaunchScreen: {}
        UIAppFonts: [Manrope.ttf]
        # Limited Photos access: don't offer to pick more photos on every launch.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        CFBundleDevelopmentRegion: en
        # The build's date, passed by the scripts that build (`CURRENT_PROJECT_VERSION=YYYYMMDD.HHMM`); left as a variable so it is never baked in.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Pairing links from the server's Mac (`lifelog://pair?url=…&token=…`), opened from a QR code.
        CFBundleURLTypes:
          - CFBundleURLName: pairing
            CFBundleURLSchemes: [lifelog]
    entitlements:
      path: Lifelog/Lifelog.entitlements
      properties:
        com.apple.security.application-groups: [group.$(LIFELOG_BUNDLE_ID)]
        # The server's silent push. Builds are development-signed, so APNs is the sandbox (APNS_ENVIRONMENT).
        aps-environment: development
        # Life's pushes at the level urgent (`levelOf`, card-push.ts): without it iOS lowers them to active.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
  LifelogWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: LifelogKit
        product: Capture
      - package: LifelogKit
        product: Incidents
      - package: LifelogKit
        product: Glance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFELOG_BUNDLE_ID).widgets
        PRODUCT_NAME: LifelogWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lifelog
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: Widgets/Info.plist
      properties:
        # The app group, read at run time (Shared/AppGroup.swift).
        LifelogAppGroup: group.$(LIFELOG_BUNDLE_ID)
        CFBundleDevelopmentRegion: en
        # The build's date, passed by the scripts that build (`CURRENT_PROJECT_VERSION=YYYYMMDD.HHMM`); left as a variable so it is never baked in.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(LIFELOG_BUNDLE_ID)]
  # Writes a card's push with the card's own words (`NotificationService`): Life's pairing, read with the app's tokens.
  LifelogNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared/AppGroup.swift
      - Lifelog/Life/Keychain.swift
      - Lifelog/Life/LifeToken.swift
    dependencies:
      - package: LifelogKit
        product: LifeConnector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFELOG_BUNDLE_ID).notification-service
        PRODUCT_NAME: LifelogNotificationService
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lifelog
    info:
      path: NotificationService/Info.plist
      properties:
        # The app group and the app's id, read at run time (Shared/AppGroup.swift, Keychain.swift).
        LifelogAppGroup: group.$(LIFELOG_BUNDLE_ID)
        LifelogBundleID: $(LIFELOG_BUNDLE_ID)
        CFBundleDevelopmentRegion: en
        # The build's date, passed by the scripts that build (`CURRENT_PROJECT_VERSION=YYYYMMDD.HHMM`); left as a variable so it is never baked in.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.$(LIFELOG_BUNDLE_ID)]
        # The app's own Keychain group, first: the app's tokens are there, and a new item goes to the first listed.
        keychain-access-groups: [$(AppIdentifierPrefix)$(LIFELOG_BUNDLE_ID)]
  # A card's expanded notification: its own answers as buttons (`NotificationViewController`), from the card it carries.
  LifelogNotificationContent:
    type: app-extension
    platform: iOS
    # A draft drawn whole, as on the card's screen: its view and the pieces it is drawn with.
    sources:
      - NotificationContent
      - Lifelog/DesignSystem/DraftBlock.swift
      - Lifelog/DesignSystem/Motion.swift
      - Lifelog/DesignSystem/Typography.swift
      - Lifelog/DesignSystem/NetworkMark.swift
      # The apps' own marks, for a draft's chat.
      - Lifelog/Marks.xcassets
      - Lifelog/DesignSystem/Fonts/Manrope.ttf
      - Shared/Palette.swift
      - Shared/Metrics.swift
      # His Face ID setting (`AppGroup.asksFaceIDToSend`).
      - Shared/AppGroup.swift
    dependencies:
      - package: LifelogKit
        product: LifeConnector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFELOG_BUNDLE_ID).notification-content
        PRODUCT_NAME: LifelogNotificationContent
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lifelog
        INFOPLIST_KEY_NSFaceIDUsageDescription: Life asks for Face ID before it sends a message in your name from a notification.
    info:
      path: NotificationContent/Info.plist
      properties:
        LifelogAppGroup: group.$(LIFELOG_BUNDLE_ID)
        CFBundleDevelopmentRegion: en
        UIAppFonts: [Manrope.ttf]
        # The build's date, passed by the scripts that build (`CURRENT_PROJECT_VERSION=YYYYMMDD.HHMM`); left as a variable so it is never baked in.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [life.card, life.card.send]
            UNNotificationExtensionInitialContentSizeRatio: 0.01
            # The chat's head is a button: it opens the chat in its app.
            UNNotificationExtensionUserInteractionEnabled: true
    entitlements:
      path: NotificationContent/NotificationContent.entitlements
      properties:
        com.apple.security.application-groups: [group.$(LIFELOG_BUNDLE_ID)]
  # The Watch: the glance the iPhone relays (`WatchRelay`), as complications and a remote (Record/Pause, Split).
  LifelogWatch:
    type: application
    platform: watchOS
    sources:
      - Watch/App
      # The face buttons' intents: named by the complications, run here.
      - Watch/Shared
      - Shared/AppGroup.swift
      - Shared/GlanceCopy.swift
      - Shared/Palette.swift
      - Shared/WatchMessage.swift
      - Lifelog/AppIcon.icon
    dependencies:
      - target: LifelogWatchWidgets
      - package: LifelogKit
        product: Glance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFELOG_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: LifelogWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lifelog
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(LIFELOG_BUNDLE_ID)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
    info:
      path: Watch/App/Info.plist
      properties:
        # The app group, read at run time (Shared/AppGroup.swift).
        LifelogAppGroup: group.$(LIFELOG_BUNDLE_ID)
        CFBundleDevelopmentRegion: en
        # The build's date, passed by the scripts that build (`CURRENT_PROJECT_VERSION=YYYYMMDD.HHMM`); left as a variable so it is never baked in.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
    entitlements:
      path: Watch/App/Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.$(LIFELOG_BUNDLE_ID)]
  LifelogWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Watch/Widgets
      - Watch/Shared
      - Shared/AppGroup.swift
      - Shared/GlanceCopy.swift
      - Shared/Palette.swift
      - Shared/WatchMessage.swift
    dependencies:
      - package: LifelogKit
        product: Glance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFELOG_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: LifelogWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lifelog
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: Watch/Widgets/Info.plist
      properties:
        # The app group, read at run time (Shared/AppGroup.swift).
        LifelogAppGroup: group.$(LIFELOG_BUNDLE_ID)
        CFBundleDevelopmentRegion: en
        # The build's date, passed by the scripts that build (`CURRENT_PROJECT_VERSION=YYYYMMDD.HHMM`); left as a variable so it is never baked in.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(LIFELOG_BUNDLE_ID)]
