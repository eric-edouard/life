steps:
  - echo: "Note: SwiftUI identifiers (library-row, conversation.copy, conversation.follow, player.play, passage-speaker) are visible to raw await-ui-element only, not to tap/assert, so taps are by coordinate (iPhone 17). Opens the top row (Condo call with Somchai)."
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.384
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: conversation.copy
      timeoutMs: 8000
  - await:
      idle: true
  - echo: Play; the passage highlight should follow.
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.909
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: player.play
        text: Pause
      timeoutMs: 5000
  - wait: 3000
  - echo: Scroll by hand; a Follow button appears. Tap it to resume following.
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.7
      toX: 0.5
      toY: 0.25
      durationMs: 400
      momentum: false
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: conversation.follow
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.773
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        identifier: conversation.follow
  - echo: Pause, then tap a passage; it seeks there and plays.
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.906
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: player.play
        text: Play
  - await:
      idle: true
  - tool: gesture-tap
    args:
      x: 0.4
      y: 0.62
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: player.play
        text: Pause
  - echo: Let the page finish scrolling to the passage before pausing.
  - wait: 1500
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.906
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: player.play
        text: Play
  - await:
      idle: true
  - echo: Long-press a word; the edit menu appears without seeking. Copy it, then Copy transcript.
  - tool: gesture-custom
    args:
      events:
        - type: Down
          x: 0.3
          y: 0.70
        - type: Up
          x: 0.3
          y: 0.70
          delayMs: 900
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Look Up
  - tap:
      text: Copy
  - tap:
      id: document.on.document
  - echo: The long-press turned following off; tap Follow so the active passage is pinned, then drag the scrubber from the start of the track to about 3:00.
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: conversation.follow
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.773
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        identifier: conversation.follow
  - tool: gesture-custom
    args:
      events:
        - type: Down
          x: 0.09
          y: 0.835
        - type: Move
          x: 0.2
          y: 0.835
          delayMs: 150
        - type: Up
          x: 0.6
          y: 0.835
          delayMs: 300
      interpolate: 8
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: of 5 minutes
  - await:
      idle: true
  - echo: Tap the speaker label of the passage after the pinned one; the speaker sheet opens. Cancel it.
  - tool: gesture-tap
    args:
      x: 0.156
      y: 0.402
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: This passage
  - await:
      idle: true
  - tap:
      text: Cancel
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: This passage
  - tap:
      id: chevron.backward
executionPrerequisite: State left by library-browse-search (healthyRecording + fixtureLibrary launch, Library tab at the top of the list after 'Show the newest', search closed, nothing playing).
